appId: io.github.benitbuhner.zenium
productName: Zenium
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!.github/**'
  - '!android/**'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vite.android.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# afterPack: macOS ad-hoc sign (no Developer ID) plus Windows arm64 NSIS 7z filter pin
# (7za 24.09 ARM64 coder 0a is unreadable by nsis7z.dll; x64 stays on 7za's default BCJ2).
afterPack: ./build/after-pack.mjs
# Automatic updates (electron-updater). This block makes electron-builder write `app-update.yml`
# into the packaged app and emit the `latest*.yml` feed files next to every installer, even with
# `--publish never` (the Release workflow uploads them itself). The app never uses it to discover
# releases: it reads the release's update-manifest.json first and then points electron-updater at
# that exact release (src/main/platform/updates.ts).
publish:
  provider: github
  owner: BenItBuhner
  repo: Zenium
  releaseType: release
# Every artifact name carries the CPU architecture so that the x64 and arm64 builds of one release
# can sit next to each other on the GitHub release page (see .github/workflows/release.yml).
win:
  executableName: zenium
  # One NSIS installer per architecture. Build one arch per electron-builder invocation
  # (--x64 / --arm64); asking for both at once merges them into a single installer.
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # The app used to be "Zen" (appId app.zen-browser.chromium); Windows sees Zenium as a different
  # program. The include removes the old installation silently and keeps its user data for the
  # app to migrate on first launch (src/main/platform/legacyPaths.ts).
  include: build/installer.nsh
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    # Squirrel.Mac (the updater behind electron-updater on macOS) installs from a zip, not a DMG.
    # Only usable once the app is code-signed; unsigned builds fall back to opening the DMG.
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${name}-${version}-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Zenium requests access to the device's camera for websites that ask for it.
    - NSMicrophoneUsageDescription: Zenium requests access to the device's microphone for websites that ask for it.
    - NSDownloadsFolderUsageDescription: Zenium saves downloaded files to your Downloads folder.
  # Notarization only runs after a successful code signature and only when the Apple credentials
  # (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) are in the environment; without them
  # electron-builder logs "skipped macOS notarization" and carries on.
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  executableName: zenium
  target:
    - AppImage
    - deb
  maintainer: Bennett Buhner <136861830+BenItBuhner@users.noreply.github.com>
  category: Network
deb:
  # The package was called zen-chromium before the rename. Conflicts + Replaces make dpkg and apt
  # remove that package when this one is installed instead of leaving two browsers side by side.
  fpm:
    - --conflicts
    - zen-chromium
    - --replaces
    - zen-chromium
    - --provides
    - zen-chromium
  # electron-builder's own scripts plus a `zen-chromium` command alias (the old package's binary
  # name) kept for one release so agent configs that launch it with --mcp keep working.
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
