<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Shop - Sign in</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>Demo Shop</header>
<main>
  <h1>Sign in</h1>
  <p class="lead">Use your Demo Shop account.</p>
  <form action="/session" method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
