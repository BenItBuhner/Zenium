<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Probe popup</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        width: 320px;
        font:
          15px/1.4 system-ui,
          sans-serif;
        color: #1c1c1e;
        background: #fff;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 12px;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 12px;
        margin: 0;
      }
      dt {
        color: #6b7280;
      }
      dd {
        margin: 0;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>Zenium probe popup</h1>
    <dl>
      <dt>Origin</dt>
      <dd id="origin"></dd>
      <dt>Active tab</dt>
      <dd id="tab">…</dd>
      <dt>storage.local</dt>
      <dd id="storage">…</dd>
      <dt>Background</dt>
      <dd id="bg">…</dd>
      <dt>executeScript</dt>
      <dd id="exec">…</dd>
    </dl>
    <script src="popup.js"></script>
  </body>
</html>
