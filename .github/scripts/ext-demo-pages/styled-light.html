<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Styled light page</title>
    <style>
      body {
        background: #ffffff;
        color: #111111;
        font: 18px system-ui;
        padding: 40px;
      }
      h1 {
        color: #222222;
      }
      .card {
        background: #f4f4f4;
        border: 1px solid #dddddd;
        padding: 16px;
      }
      a {
        color: #0645ad;
      }
    </style>
  </head>
  <body>
    <h1>Styled light page</h1>
    <p>A light page whose colours come from a stylesheet, not from style attributes.</p>
    <div class="card">
      <p>Dark-mode extensions that rewrite the page's stylesheets should darken this card.</p>
      <p><a href="#">A link in the card</a></p>
    </div>
  </body>
</html>
