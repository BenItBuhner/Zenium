<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Probe image gallery</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        background: #ffffff;
        color: #111;
        font: 18px system-ui;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 320px);
        gap: 16px;
      }
      img {
        display: block;
        width: 320px;
        height: 240px;
      }
    </style>
  </head>
  <body>
    <h1>Image gallery</h1>
    <p>Four 320 by 240 pictures: image downloader extensions list and save them.</p>
    <div class="grid">
      <img src="photo-1.png" alt="Red picture" />
      <img src="photo-2.png" alt="Blue picture" />
      <img src="photo-3.png" alt="Green picture" />
      <img src="photo-4.png" alt="Amber picture" />
    </div>
  </body>
</html>
