name: Android background video demo

# Records background video per site (matrix MED-08 / EDGE-32, services pass 10) on a
# hardware-accelerated Android emulator: the loopback clip with sound, inline, under the default
# (block) – a plain <video> with no script paused by the engine itself on Home, and the site that
# pauses itself on visibilitychange – then the site allowed through the core's `permissions.set`
# (no UI): Home with the audio playing on for thirty seconds (the page still visible to itself,
# no visibilitychange, the media notification the session's with Pause, the foreground service
# up), the screen locked and still playing, the unlock and the return with nothing heard; the
# same with picture-in-picture denied to the app; Pause from the notification while away letting
# the held hide through. Every check is a line of services-pass-10-media-android-notes.txt in
# the artifact; a FAIL fails the run once the stills are taken. Dispatch-only, like the other
# demos: it says nothing about a change being correct beyond what the notes record. The build,
# the emulator and the Gradle cache live in android-emulator-demo.yml; this file only picks the
# driver. One more boot when the emulator itself went away under the driver (adb lost the
# device), and never when the driver failed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-background-video-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Background video demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.BackgroundVideoDemo
        DEMO_DIR=media-demo
        DEMO_OUT=artifacts/android-background-video-demo
        DEMO_VIDEO=services-pass-10-media-android-run.mp4
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-background-video-demo
      artifact-path: artifacts/android-background-video-demo/

  record-again:
    name: Background video demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.BackgroundVideoDemo
        DEMO_DIR=media-demo
        DEMO_OUT=artifacts/android-background-video-demo
        DEMO_VIDEO=services-pass-10-media-android-run.mp4
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-background-video-demo-second-boot
      artifact-path: artifacts/android-background-video-demo/
