name: Android tablet private mode demo

# Records the TABLET SIDEBAR's private mode (W4-11: the private-browsing rule of
# docs/project-context.md, design language v2 §9.36 and §9.19, INC-05 / #250's lock) on a
# hardware-accelerated emulator of the pixel_tablet profile laid out at 1280 x 800 dp at one px
# per dp (`wm size 1280x800`, `wm density 160`, as the tablet layout demo), and uploads the video,
# the stills and the driver's findings. The scenes: the sidebar's REGULAR POSE with the seeded
# space's rows and nothing private; the app menu's New Private Tab turning the sidebar to its
# PRIVATE POSE – the window re-inked private, the mask's header with the count, the session's
# rows alone, New Private Tab as a row, the mask in the pill – and its own New Private Tab row
# opening a second tab; the overview's Tabs pane bringing a regular tab back with the private
# session open behind it, the regular pose again with THE LEAK'S CLAIM read off the DOM (no
# private row, no private title in the sidebar's text, no Private header, the scheme's ink); the
# Private pane's card bringing the private pose back; the rail with the mask alone for the
# header; Home and back arming #250's lock, the frame's cover over the page and the sidebar's
# rows under the VEIL (every row "Private tab" behind the mask, the list inert and hidden from
# accessibility, the pill reading "Private tab", nothing of the pages in the accessibility tree);
# Unlock under a finger and the PIN lifting the cover and the veil, the titles coming back; and
# the menu's Close Private Tabs ending the session, the regular pose with the seeded rows. The
# driver judges every step from the chrome's and the core's own state and fails the run when a
# claim does not hold; see TabletPrivateDemo.kt. A device PIN is set for the run by the driver
# (`locksettings set-pin 1234` through UiAutomation's shell, cleared at the end): the emulator
# has no enrolled biometric, so `BiometricPrompt` falls back to SystemUI's PIN view, which the
# driver answers as the private lock demo does (the digits as key events, then Enter).
#
# The engine, as the private tabs and private lock demos: private tabs run on a WebView profile
# of their own, which needs WebViewFeature.MULTI_PROFILE, and the API 34 images' WebView 113 does
# not have it, so the demo runs on an AOSP image with a Chromium snapshot SystemWebView.apk
# swapped in (android-webview-swap.sh), under swiftshader_indirect (the snapshot WebView draws
# one chrome frame every 1.3-3.5 s under the shared swangle default with a sheet up). Dispatch-
# only, like the other demos: it takes about a quarter of an hour and says nothing about a change
# being correct. The build, the emulator and the Gradle cache live in android-emulator-demo.yml;
# this file picks the driver, the profile, the display and the engine. The nightly sweep runs the
# same driver on its `tablet-webview` shard (.github/nightly-drivers.json).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tablet-private-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Tablet private mode demo (Chromium snapshot WebView on an AOSP image)
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # A tablet AVD: the driver's claims are about the sidebar a 600 dp+ short side docks.
      profile: pixel_tablet
      api-level: '34'
      target: default
      emulator-gpu: swiftshader_indirect
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -writable-system
      script-env: |
        DEMO_CLASS=app.zen.chromium.TabletPrivateDemo
        DEMO_DIR=tablet-private-demo
        DEMO_OUT=artifacts/android-tablet-private-demo
        DEMO_VIDEO=android-tablet-private-demo.mp4
        DEMO_DISPLAY=1280x800@160
        WEBVIEW_APK=artifacts/webview/SystemWebView.apk
      # The plain `Android` snapshot is armeabi-v7a only and its libwebviewchromium.so cannot be
      # dlopen'ed on an x86_64 emulator; `AndroidDesktop_x64` ships the same com.android.webview
      # (minSdk 29) with x86_64 and x86 native code.
      setup-script: |
        base=https://commondatastorage.googleapis.com/chromium-browser-snapshots/AndroidDesktop_x64
        rev=$(curl -fsSL "$base/LAST_CHANGE")
        echo "chromium snapshot revision $rev"
        curl -fsSL -o /tmp/chrome-android-desktop.zip "$base/$rev/chrome-android-desktop.zip"
        mkdir -p artifacts/webview
        unzip -j -o /tmp/chrome-android-desktop.zip chrome-android-desktop/apks/SystemWebView.apk -d artifacts/webview
        rm -f /tmp/chrome-android-desktop.zip
        curl -fsSL "$base/$rev/REVISIONS" > artifacts/webview/REVISIONS.json
        unzip -l artifacts/webview/SystemWebView.apk | grep -E "lib/[^/]+/libwebviewchromium.so"
        ls -la artifacts/webview
      artifact-name: android-tablet-private-demo
      artifact-path: artifacts/android-tablet-private-demo/
      timeout-minutes: 60

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Tablet private mode demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      profile: pixel_tablet
      api-level: '34'
      target: default
      emulator-gpu: swiftshader_indirect
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -writable-system
      script-env: |
        DEMO_CLASS=app.zen.chromium.TabletPrivateDemo
        DEMO_DIR=tablet-private-demo
        DEMO_OUT=artifacts/android-tablet-private-demo
        DEMO_VIDEO=android-tablet-private-demo.mp4
        DEMO_DISPLAY=1280x800@160
        WEBVIEW_APK=artifacts/webview/SystemWebView.apk
      setup-script: |
        base=https://commondatastorage.googleapis.com/chromium-browser-snapshots/AndroidDesktop_x64
        rev=$(curl -fsSL "$base/LAST_CHANGE")
        echo "chromium snapshot revision $rev"
        curl -fsSL -o /tmp/chrome-android-desktop.zip "$base/$rev/chrome-android-desktop.zip"
        mkdir -p artifacts/webview
        unzip -j -o /tmp/chrome-android-desktop.zip chrome-android-desktop/apks/SystemWebView.apk -d artifacts/webview
        rm -f /tmp/chrome-android-desktop.zip
        curl -fsSL "$base/$rev/REVISIONS" > artifacts/webview/REVISIONS.json
        unzip -l artifacts/webview/SystemWebView.apk | grep -E "lib/[^/]+/libwebviewchromium.so"
        ls -la artifacts/webview
      artifact-name: android-tablet-private-demo-second-boot
      artifact-path: artifacts/android-tablet-private-demo/
      timeout-minutes: 60
