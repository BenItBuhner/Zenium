name: Android site controls demo (temporary, branch only)

on:
  push:
    branches: [cursor/services-site-controls-24d1]

permissions:
  contents: read

jobs:
  record:
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver picks the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.SiteControlsDemo
        DEMO_DIR=site-controls-demo
        DEMO_OUT=artifacts/android-site-controls-demo
        DEMO_VIDEO=services-site-controls-android-run.mp4
      artifact-name: android-site-controls-demo
      artifact-path: artifacts/android-site-controls-demo/
