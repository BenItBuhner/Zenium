name: Desktop ARM64 NSIS check

# Temporary verification for WIN-002: the ARM64 NSIS installer must extract
# zenium.exe and the Chromium DLLs, then the installed app must boot.
# Push-triggered on this branch only; removed before the PR is marked ready.

on:
  push:
    branches: ['cursor/desktop-arm64-nsis-fix-76ee']

permissions:
  contents: read

concurrency:
  group: desktop-arm64-nsis-check-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  nsis:
    name: nsis-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: windows-11-arm
          - arch: x64
            os: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      CHECK_OUT: ${{ github.workspace }}\nsis-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bundle main, preload and renderer
        run: npx electron-vite build
      - name: Harness (Playwright for Electron) from the runner-smoke branch
        run: |
          git fetch --depth=1 origin cursor/desktop-winmac-runner-smoke-80ca
          git checkout origin/cursor/desktop-winmac-runner-smoke-80ca -- .github/smoke
      - name: Install Playwright
        working-directory: .github/smoke
        run: npm i --no-save playwright

      - name: Record 7z methods before the ARM64 filter pin
        if: matrix.arch == 'arm64'
        env:
          ZENIUM_SKIP_NSIS_7Z_FILTER: '1'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:CHECK_OUT" | Out-Null
          npx electron-builder --win nsis --arm64 --publish never
          $seven = $null
          foreach ($p in @(
            'C:\Program Files\7-Zip\7z.exe',
            'C:\Program Files (x86)\7-Zip\7z.exe',
            'C:\ProgramData\chocolatey\bin\7z.exe'
          )) { if (Test-Path $p) { $seven = $p; break } }
          if (-not $seven) {
            $cmd = Get-Command 7z -ErrorAction SilentlyContinue
            if ($cmd) { $seven = $cmd.Source }
          }
          if (-not $seven) { throw '7-Zip not found on this runner' }
          $setup = Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no NSIS setup.exe in dist/' }
          $extract = Join-Path $env:CHECK_OUT 'payload-before'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & $seven x -y "-o$extract" $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "7z x installer failed: $LASTEXITCODE" }
          $archive = Get-ChildItem -Path $extract -Recurse -Filter 'app-*.7z' | Select-Object -First 1
          if (-not $archive) { throw "no app-*.7z inside $extract" }
          $listing = & $seven l -slt $archive.FullName | Out-String
          Set-Content -Path (Join-Path $env:CHECK_OUT 'methods-before.txt') -Value $listing -Encoding utf8
          $rows = @(); $path = $null; $method = $null
          foreach ($line in ($listing -split "`r?`n")) {
            if ($line -match '^Path = (.+)$') { $path = $Matches[1] }
            elseif ($line -match '^Method = (.+)$') { $method = $Matches[1] }
            elseif ($line.Trim() -eq '' -and $path) {
              $rows += [pscustomobject]@{ Path = $path; Method = $method }
              $path = $null; $method = $null
            }
          }
          $pe = $rows | Where-Object { $_.Path -match 'zenium\.exe$|\.dll$' }
          $pe | Format-Table -AutoSize | Out-String -Width 200 | Tee-Object -FilePath (Join-Path $env:CHECK_OUT 'methods-before-pe.txt')
          $arm64 = @($pe | Where-Object { $_.Method -match 'ARM64' }).Count
          "peEntries=$($pe.Count) arm64Filter=$arm64" | Tee-Object -FilePath (Join-Path $env:CHECK_OUT 'methods-before-summary.txt')
          Remove-Item dist\*.nsis.7z, dist\*setup.exe, dist\*.blockmap -ErrorAction SilentlyContinue

      - name: Package the NSIS installer
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never

      - name: Record 7z methods after packaging
        run: |
          New-Item -ItemType Directory -Force -Path "$env:CHECK_OUT" | Out-Null
          $seven = $null
          foreach ($p in @(
            'C:\Program Files\7-Zip\7z.exe',
            'C:\Program Files (x86)\7-Zip\7z.exe',
            'C:\ProgramData\chocolatey\bin\7z.exe'
          )) { if (Test-Path $p) { $seven = $p; break } }
          if (-not $seven) {
            $cmd = Get-Command 7z -ErrorAction SilentlyContinue
            if ($cmd) { $seven = $cmd.Source }
          }
          if (-not $seven) { throw '7-Zip not found on this runner' }
          $setup = Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no NSIS setup.exe in dist/' }
          "installer=$($setup.FullName) size=$($setup.Length) sevenZip=$seven"
          $extract = Join-Path $env:CHECK_OUT 'payload-after'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          New-Item -ItemType Directory -Path $extract | Out-Null
          & $seven x -y "-o$extract" $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "7z x installer failed: $LASTEXITCODE" }
          $archive = Get-ChildItem -Path $extract -Recurse -Filter 'app-*.7z' | Select-Object -First 1
          if (-not $archive) { throw "no app-*.7z inside $extract" }
          "archive=$($archive.FullName) size=$($archive.Length)"
          $listing = & $seven l -slt $archive.FullName | Out-String
          Set-Content -Path (Join-Path $env:CHECK_OUT 'methods-after.txt') -Value $listing -Encoding utf8
          $rows = @(); $path = $null; $method = $null
          foreach ($line in ($listing -split "`r?`n")) {
            if ($line -match '^Path = (.+)$') { $path = $Matches[1] }
            elseif ($line -match '^Method = (.+)$') { $method = $Matches[1] }
            elseif ($line.Trim() -eq '' -and $path) {
              $rows += [pscustomobject]@{ Path = $path; Method = $method }
              $path = $null; $method = $null
            }
          }
          $rows | Format-Table -AutoSize | Out-String -Width 220 | Tee-Object -FilePath (Join-Path $env:CHECK_OUT 'methods-after-table.txt')
          $pe = $rows | Where-Object { $_.Path -match 'zenium\.exe$|\.dll$' }
          $pe | Format-Table -AutoSize | Out-String -Width 200 | Tee-Object -FilePath (Join-Path $env:CHECK_OUT 'methods-after-pe.txt')
          $arm64 = @($pe | Where-Object { $_.Method -match 'ARM64' }).Count
          "peEntries=$($pe.Count) arm64Filter=$arm64"
          if ($arm64 -gt 0) { throw "payload still has $arm64 PE entries with the ARM64 filter" }

      - name: Dismiss OOBE on windows-11-arm
        run: |
          New-Item -ItemType Directory -Force -Path "$env:CHECK_OUT" | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\smoke\win-mouse.ps1" -Action dismiss-oobe | Tee-Object -FilePath "$env:CHECK_OUT\oobe-dismiss.json"

      - name: Install silently and assert zenium.exe plus DLLs
        run: |
          $setup = (Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1).FullName
          if (-not $setup) { throw 'no setup.exe' }
          "installing $setup"
          $p = Start-Process -Wait -FilePath $setup -ArgumentList '/S' -PassThru
          "installerExit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          Get-Process -Name 'zenium' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $dir = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Zenium'),
            (Join-Path $env:LOCALAPPDATA 'Programs\zenium')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dir) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue | Format-Table Name, FullName
            throw 'install directory not found under LOCALAPPDATA\Programs'
          }
          "installDir=$dir"
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Tee-Object -FilePath (Join-Path $env:CHECK_OUT 'install-listing.txt')
          $required = @(
            'zenium.exe',
            'ffmpeg.dll',
            'd3dcompiler_47.dll',
            'dxcompiler.dll',
            'dxil.dll',
            'vk_swiftshader.dll',
            'vulkan-1.dll'
          )
          $missing = @()
          foreach ($name in $required) {
            $path = Join-Path $dir $name
            if (Test-Path $path) { "$name OK $((Get-Item $path).Length)" } else { $missing += $name; "$name MISSING" }
          }
          if ($missing.Count -gt 0) { throw "missing: $($missing -join ', ')" }
          Set-Content -Path (Join-Path $env:CHECK_OUT 'install-dir.txt') -Value $dir -Encoding utf8

      - name: Launch the installed exe with Playwright
        timeout-minutes: 12
        run: |
          $exe = Join-Path (Get-Content (Join-Path $env:CHECK_OUT 'install-dir.txt') -Raw).Trim() 'zenium.exe'
          if (-not (Test-Path $exe)) { throw "exe not found: $exe" }
          node "$env:GITHUB_WORKSPACE\.github\smoke\smoke.mjs" --exe $exe --label nsis-installed --out "$env:CHECK_OUT" --scenarios boot
          $resultPath = Join-Path $env:CHECK_OUT 'nsis-installed\result.json'
          if (-not (Test-Path $resultPath)) { throw 'smoke result.json missing' }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          $result.verdict | ConvertTo-Json -Depth 6
          if (-not $result.verdict.boot.booted) { throw 'Playwright boot did not render chrome' }

      - name: Screenshot the installed app
        if: always()
        run: |
          $fromSmoke = Get-ChildItem (Join-Path $env:CHECK_OUT 'nsis-installed') -Filter '*.png' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($fromSmoke) { Copy-Item $fromSmoke.FullName (Join-Path $env:CHECK_OUT 'installed-and-launched.png') -Force }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\smoke\win-screenshot.ps1" -Path (Join-Path $env:CHECK_OUT 'desktop-after-boot.png')

      - name: Uninstall silently
        if: always()
        run: |
          $dirFile = Join-Path $env:CHECK_OUT 'install-dir.txt'
          if (-not (Test-Path $dirFile)) { Write-Output 'no install dir recorded'; return }
          $dir = (Get-Content $dirFile -Raw).Trim()
          Get-Process -Name 'zenium' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1
          $uninst = Get-ChildItem $dir -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninst) { Write-Output "no uninstaller in $dir"; return }
          $p = Start-Process -Wait -FilePath $uninst.FullName -ArgumentList '/currentuser','/S',"_?=$dir" -PassThru
          "uninstallExit=$($p.ExitCode)"

      - name: Summary
        if: always()
        run: |
          Get-ChildItem dist -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table -AutoSize
          Get-ChildItem -Recurse $env:CHECK_OUT -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
          $summary = $env:GITHUB_STEP_SUMMARY
          "## nsis-${{ matrix.arch }}" | Add-Content $summary
          foreach ($f in @('methods-before-pe.txt','methods-after-pe.txt','methods-before-summary.txt','install-listing.txt')) {
            $p = Join-Path $env:CHECK_OUT $f
            if (Test-Path $p) {
              "### $f" | Add-Content $summary
              '```' | Add-Content $summary
              Get-Content $p | Add-Content $summary
              '```' | Add-Content $summary
            }
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nsis-check-${{ matrix.arch }}
          path: |
            nsis-check
            dist/*setup.exe
          if-no-files-found: warn
          retention-days: 7
