name: TEMPORARY - compat round 21b restart lane trigger

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml (HTTP 403 on the dispatches endpoint), and it stays dispatch-only;
# this file runs the same job on a push to the branch, and only for an EMPTY marker commit whose
# subject starts with the bracketed token below and carries no other bracketed word:
#   - `[lane]`: Adblock Ad Blocker Pro's row (rank 535, `dgjbaljgolmlcmmklmmeafecikidmjpi`) alone
#     on both WebViews. With one row in the list, the driver's post-sweep restart proof
#     (`CompatSweep.restoredOptionsTab`: the first row whose options page graded P, enabled again,
#     its options page opened as a tab, then `launch()` – a second activity, host, chrome and core
#     IN THE SAME PROCESS) runs on this row, exactly as round 21's 156 second boot did when the
#     new core's configure of the same 91 units arrived at heap 158/192 MB and died at
#     `ExtensionScripts.documentStart` on the carrier builder's one doubling (R22-0). The measure:
#     the new core's configure completing with the app alive on both WebViews, its arrival heap
#     well under 158 MB (the first runtime's units released at `Extensions.destroy()`), no
#     builder growth (the `configured` line's pre-size against the final length), and the Java
#     peak's margin against the limit.
# One run per marker push; a re-run past the one attempt is the coordinator's to grant.
on:
  push:
    branches:
      - cursor/android-ext-oom-restart-4435

permissions:
  contents: read

concurrency:
  group: tmp-ext-android-27-sweep-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lane-system-webview:
    if: contains(github.event.head_commit.message, '[lane]')
    name: Targeted rows - System WebView (API 34 image)
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-ext-compat-sweep.sh
      artifact-name: android-ext-compat-sweep-lane
      artifact-path: artifacts/android-ext-compat-sweep/
      script-env: |
        SWEEP_ONLY=dgjbaljgolmlcmmklmmeafecikidmjpi
        SWEEP_LAST=
      timeout-minutes: 75

  lane-modern-webview:
    if: contains(github.event.head_commit.message, '[lane]')
    name: Targeted rows - Best effort - Chromium snapshot WebView on an AOSP image
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-ext-compat-sweep.sh
      artifact-name: android-ext-compat-sweep-lane-modern-webview
      artifact-path: artifacts/android-ext-compat-sweep/
      target: default
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -writable-system
      script-env: |
        WEBVIEW_APK=artifacts/webview/SystemWebView.apk
        SOFT_FAIL=1
        SWEEP_ONLY=dgjbaljgolmlcmmklmmeafecikidmjpi
        SWEEP_LAST=
      setup-script: |
        base=https://commondatastorage.googleapis.com/chromium-browser-snapshots/AndroidDesktop_x64
        rev=$(curl -fsSL "$base/LAST_CHANGE")
        echo "chromium snapshot revision $rev"
        curl -fsSL -o /tmp/chrome-android-desktop.zip "$base/$rev/chrome-android-desktop.zip"
        mkdir -p artifacts/webview
        unzip -j -o /tmp/chrome-android-desktop.zip chrome-android-desktop/apks/SystemWebView.apk -d artifacts/webview
        rm -f /tmp/chrome-android-desktop.zip
        curl -fsSL "$base/$rev/REVISIONS" > artifacts/webview/REVISIONS.json
        unzip -l artifacts/webview/SystemWebView.apk | grep -E "lib/[^/]+/libwebviewchromium.so"
        ls -la artifacts/webview
      timeout-minutes: 75
