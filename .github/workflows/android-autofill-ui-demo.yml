name: Android autofill UI demo (temporary, branch only)

# Temporary caller for the services-password-fill UI branch's merge-step re-round: records the
# AutofillDemo driver under the driver rule of #198 (the chrome's save prompt sheets, the account,
# address and card picker strips with the PIN re-authentication, Settings > Autofill with the
# clipboard sheet, the address sheet and editor with its country sheet, the card sheet and editor,
# each control pressed inside a sheet under a real finger with its effect asserted; sensitive
# clipboard, autofill provider setting) on an emulator. Removed after the run.
on:
  push:
    branches: [cursor/services-password-fill-ui-24d1]

permissions:
  contents: read

concurrency:
  group: android-autofill-ui-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.AutofillDemo
        DEMO_DIR=autofill-demo
        DEMO_OUT=artifacts/android-autofill-ui-demo
        DEMO_VIDEO=services-password-fill-android-ui.mp4
      artifact-name: android-autofill-ui-demo
      artifact-path: artifacts/android-autofill-ui-demo/

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Autofill UI demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.AutofillDemo
        DEMO_DIR=autofill-demo
        DEMO_OUT=artifacts/android-autofill-ui-demo
        DEMO_VIDEO=services-password-fill-android-ui.mp4
      artifact-name: android-autofill-ui-demo-second-boot
      artifact-path: artifacts/android-autofill-ui-demo/
