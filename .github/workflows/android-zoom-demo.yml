name: Android zoom sheet demo

# Records the page zoom sheet on an emulator: "Zoom…" in the app menu docking the sheet under a
# live page, the slider dragged with the page laying itself out again at every level, the plus
# step, Reset, the back gesture sliding the sheet out, the site's zoom back after a reload and
# listed under Settings > Accessibility, "Remembered for <site>" in the sheet opened again; then
# the page controls sections the first recording never reached: the colour scheme flipping the
# page's prefers-color-scheme live, Dark Theme for This Site with its exception, Force enable
# zoom, the Accessibility default zoom and Include system font size.
# Dispatch-only, like the page controls demo: it takes about ten minutes and says nothing about
# a change being correct. The build, the emulator and the Gradle cache live in
# android-emulator-demo.yml; this file only picks the driver and the demo it runs.
on:
  workflow_dispatch:
  # TEMPORARY: the authorised run from this branch (dispatch needs the workflow on main); removed
  # once it has run.
  push:
    branches: [cursor/android-zoom-sheet-a814]

permissions:
  contents: read

concurrency:
  group: android-zoom-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Zoom sheet demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.ZoomSheetDemo
        DEMO_DIR=zoom-demo
        DEMO_OUT=artifacts/android-zoom-demo
        DEMO_VIDEO=android-zoom-demo.mp4
        DEMO_THEME=dark
      # The guest kernel's console in the log, should the emulator go away mid-demo.
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-zoom-demo
      artifact-path: artifacts/android-zoom-demo/

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Zoom sheet demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.ZoomSheetDemo
        DEMO_DIR=zoom-demo
        DEMO_OUT=artifacts/android-zoom-demo
        DEMO_VIDEO=android-zoom-demo.mp4
        DEMO_THEME=dark
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-zoom-demo-second-boot
      artifact-path: artifacts/android-zoom-demo/
