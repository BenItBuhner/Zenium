name: TEMPORARY W6-S25-c media screen-on demo

# TEMPORARY, branch-scoped: removed before the branch goes READY. Runs MediaScreenOnDemo on the
# emulator through the shared wrapper on every push of this lane's branch.
on:
  push:
    branches:
      - cursor/android-media-screen-on-stylus-9271

permissions:
  contents: read

concurrency:
  group: tmp-w6s25c-media-screen-on-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Media screen-on demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.MediaScreenOnDemo
        DEMO_DIR=media-demo
        DEMO_OUT=artifacts/android-media-screen-on-demo
        DEMO_VIDEO=w6-s25c-media-screen-on-run.mp4
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-media-screen-on-demo
      artifact-path: artifacts/android-media-screen-on-demo/

  record-again:
    name: Media screen-on demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.MediaScreenOnDemo
        DEMO_DIR=media-demo
        DEMO_OUT=artifacts/android-media-screen-on-demo
        DEMO_VIDEO=w6-s25c-media-screen-on-run.mp4
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-media-screen-on-demo-second-boot
      artifact-path: artifacts/android-media-screen-on-demo/
