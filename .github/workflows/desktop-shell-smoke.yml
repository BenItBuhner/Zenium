name: Desktop shell smoke (Windows, macOS)

# Temporary verification for the window-shell branch. Removed in the last commit before review.

on:
  push:
    branches: ['cursor/desktop-window-shell-4efc']

permissions:
  contents: read

concurrency:
  group: desktop-shell-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    env:
      SMOKE_OUT: ${{ github.workspace }}/smoke-out
      SMOKE: ${{ github.workspace }}/.github/smoke
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bundle main, preload and renderer
        run: npx electron-vite build
      - name: Package an unpacked build
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "windows" ]; then
            npx electron-builder --win --dir --x64 --publish never
          else
            npx electron-builder --mac --dir --arm64 --publish never
          fi
      - name: Pull the runner smoke helpers
        shell: bash
        run: |
          git fetch --depth=1 origin cursor/desktop-winmac-runner-smoke-80ca
          git checkout origin/cursor/desktop-winmac-runner-smoke-80ca -- .github/smoke
      - name: Harness dependencies (Playwright for Electron)
        working-directory: .github/smoke
        run: npm i --no-save playwright
      - name: Dismiss Windows OOBE if present
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:SMOKE_OUT" | Out-Null
          if (Test-Path "$env:SMOKE\win-mouse.ps1") {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-mouse.ps1" -Action dismiss-oobe | Tee-Object -FilePath "$env:SMOKE_OUT\oobe-dismiss.json"
          }
      - name: Run shell smoke
        timeout-minutes: 25
        shell: bash
        run: |
          mkdir -p "$SMOKE_OUT"
          if [ "${{ matrix.name }}" = "windows" ]; then
            exe="dist/win-unpacked/zenium.exe"
            ls -la dist dist/win-unpacked || true
            echo "exe: $exe"
            node "$SMOKE/shell-smoke.mjs" --exe "$exe" --out "$SMOKE_OUT"
          else
            app="dist/mac-arm64/Zenium.app"
            ls -la dist dist/mac-arm64 || true
            echo "app: $app"
            node "$SMOKE/shell-smoke.mjs" --exe "$app/Contents/MacOS/Zenium" --out "$SMOKE_OUT"
          fi
      - name: Summarise checks
        if: always()
        shell: bash
        run: |
          if [ -f "$SMOKE_OUT/summary.txt" ]; then cat "$SMOKE_OUT/summary.txt"; else echo "no summary"; fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-shell-smoke-${{ matrix.name }}
          path: smoke-out
          if-no-files-found: warn
