name: Android blocking sets demo (temporary, branch only)

# TEMPORARY per-branch caller for the services-blocking-sets-files verification (PR #210);
# removed before the PR is marked ready. Records BlockingDemo (androidTest) on the API 34
# emulator: the boot with a uBOL-sized set document under blocking/sets/, and a rule update
# that rewrites one set document.
on:
  push:
    branches: [cursor/services-blocking-sets-files-24d1]

permissions:
  contents: read

jobs:
  record:
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.BlockingDemo
        DEMO_DIR=blocking-demo
        DEMO_OUT=artifacts/android-blocking-sets-demo
        DEMO_VIDEO=services-blocking-sets-android-demo.mp4
      artifact-name: android-blocking-sets-demo
      artifact-path: artifacts/android-blocking-sets-demo/
