name: Android Custom Tabs demo

on:
  push:
    branches:
      - cursor/android-custom-tabs-d298

permissions:
  contents: read

jobs:
  record:
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.CustomTabsDemo
        DEMO_DIR=custom-tabs-demo
        DEMO_OUT=artifacts/android-custom-tabs-demo
        DEMO_VIDEO=android-customtabs-demo.mp4
      artifact-name: android-custom-tabs-demo
      artifact-path: artifacts/android-custom-tabs-demo/
