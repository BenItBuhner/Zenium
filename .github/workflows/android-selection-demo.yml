name: Android selection toolbar demo

# Records the text-selection toolbar with Zenium's items on an emulator (parity row GN-13, and
# SH-10's Share): an injected long press on a word brings the system's floating toolbar with
# Copy, then Search Zenium and Share; a real touch on Search Zenium opens the query in a new
# background tab; a touch on Share brings the system share sheet; a long press on an address
# written as plain text lists Open in Glance, and a touch on it opens the glance; then the same
# toolbar in dark for the design record. The driver writes `selection-findings.txt` with a PASS
# or FAIL per check and fails when any did. Dispatch-only, like the other demos: it takes about
# ten minutes. The build, the emulator and the Gradle cache live in android-emulator-demo.yml;
# this file only picks the driver and the demo it runs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-selection-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Selection toolbar demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.SelectionDemo
        DEMO_DIR=selection-demo
        DEMO_OUT=artifacts/android-selection-demo
        DEMO_VIDEO=android-selection-demo.mp4
      artifact-name: android-selection-demo
      artifact-path: artifacts/android-selection-demo/

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Selection toolbar demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.SelectionDemo
        DEMO_DIR=selection-demo
        DEMO_OUT=artifacts/android-selection-demo
        DEMO_VIDEO=android-selection-demo.mp4
      artifact-name: android-selection-demo-second-boot
      artifact-path: artifacts/android-selection-demo/
