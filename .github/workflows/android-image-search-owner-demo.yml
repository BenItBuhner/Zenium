name: Android image search owner demo

# The frame-owner image-search protocol's on-device scene (internal/parity-services/
# frame-owner-protocol-interface.md §7.3; the two halves #605 and #606 at v: 1): a top document
# on one loopback origin hooks window.fetch, Image, XMLHttpRequest and Response.prototype.arrayBuffer
# and logs every URL they see to its title; it embeds a cross-origin iframe (a second loopback
# address) showing one image. A real hold on the framed image, a real touch on "Search Image with
# Google Lens" – the seeded default engine points at the FIXTURE's own upload endpoint (a third
# loopback address), never the real Google – then the assertions: (a) the upload's multipart POST
# landed under `Origin: null` with its `image.jpg` part, (b) the top document's log names no URL of
# the frame's origin (the proof of the fix: the old path fetched a framed image from the top
# document's world), (b2) the same with the image in the top document (the main frame is owner),
# (b3) a framed image cross-origin to its frame without CORS → `opaque` → the address route opens
# the engine's URL page and the top log is still empty. The driver writes
# `image-search-owner-findings.txt` with an OK or FAIL per claim and fails when any did.
# Dispatch-only, like the other demos: the driver runs about a minute after the boot, the job about
# seven; the nightly sweep runs the same driver on its phone-a shard
# (.github/nightly-drivers/image-search-owner.json), whose Google APIs
# image ships WebView 113 – WEB_MESSAGE_LISTENER and DOCUMENT_START_SCRIPT hold there, so the
# protocol runs (an older WebView would take the URL-only route throughout). The build, the emulator
# and the Gradle cache live in android-emulator-demo.yml; this file only picks the driver and the
# demo it runs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-image-search-owner-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Image search owner demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.ImageSearchOwnerDemo
        DEMO_DIR=image-search-owner-demo
        DEMO_OUT=artifacts/android-image-search-owner-demo
        DEMO_VIDEO=android-image-search-owner-demo.mp4
      artifact-name: android-image-search-owner-demo
      artifact-path: artifacts/android-image-search-owner-demo/

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Image search owner demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.ImageSearchOwnerDemo
        DEMO_DIR=image-search-owner-demo
        DEMO_OUT=artifacts/android-image-search-owner-demo
        DEMO_VIDEO=android-image-search-owner-demo.mp4
      artifact-name: android-image-search-owner-demo-second-boot
      artifact-path: artifacts/android-image-search-owner-demo/
