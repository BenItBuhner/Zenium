name: Android Settings tab preview demo

# Records the Settings tab's card picture and its restore on a hardware-accelerated Android
# emulator, in two acts around a process death (see
# .github/scripts/android-settings-tab-preview-demo.sh): Settings drilled into a section and
# into a section's page, the overview's Settings card read for the page the tab is on (the host's
# picture stamped with the address, never the landing drawn small), a real touch on the card
# landing on that page, the round trip keeping it, a back to the section beneath; then
# `am force-stop`, and the restored tab on its page with its card's picture from disk. Uploads
# both acts' videos, screenshots and findings. Dispatch-only, like the gesture demo. The build,
# the emulator and the Gradle cache live in android-emulator-demo.yml; this file only picks the
# driver.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/android-settings-tab-preview-9271

permissions:
  contents: read

concurrency:
  group: android-settings-tab-preview-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Settings tab preview demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-settings-tab-preview-demo.sh
      script-env: |
        DEMO_OUT=artifacts/android-settings-tab-preview-demo
      artifact-name: android-settings-tab-preview-demo
      artifact-path: artifacts/android-settings-tab-preview-demo/
      timeout-minutes: 55

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Settings tab preview demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-settings-tab-preview-demo.sh
      script-env: |
        DEMO_OUT=artifacts/android-settings-tab-preview-demo
      artifact-name: android-settings-tab-preview-demo-second-boot
      artifact-path: artifacts/android-settings-tab-preview-demo/
      timeout-minutes: 55
