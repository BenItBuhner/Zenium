name: TEMPORARY - compat round 14 sweep and frame budget trigger

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml or android-ext-runtime-demo.yml (HTTP 403 on the dispatches
# endpoint), and both stay dispatch-only; this file runs the same jobs on a push to the branch:
#   - `[sweep]` in the commit message: the two sweep jobs over compat round 14's rows – the
#     thirty of ranks 301-330 (`.github/scripts/ext-compat/next30-round11.json`), the rows carried
#     from round 13 (its section 7.3: Trust Wallet, WOT, Buyhatke, Cute Cursors, Custom Cursors,
#     eJOY, Tampermonkey BETA, Allow CORS, Color Picker, StayFocusd, Smarty, Adobe Photoshop, and the
#     four rows whose install prompt the command answered on WebView 156), the two webRequest rows
#     measured over the fixture server's clip and the cross-origin fixture (Chrono Download Manager,
#     Video Downloader PLUS: services' three measurements), and Cuponomia LAST on both WebViews
#     (the row under which the API 34 emulator died three times in round 13's after run);
#   - `[budget]` in the commit message: the runtime demo's two jobs with the frame budget alone
#     (ExtensionScrollBudget under SKIP_DEMO=1: the long fixture scrolled with 0, 2, 3 and 6
#     extensions, the jank report in the job summary) and, ahead of it, EngineProbe.
#   - `[ejoy]` in the commit message: the two sweep jobs over eJOY's row alone (round 13 row 32,
#     carried; its Vite loader's relative `import()`, resolved to the served origin at unit
#     assembly from RelativeImports.kt on), for a fix that landed after the round's AFTER run.
# A sweep whose emulator went away under the driver (the shared workflow's `emulator-died`: qemu
# gone or the guest frozen, or the runner action's SDK download coming down broken) boots once more
# and sweeps the rows the first boot did not grade (read off the results.json the sweep script pulls
# after every row), the row that was in flight at the death last so a row that kills the emulator
# loses no row after it; the second boot's artifact is the first's name with `-2`.
on:
  push:
    branches:
      - cursor/android-ext-compat-14-4435

permissions:
  contents: read

concurrency:
  group: tmp-ext-android-18-sweep-${{ github.sha }}
  cancel-in-progress: false

