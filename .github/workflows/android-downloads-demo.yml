name: Android downloads demo

# Records the Zenium downloader on a hardware-accelerated Android emulator and uploads the video
# and screenshots: a throttled file paused and resumed from the downloads sheet, a connection the
# server cuts halfway that the downloader resumes on its own with Range, data: and blob: links
# named from their anchors, the progress and completion notifications, a server that dies on
# its first attempt and its three automatic resumes until the row fails as network-failed ("Check
# internet connection") and Resume completes it, a file removed through download.deleteFile and
# one deleted behind the browser's back (rows read "Deleted"; Retry downloads the file again), and
# the files in the system Downloads app; DownloadsDemo checks every downloaded byte against the
# server's formula.
# Dispatch-only, like the gesture and site info demos: it takes about ten minutes and says
# nothing about a change being correct. Same caveats as the gesture demo about frame rate and the
# software GPU. The page and the files come from a small Node server
# (.github/scripts/downloads-demo-server.mjs) started on the runner before the emulator boots;
# the emulator reaches it at 10.0.2.2:18923. The build, the emulator and the Gradle cache live in
# android-emulator-demo.yml; this file picks the driver, starts the server and names the artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-downloads-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Downloads demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.DownloadsDemo
        DEMO_DIR=downloads-demo
        DEMO_OUT=artifacts/android-downloads-demo
        DEMO_VIDEO=android-downloads-demo.mp4
      # The test server must answer before the emulator boots; its log rides along in the artifact.
      setup-script: |
        mkdir -p artifacts/android-downloads-demo
        (setsid nohup node .github/scripts/downloads-demo-server.mjs 18923 > artifacts/android-downloads-demo/server.log 2>&1 &)
        sleep 2
        curl -sf -o /dev/null http://127.0.0.1:18923/page.html
        curl -sf -o /dev/null -H 'Range: bytes=1048576-' http://127.0.0.1:18923/flaky.bin
        echo "download test server answering on 18923"
      artifact-name: android-downloads-demo
      artifact-path: artifacts/android-downloads-demo/
      # DownloadsDemo reads MediaStore.Downloads (API 29+); the run that verified it used this image.
      api-level: '34'
