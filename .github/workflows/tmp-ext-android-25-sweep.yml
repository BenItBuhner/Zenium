name: TEMPORARY - compat round 20 sweep and frame budget trigger

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml or android-ext-runtime-demo.yml (HTTP 403 on the dispatches
# endpoint), and both stay dispatch-only; this file runs the same jobs on a push to the branch:
#   - `[sweep]` in the commit message: the two sweep jobs over compat round 20's rows – the
#     thirty of ranks 481-510 (`.github/scripts/ext-compat/next30-round17.json`, the five largest
#     bundles last in the table as round 19 ordered its own) and the twenty-two rows carried from
#     round 19 (its section 7 and the brief's regression list): the two webRequest sniffer rows
#     Chrono Download Manager (with its restart proof) and Video Downloader PLUS and the #448
#     proof row as regression rows for the header stage (onBeforeSendHeaders / onSendHeaders
#     heard), the response stage and the extension-URL exemption; rounds 17-19's fixed rows
#     Markdown Viewer, Cursor Helper, NoteGPT, Toggl Track, Buyhatke (its Flipkart leg on the
#     isolated-world WebView; notOnGoogleImage on 113), Speak Subtitles (its bundle speaking with
#     zero ReferenceErrors), Infinity New Tab and Search by Image; tl;dv (zero re-executions) and
#     SingleFile (with the six-pass lane beside); the seed rows Zoom Video (the storage round
#     trip's `back` leg, its lost update the measure) and Advanced Font Settings (the
#     chrome.fontSettings bridge's proof row); and round 19's open rows the round's runtime and
#     driver items serve – Soda PDF Viewer (the synthesized onHeadersReceived for a navigation
#     turned download), Responsive Viewer (the late bootstrap of scripting.executeScript), 2048
#     (the popup at its own width), Ice Dodo (the 156 game start), OP Auto Clicker (the 113
#     hotkey), Directo (the dated booking URL) and User-Agent Switcher and Manager (the
#     pick-then-apply) on both WebViews. AdGuard VPN, axe DevTools and Augmented Steam are in no
#     list: notOnGoogleImage by rounds 16 and 19, read on the AOSP lane when their rows run, and
#     not re-run here. `[sweep113]` fires the System WebView sweep job alone (with its rows-left
#     check and second boot) – only for a re-run the coordinator grants.
#     SWEEP_LAST and the rows-left job's LAST_IDS are empty this round: the two rows round 19 kept
#     for last on the API 34 Google image are `notOnGoogleImage` since its close-out.
#   - `[budget]` in the commit message: the runtime demo's two jobs with the frame budget alone
#     (ExtensionScrollBudget under SKIP_DEMO=1: the long fixture scrolled with 0, 2, 3 and 6
#     extensions and the fetch-heavy twin, the jank report in the job summary) and, ahead of it,
#     EngineProbe. `[budget113]` fires the System WebView budget job alone – only for a re-run the
#     coordinator grants.
#   - `[singlefile]` in the commit message: SingleFile's row alone, repeated six times on one boot
#     per WebView (SWEEP_REPEAT=6: the driver grades the row again after its disable, each reading
#     its own row in results.json), R5's measure (round 18 section 6.1 row 04).
#   - `[lane]` in the commit message: a targeted one-row-or-few lane (SWEEP_ONLY set by hand below:
#     the seed's rows Zoom Video, Advanced Font Settings, Infinity New Tab and Speak Subtitles) for
#     a runtime or driver change read on its own without the whole sweep.
# A sweep whose emulator went away under the driver (the shared workflow's `emulator-died`: qemu
# gone or the guest frozen, or the runner action's SDK download coming down broken) boots once more
# and sweeps the rows the first boot did not grade (read off the results.json the sweep script pulls
# after every row), the row that was in flight at the death last so a row that kills the emulator
# loses no row after it; the second boot's artifact is the first's name with `-2`.
