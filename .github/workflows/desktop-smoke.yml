name: Desktop smoke (Windows, macOS, Linux installers)

# Boots the packaged desktop app on GitHub-hosted Windows and macOS runners with Playwright for
# Electron (.github/smoke/smoke.mjs) and keeps to the basics so the jobs stay short: first launch
# and onboarding, one visible window titled Zenium, a tab on a page of the harness's own fixture
# server (127.0.0.1; the smoke needs no internet) through the URL bar, a graceful quit that marks
# the profile cleanly exited, the profile coming back without a "Restore pages?" bar, plus 1.5x
# DPI and OS dark mode screenshots. Windows additionally installs the NSIS build silently, checks
# the default-browser registration it wrote (RegisteredApplications, the StartMenuInternet client
# and Capabilities, the http/https associations, the ProgID), boots the installed executable,
# uninstalls it and checks that the registration went with it. The Linux job builds the two
# installers the Release workflow ships, boots the AppImage, installs the .deb, boots what it
# installed, checks the desktop entry and icon it put down and removes it again. Every JS error,
# crash and blocking dialog fails the run unless .github/smoke/known-failures.json names it.
# Screenshots, logs and result.json per build are uploaded as artifacts. The Linux smoke in ci.yml
# runs on every push and pull request against the unpacked build and carries the long walkthrough
# (Chrome-preset shortcuts, window questions, the crash-restore pair).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/main/**'
      - 'electron-builder.yml'
      - 'build/**'
      - 'package.json'
      - '.github/smoke/**'
      - '.github/workflows/desktop-smoke.yml'

permissions:
  contents: read

concurrency:
  group: desktop-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            arch: x64
            sevenzip_filter: ''
          - name: windows-arm64
            os: windows-11-arm
            arch: arm64
            # Same as the Release workflow: the bundled 7-Zip's ARM64 branch filter produces a
            # payload the NSIS extractor cannot decode (the installer exits 0 without zenium.exe).
            sevenzip_filter: BCJ
    defaults:
      run:
        shell: pwsh
    env:
      SMOKE_OUT: ${{ github.workspace }}\smoke-out
      SMOKE: ${{ github.workspace }}\.github\smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bundle main, preload and renderer
        run: npx electron-vite build
      - name: Package the NSIS installer (leaves the unpacked build in dist as well)
        env:
          ELECTRON_BUILDER_7Z_FILTER: ${{ matrix.sevenzip_filter }}
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
      - name: Make sure the session shows a desktop (windows-11-arm boots into OOBE)
        run: |
          New-Item -ItemType Directory -Force -Path "$env:SMOKE_OUT" | Out-Null
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Tee-Object -FilePath "$env:SMOKE_OUT\dist-listing.txt"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-session.ps1" -Action dismiss-oobe | Tee-Object -FilePath "$env:SMOKE_OUT\session.json"
      - name: Boot the unpacked build and walk through it
        timeout-minutes: 15
        run: |
          $exe = Get-ChildItem dist -Directory -Filter '*unpacked*' | ForEach-Object { Join-Path $_.FullName 'zenium.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "no unpacked zenium.exe under dist ($((Get-ChildItem dist | Select-Object -ExpandProperty Name) -join ', '))" }
          "unpacked exe: $exe"
          node "$env:SMOKE\smoke.mjs" --exe "$exe" --label unpacked --out "$env:SMOKE_OUT" --scenarios boot,restore,scale,dark
      - name: Windows and processes left behind by the unpacked build
        if: always()
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-session.ps1" -Action dialogs | Tee-Object -FilePath "$env:SMOKE_OUT\unpacked-leftover-windows.json"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-session.ps1" -Action processes | Tee-Object -FilePath "$env:SMOKE_OUT\unpacked-leftover-processes.json"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-session.ps1" -Action kill
      - name: Install the NSIS build silently (/S)
        id: nsis
        if: always()
        run: |
          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $setup) { throw "no *-setup.exe under dist ($((Get-ChildItem dist | Select-Object -ExpandProperty Name) -join ', '))" }
          "installer: $setup"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-install.ps1" -Action install -Installer "$setup" -Out "$env:SMOKE_OUT" -Label installed
          $installExit = $LASTEXITCODE
          $info = Get-Content "$env:SMOKE_OUT\installed-install.json" -Raw | ConvertFrom-Json
          # The expected path even when the installer did not write it: the smoke names the miss.
          "exe=$($info.exe)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($info.timedOut) { throw "installer did not finish in time and was killed" }
          if ($info.exitCode -ne 0) { throw "installer exited with code $($info.exitCode)" }
          # ci-08: the default-browser registration build/installer.nsh writes (RegisteredApplications,
          # the StartMenuInternet client and its Capabilities with the http/https and document-type
          # associations, the ZeniumHTML ProgID), complete and pointing at the installed executable.
          $problems = @($info.registrationProblems | Where-Object { $_ })
          if ($problems.Count -gt 0) { throw "default-browser registration after the install ($($problems.Count)): $($problems -join '; ')" }
          if ($installExit -ne 0) { throw "win-install.ps1 exited with code $installExit" }
      - name: Boot the installed build and walk through it
        if: always() && steps.nsis.outputs.exe != ''
        timeout-minutes: 12
        run: node "$env:SMOKE\smoke.mjs" --exe "${{ steps.nsis.outputs.exe }}" --label installed --out "$env:SMOKE_OUT" --scenarios boot,restore
      - name: Windows and processes left behind by the installed build
        if: always()
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-session.ps1" -Action dialogs | Tee-Object -FilePath "$env:SMOKE_OUT\installed-leftover-windows.json"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-session.ps1" -Action processes | Tee-Object -FilePath "$env:SMOKE_OUT\installed-leftover-processes.json"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-session.ps1" -Action kill
      - name: Uninstall silently; nothing of the browser registration may stay behind
        if: always()
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-install.ps1" -Action uninstall -Out "$env:SMOKE_OUT" -Label installed
          $uninstallExit = $LASTEXITCODE
          $info = Get-Content "$env:SMOKE_OUT\installed-uninstall.json" -Raw | ConvertFrom-Json
          # ci-08: every key of the registration gone, no document type still naming the ProgID.
          $left = @($info.registrationLeftovers | Where-Object { $_ })
          if ($left.Count -gt 0) { throw "default-browser registration left after the uninstall ($($left.Count)): $($left -join '; ')" }
          if ($uninstallExit -ne 0) { throw "uninstaller exited with code $($info.exitCode) (win-install.ps1 exit $uninstallExit)" }
      - name: Verdict (log and step summary)
        if: always()
        run: node "$env:SMOKE\verdict.mjs" --out "$env:SMOKE_OUT" --expect unpacked,installed --title ${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-smoke-${{ matrix.name }}
          path: smoke-out
          if-no-files-found: warn
          retention-days: 7

  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            arch: arm64
          - name: macos-x64
            os: macos-15-intel
            arch: x64
    env:
      SMOKE_OUT: ${{ github.workspace }}/smoke-out
      SMOKE: ${{ github.workspace }}/.github/smoke
      # No certificate on CI: do not search the runner keychain; build/after-pack.mjs ad-hoc signs
      # the bundle like the Release workflow does without a Developer ID.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bundle main, preload and renderer
        run: npx electron-vite build
      - name: Package the unpacked app bundle
        run: npx electron-builder --mac --dir --${{ matrix.arch }} --publish never
      - name: Locate the bundle
        id: app
        run: |
          apps=(dist/mac*/Zenium.app)
          app="${apps[0]}"
          [[ -d "$app" ]] || { echo "::error::no Zenium.app under dist/mac*"; ls -la dist; exit 1; }
          echo "app: $app"
          echo "app=$app" >> "$GITHUB_OUTPUT"
      - name: Bundle facts (code signature, Gatekeeper, quarantine)
        run: bash "$SMOKE/mac-facts.sh" "${{ steps.app.outputs.app }}" "$SMOKE_OUT" bundle
      - name: Boot the unpacked build and walk through it
        timeout-minutes: 20
        run: node "$SMOKE/smoke.mjs" --exe "${{ steps.app.outputs.app }}/Contents/MacOS/Zenium" --label unpacked --out "$SMOKE_OUT" --scenarios boot,restore,scale,dark
      - name: Bundle facts and crash reports after the run
        if: always()
        run: bash "$SMOKE/mac-facts.sh" "${{ steps.app.outputs.app }}" "$SMOKE_OUT" after-run
      - name: Verdict (log and step summary)
        if: always()
        run: node "$SMOKE/verdict.mjs" --out "$SMOKE_OUT" --expect unpacked --title ${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-smoke-${{ matrix.name }}
          path: smoke-out
          if-no-files-found: warn
          retention-days: 7

  linux-installers:
    name: linux-x64-installers
    # The two Linux installers the Release workflow ships, built with the same electron-builder
    # configuration, each booted through the smoke's `boot` scenario under Xvfb: the AppImage as
    # a file, the .deb after `dpkg -i` from where it installed the binary, plus the desktop entry
    # and icon the deb put down and, after `dpkg -r`, everything gone again. ci.yml's Linux job
    # stays the per-commit boot of the unpacked build; this one runs where the other installer-level
    # smokes (the Windows NSIS install) run, on the packaging inputs' path filter above.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SMOKE_OUT: ${{ github.workspace }}/smoke-out
      SMOKE: ${{ github.workspace }}/.github/smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bundle main, preload and renderer
        run: npx electron-vite build
      - name: Package the AppImage and the .deb
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Display tools (Xvfb; ffmpeg grabs the screenshots) and desktop-file-utils (desktop-file-validate)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb ffmpeg x11-utils xdotool desktop-file-utils
      - name: Locate the installers
        id: dist
        run: |
          mkdir -p "$SMOKE_OUT"
          find dist -maxdepth 1 -mindepth 1 -printf '%10s  %p\n' | sort -k2 | tee "$SMOKE_OUT/dist-listing.txt"
          appimages=(dist/*.AppImage)
          debs=(dist/*.deb)
          if [[ ${#appimages[@]} -ne 1 || ! -f "${appimages[0]}" ]]; then
            echo "::error::expected exactly one AppImage under dist, found: ${appimages[*]}"; exit 1
          fi
          if [[ ${#debs[@]} -ne 1 || ! -f "${debs[0]}" ]]; then
            echo "::error::expected exactly one .deb under dist, found: ${debs[*]}"; exit 1
          fi
          echo "appimage=$PWD/${appimages[0]}" >> "$GITHUB_OUTPUT"
          echo "deb=$PWD/${debs[0]}" >> "$GITHUB_OUTPUT"
      - name: Boot the AppImage under Xvfb
        # No FUSE on the runner: APPIMAGE_EXTRACT_AND_RUN=1 makes the type-2 runtime extract the
        # image to $TMPDIR, run AppRun from there and remove the directory when the app exits.
        # The environment variable, not --appimage-extract-and-run: the runtime reads only the
        # first argument, and Playwright puts --inspect=0 and --remote-debugging-port=0 first.
        # The extraction (some 450 MB) counts toward the first launch's render budget.
        # --no-sandbox --disable-gpu as in ci.yml (no setuid helper, no GPU under Xvfb).
        timeout-minutes: 12
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: >
          xvfb-run -a -s '-screen 0 1600x1000x24'
          node "$SMOKE/smoke.mjs" --exe "${{ steps.dist.outputs.appimage }}" --label appimage
          --out "$SMOKE_OUT" --scenarios boot --extra-args="--no-sandbox --disable-gpu"
      - name: AppImage facts (extract; AppRun, the embedded desktop entry and icon)
        if: always() && steps.dist.outputs.appimage != ''
        run: node "$SMOKE/linux-install.mjs" appimage --file "${{ steps.dist.outputs.appimage }}" --out "$SMOKE_OUT" --label appimage
      - name: Install the .deb (dpkg -i) and check what it put down
        id: deb
        if: always() && steps.dist.outputs.deb != ''
        # The desktop entry (/usr/share/applications/zenium.desktop: LINUX_DESKTOP_ID in
        # src/main/platform/defaultBrowser.ts; Exec, MimeType with x-scheme-handler/http and
        # https, Actions, Icon), the hicolor icon, /usr/bin/zenium through update-alternatives,
        # mimeinfo.cache. The runner image is no desktop: ubuntu-24.04 carries neither libnotify4
        # nor libsecret-1-0, so dpkg -i unpacks and stops ("dependency problems - leaving
        # unconfigured", exit 1) and apt-get install -f completes the configuration from the
        # package's own Depends (the apt-get update above makes the lists current). Expected,
        # so no annotation; deb-install.json records dpkgExit, the Depends dpkg found unmet and
        # the packages apt pulled in.
        run: |
          set +e
          sudo dpkg -i "${{ steps.dist.outputs.deb }}" 2>&1 | tee "$SMOKE_OUT/deb-dpkg-i.log"
          dpkg_exit=${PIPESTATUS[0]}
          set -e
          if [[ $dpkg_exit -ne 0 ]]; then
            echo "dpkg -i exited $dpkg_exit: completing the package's Depends with apt-get install -f"
            sudo apt-get install -f -y -qq 2>&1 | tee -a "$SMOKE_OUT/deb-dpkg-i.log"
          fi
          set +e
          node "$SMOKE/linux-install.mjs" deb-installed --out "$SMOKE_OUT" --label deb --dpkg-exit "$dpkg_exit" --dpkg-log "$SMOKE_OUT/deb-dpkg-i.log"
          facts_exit=$?
          set -e
          # The path the installed build must have, whether or not it is there: the smoke names the miss.
          echo "exe=$(node -p "require('$SMOKE_OUT/deb-install.json').exe")" >> "$GITHUB_OUTPUT"
          exit "$facts_exit"
      - name: Boot the installed build under Xvfb
        if: always() && steps.deb.outputs.exe != ''
        timeout-minutes: 12
        run: >
          xvfb-run -a -s '-screen 0 1600x1000x24'
          node "$SMOKE/smoke.mjs" --exe "${{ steps.deb.outputs.exe }}" --label deb
          --out "$SMOKE_OUT" --scenarios boot --extra-args="--no-sandbox --disable-gpu"
      - name: Remove the .deb (dpkg -r) and wait for its files to be gone
        if: always()
        run: |
          sudo dpkg -r zenium 2>&1 | tee "$SMOKE_OUT/deb-dpkg-r.log"
          node "$SMOKE/linux-install.mjs" deb-removed --out "$SMOKE_OUT" --label deb
      - name: Verdict (log and step summary)
        if: always()
        run: node "$SMOKE/verdict.mjs" --out "$SMOKE_OUT" --expect appimage,deb --title linux-x64-installers
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-smoke-linux-x64-installers
          path: smoke-out
          if-no-files-found: warn
          retention-days: 7
