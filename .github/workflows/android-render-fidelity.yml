name: Android render fidelity

# Loads the same pages in the debug build and in the emulator's Chrome and records how each page
# was served and laid out (user-agent string and client hints, request headers, viewport, fonts,
# the computed style of Google's "Sign in" control) next to screenshots of both, so a rendering
# difference on a phone can be pinned on the WebView setup or on the site. Dispatch-only: it takes
# about fifteen minutes and produces evidence to read, not a verdict.
on:
  workflow_dispatch:
    inputs:
      label:
        description: Prefix for the recorded files (e.g. before, after)
        default: run
        type: string
  push:
    branches: [cursor/android-render-fidelity-7c1b]

permissions:
  contents: read

concurrency:
  group: android-render-fidelity-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  compare:
    name: Compare with Chrome on an API 34 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: npm ci
      - name: Build the chrome and page script
        run: npm run build:android:web
      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew assembleDebug -PskipWeb --no-daemon --stacktrace
      - name: Locate the APK
        id: apk
        run: |
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          echo "path=$apk" >> "$GITHUB_OUTPUT"
      - name: Enable KVM for the emulator
        # https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Load the pages in both browsers
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RENDER_APK: ${{ steps.apk.outputs.path }}
          RENDER_OUT: artifacts/render-fidelity
          RENDER_PREFIX: ${{ inputs.label || 'before' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: node .github/scripts/render-fidelity.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-render-fidelity
          path: artifacts/render-fidelity/
          if-no-files-found: warn
          retention-days: 14
