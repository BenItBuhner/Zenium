name: Android services-bookmarks demo

# Temporary verification run for the bookmarks engine branch: records the bookmark tree on the
# phone chrome (migrated list, bookmarking the page, Netscape import and export through the
# system document picker from the panel's overflow menu, search, the URL bar suggestion with a
# folder path) on an API 34 emulator and uploads the video, screenshots and the exported file.
# Removed before the PR is marked ready. The build, the emulator and the Gradle cache live in
# android-emulator-demo.yml.
on:
  push:
    branches: [cursor/services-bookmarks-24d1]

permissions:
  contents: read

concurrency:
  group: android-services-bookmarks-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: bookmarks demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      # android-services-bookmarks-demo.sh pushes the Chrome export the driver imports, runs the
      # generic demo script with the BookmarksDemo driver and pulls the file the app exported.
      script: .github/scripts/android-services-bookmarks-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.BookmarksDemo
        DEMO_DIR=bookmarks-demo
        DEMO_OUT=artifacts/android-services-bookmarks-demo
        DEMO_VIDEO=services-bookmarks-android-demo.mp4
      artifact-name: android-services-bookmarks-demo
      artifact-path: artifacts/android-services-bookmarks-demo/
