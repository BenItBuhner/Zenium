name: Windows title bar demo video

# Records a paced screen video of the Windows title bar (.github/smoke/titlebar-demo.mjs) on a
# real Windows desktop with the real cursor, and uploads it as the run's artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/project-thread-eslyar'
    paths:
      - '.github/smoke/titlebar-demo.mjs'
      - '.github/workflows/windows-titlebar-demo.yml'

permissions:
  contents: read

jobs:
  demo:
    name: record title bar demo
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - name: Package the unpacked build
        run: npx electron-builder --win dir --x64 --publish never
      - name: Get ffmpeg
        run: |
          Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $ff = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "FFMPEG=$($ff.FullName)" >> $env:GITHUB_ENV
      - name: Make sure the session shows a desktop
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .github\smoke\win-session.ps1 -Action dismiss-oobe
      - name: Record the demo
        timeout-minutes: 10
        run: |
          $exe = Get-ChildItem dist -Directory -Filter '*unpacked*' | ForEach-Object { Join-Path $_.FullName 'zenium.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          node .github\smoke\titlebar-demo.mjs --exe "$exe" --out titlebar-demo --ffmpeg "$env:FFMPEG"
      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-titlebar-demo
          path: titlebar-demo
