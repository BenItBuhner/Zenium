name: Android share demo

# Records sharing out of and into the phone chrome on a hardware-accelerated Android emulator:
# Share from the app menu and from a link's long-press menu (the system chooser with the page's
# title and preview), mailto:, tel: and intent:// links held behind the external-protocol confirm
# sheet (with the intent's web fallback), then the share target driven through `am start`: a text
# with a URL, a plain text and ACTION_WEB_SEARCH routed to the profile's engine. Dispatch-only,
# like the gesture demo: it takes about ten minutes and says nothing about a change being correct.
# The build, the emulator and the Gradle cache live in android-emulator-demo.yml; this file only
# picks the driver and the demo it runs.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/android-share-intents-ace7

permissions:
  contents: read

concurrency:
  group: android-share-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Share demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.ShareDemo
        DEMO_DIR=share-demo
        DEMO_OUT=artifacts/android-share-demo
        DEMO_VIDEO=android-share-demo.mp4
      artifact-name: android-share-demo
      artifact-path: artifacts/android-share-demo/
