name: Android gesture demo

# Records the phone chrome on a hardware-accelerated Android emulator and uploads the video and
# screenshots: either the URL-pill gestures (swipe to switch tabs, pull up for the tab overview) or
# the omnibox with the keyboard up and the long-press that carries the address bar between the
# edges of the screen (that one also builds `main` first, so the video opens with the old bar).
# Dispatch-only: it takes ten to fifteen minutes and has nothing to say about a change being
# correct. The recording comes from an API 34 Google APIs image on a software GPU, so expect a
# handful of frames per second and a pause of a second or two at the start of every gesture while
# the chrome snapshots the live page; a phone does both in a frame.
on:
  workflow_dispatch:
    inputs:
      demo:
        description: Sequence to record
        type: choice
        default: gestures
        options:
          - gestures
          - omnibox
  push:
    branches:
      - cursor/omnibox-keyboard-and-pill-docking-5d02

permissions:
  contents: read

concurrency:
  group: android-gesture-demo-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  DEMO: ${{ inputs.demo || 'omnibox' }}

jobs:
  record:
    name: Record on an API 34 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: npm ci
      - name: Build the chrome and page script
        run: npm run build:android:web
      - name: Assemble the debug APK and the gesture driver
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest -PskipWeb --no-daemon --stacktrace
      - name: Check out main for the "before" take
        if: env.DEMO == 'omnibox'
        uses: actions/checkout@v7
        with:
          ref: main
          path: before
      - name: Build the "before" APK
        if: env.DEMO == 'omnibox'
        working-directory: before
        run: |
          npm ci
          npm run build:android:web
          cd android && ./gradlew assembleDebug -PskipWeb --no-daemon --stacktrace
      - name: Enable KVM for the emulator
        # https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Record the sequence
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BEFORE_APK_DIR: ${{ env.DEMO == 'omnibox' && 'before/android/app/build/outputs/apk/debug' || '' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 512M
          # An animator scale of 0 reads as prefers-reduced-motion in the WebView, which would
          # skip every spring – the animations are what is being recorded.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/android-${{ env.DEMO }}-demo.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-${{ env.DEMO }}-demo
          path: artifacts/android-${{ env.DEMO }}-demo/
          if-no-files-found: warn
          retention-days: 14
