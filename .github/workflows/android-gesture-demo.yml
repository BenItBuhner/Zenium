name: Android gesture demo

# Records the phone chrome on a hardware-accelerated Android emulator and uploads the video and
# screenshots: either the URL-pill gestures (swipe to switch tabs, pull up for the tab overview) or
# the omnibox with the keyboard up and the long-press that carries the address bar between the
# edges of the screen (that one also builds `main` first, so the video opens with the old bar).
# Dispatch-only: it takes ten to fifteen minutes and has nothing to say about a change being
# correct. The recording comes from an API 34 Google APIs image on a software GPU, so expect a
# handful of frames per second and a pause of a second or two at the start of every gesture while
# the chrome snapshots the live page; a phone does both in a frame. The build, the emulator and its
# caches live in android-emulator-demo.yml; this file picks the driver and prepares the omnibox take.
on:
  workflow_dispatch:
    inputs:
      demo:
        description: Sequence to record
        type: choice
        default: gestures
        options:
          - gestures
          - omnibox
  # TEMPORARY: runs the shared workflow on this branch while it is being verified.
  push:
    branches: [cursor/services-emulator-workflow-24d1]

permissions:
  contents: read

concurrency:
  group: android-gesture-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: ${{ inputs.demo || 'gestures' }} demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-${{ inputs.demo || 'gestures' }}-demo.sh
      # The omnibox sequence opens with main's build so the video shows the old bar first; for the
      # other sequences BEFORE_APK_DIR stays empty and the preparation below does nothing.
      script-env: |
        BEFORE_APK_DIR=${{ (inputs.demo || 'gestures') == 'omnibox' && 'before/android/app/build/outputs/apk/debug' || '' }}
      setup-script: |
        if [ -n "${BEFORE_APK_DIR:-}" ]; then
          git fetch --depth 1 origin main
          git worktree add --detach before FETCH_HEAD
          (cd before && npm ci && npm run build:android:web)
          (cd before/android && ./gradlew assembleDebug -PskipWeb --no-daemon --stacktrace)
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
        fi
      artifact-name: android-${{ inputs.demo || 'gestures' }}-demo
      artifact-path: artifacts/android-${{ inputs.demo || 'gestures' }}-demo/
      timeout-minutes: 50
