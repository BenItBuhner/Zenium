name: Android tablet tab list motion demo

# Records the TABLET sidebar's tab list motion (MOT-33; design language v2 §11.1, §11.3, §11.4,
# §9.37) on a hardware-accelerated emulator of the pixel_tablet profile laid out at 1280 x 800 dp
# at one px per dp (`wm size 1280x800`, `wm density 160`, as the tablet layout demo), and uploads
# the video, the stills and the driver's findings. The scenes, on the seeded Work space (the group
# Research [Alpha, Beta] and the loose Home, Gamma, Delta), every act a real touch: the boot path's
# restored rows read settled at the first read (P0: no clip, no opacity, no transform on any row,
# no departure's picture, no held extent); a touch on the New Tab row GROWING the new row from its
# end edge on SPRING_SNAPPY – the chrome's animation frames held from before the touch and
# stepped once, so the still lands one 64 ms step in (38 % of the way) whatever the emulator's
# cadence – then at rest; a touch on a middle row's close SHRINKING the row's picture out of its
# slot as the rows below glide up into the gap on the same frame and the scroller's extent runs
# down with them, the New Tab row gliding rather than jumping, caught the same way, then at rest
# with the picture gone; the two again at the emulator's own cadence, traced (frames.jsonl); the
# edge FADES as tabs opened off camera overflow the box and once a real swipe scrolls the list,
# gone as the extra tabs close; a real hold's LIFT – the ghost at scale 1.02 under the level-2
# shadow at 90 %, its 120 ms rise from the row's form – released in place into the tab's menu;
# the REDUCED MOTION close (a 120 ms fade in place, nothing travels) where the WebView reflects
# `animator_duration_scale 0`; and the dark scheme's grow and shrink frames. The driver judges
# every step from the chrome's DOM and the core's state and fails the run when a claim does not
# hold; see TabletTabListMotionDemo.kt.
#
# The engine, as the tablet private mode and new tab page demos: the lift's rise is a
# `@starting-style` transition (Chromium 117+), which the API 34 images' WebView 113 does not
# have, so the demo runs on an AOSP image with a Chromium snapshot SystemWebView.apk swapped in
# (android-webview-swap.sh), under swiftshader_indirect. Dispatch-only, like the other demos: it
# takes about a quarter of an hour and says nothing about a change being correct. The build, the
# emulator and the Gradle cache live in android-emulator-demo.yml; this file picks the driver, the
# profile, the display and the engine. The nightly sweep runs the same driver on its
# `tablet-webview` shard (.github/nightly-drivers/tablet-list-motion.json).
on:
  workflow_dispatch:
  # TEMPORARY (W6-E13): the builder's own run of the demo on its branch – no token here can
  # dispatch; removed in the branch's last commit.
  push:
    branches:
      - cursor/android-tablet-tab-list-motion-9271

permissions:
  contents: read

concurrency:
  group: android-tablet-list-motion-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Tablet tab list motion demo (Chromium snapshot WebView on an AOSP image)
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # A tablet AVD: the driver's claims are about the docked sidebar a 600 dp+ short side gets.
      profile: pixel_tablet
      api-level: '34'
      target: default
      emulator-gpu: swiftshader_indirect
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -writable-system
      script-env: |
        DEMO_CLASS=app.zen.chromium.TabletTabListMotionDemo
        DEMO_DIR=tablet-list-motion-demo
        DEMO_OUT=artifacts/android-tablet-list-motion-demo
        DEMO_VIDEO=android-tablet-list-motion-demo.mp4
        DEMO_DISPLAY=1280x800@160
        WEBVIEW_APK=artifacts/webview/SystemWebView.apk
      # The plain `Android` snapshot is armeabi-v7a only and its libwebviewchromium.so cannot be
      # dlopen'ed on an x86_64 emulator; `AndroidDesktop_x64` ships the same com.android.webview
      # (minSdk 29) with x86_64 and x86 native code.
      setup-script: |
        base=https://commondatastorage.googleapis.com/chromium-browser-snapshots/AndroidDesktop_x64
        rev=$(curl -fsSL "$base/LAST_CHANGE")
        echo "chromium snapshot revision $rev"
        curl -fsSL -o /tmp/chrome-android-desktop.zip "$base/$rev/chrome-android-desktop.zip"
        mkdir -p artifacts/webview
        unzip -j -o /tmp/chrome-android-desktop.zip chrome-android-desktop/apks/SystemWebView.apk -d artifacts/webview
        rm -f /tmp/chrome-android-desktop.zip
        curl -fsSL "$base/$rev/REVISIONS" > artifacts/webview/REVISIONS.json
        unzip -l artifacts/webview/SystemWebView.apk | grep -E "lib/[^/]+/libwebviewchromium.so"
        ls -la artifacts/webview
      artifact-name: android-tablet-list-motion-demo
      artifact-path: artifacts/android-tablet-list-motion-demo/
      timeout-minutes: 60

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Tablet tab list motion demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      profile: pixel_tablet
      api-level: '34'
      target: default
      emulator-gpu: swiftshader_indirect
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -writable-system
      script-env: |
        DEMO_CLASS=app.zen.chromium.TabletTabListMotionDemo
        DEMO_DIR=tablet-list-motion-demo
        DEMO_OUT=artifacts/android-tablet-list-motion-demo
        DEMO_VIDEO=android-tablet-list-motion-demo.mp4
        DEMO_DISPLAY=1280x800@160
        WEBVIEW_APK=artifacts/webview/SystemWebView.apk
      setup-script: |
        base=https://commondatastorage.googleapis.com/chromium-browser-snapshots/AndroidDesktop_x64
        rev=$(curl -fsSL "$base/LAST_CHANGE")
        echo "chromium snapshot revision $rev"
        curl -fsSL -o /tmp/chrome-android-desktop.zip "$base/$rev/chrome-android-desktop.zip"
        mkdir -p artifacts/webview
        unzip -j -o /tmp/chrome-android-desktop.zip chrome-android-desktop/apks/SystemWebView.apk -d artifacts/webview
        rm -f /tmp/chrome-android-desktop.zip
        curl -fsSL "$base/$rev/REVISIONS" > artifacts/webview/REVISIONS.json
        unzip -l artifacts/webview/SystemWebView.apk | grep -E "lib/[^/]+/libwebviewchromium.so"
        ls -la artifacts/webview
      artifact-name: android-tablet-list-motion-demo-second-boot
      artifact-path: artifacts/android-tablet-list-motion-demo/
      timeout-minutes: 60
