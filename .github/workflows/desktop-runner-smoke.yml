name: Desktop runner smoke (Windows, macOS)

# Temporary verification workflow: boots the packaged desktop app on GitHub-hosted Windows and
# macOS runners (built from this branch and the published v0.2.0 installers), drives it with
# Playwright for Electron and uploads OS-level screenshots, logs and OS-integration facts.
# Push-triggered on its own branch only; worker tokens cannot dispatch workflows.

on:
  push:
    branches: ['cursor/desktop-winmac-runner-smoke-80ca']

permissions:
  contents: read

concurrency:
  group: desktop-runner-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  RELEASE_TAG: v0.2.0
  RELEASE_REPO: BenItBuhner/Zenium

jobs:
  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            arch: x64
          - name: windows-arm64
            os: windows-11-arm
            arch: arm64
    defaults:
      run:
        shell: pwsh
    env:
      SMOKE_OUT: ${{ github.workspace }}\smoke-out
      SMOKE: ${{ github.workspace }}\.github\smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bundle main, preload and renderer
        run: npx electron-vite build
      - name: Package an unpacked build
        run: npx electron-builder --win --dir --${{ matrix.arch }} --publish never
      - name: Package the NSIS installer
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
      - name: Harness dependencies (Playwright for Electron)
        working-directory: .github/smoke
        run: npm install --no-audit --no-fund
      - name: Make sure the session shows a desktop (dismiss OOBE, start Explorer; windows-11-arm boots into OOBE)
        run: |
          New-Item -ItemType Directory -Force -Path "$env:SMOKE_OUT" | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-mouse.ps1" -Action dismiss-oobe | Tee-Object -FilePath "$env:SMOKE_OUT\oobe-dismiss.json"
      - name: Runner baseline facts and registry snapshot
        run: |
          New-Item -ItemType Directory -Force -Path "$env:SMOKE_OUT" | Out-Null
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Tee-Object -FilePath "$env:SMOKE_OUT/dist-listing.txt"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-facts.ps1" -Snapshot "$env:SMOKE_OUT\registry-before.json"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-facts.ps1" -Out "$env:SMOKE_OUT" -Label runner-baseline
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-screenshot.ps1" -Path "$env:SMOKE_OUT\runner-desktop.png"
      - name: Smoke the unpacked build
        continue-on-error: true
        timeout-minutes: 22
        run: |
          $exe = Get-ChildItem dist -Directory -Filter '*unpacked*' | ForEach-Object { Join-Path $_.FullName 'zen.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          "unpacked exe: $exe"
          node "$env:SMOKE\smoke.mjs" --exe "$exe" --label unpacked --out "$env:SMOKE_OUT"
      - name: Facts after running the unpacked build
        if: always()
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-facts.ps1" -Out "$env:SMOKE_OUT" -Label unpacked-after-run -DiffAgainst "$env:SMOKE_OUT\registry-before.json"

      - name: Install the NSIS build silently (/S)
        id: nsis
        if: always()
        continue-on-error: true
        run: |
          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          "installer: $setup"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-install.ps1" -Action install -Installer "$setup" -Out "$env:SMOKE_OUT" -Label nsis-local -Silent
          $info = Get-Content "$env:SMOKE_OUT\nsis-local-install.json" -Raw | ConvertFrom-Json
          "exe=$($info.exe)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Facts after the NSIS install
        if: always()
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-facts.ps1" -Out "$env:SMOKE_OUT" -Label nsis-local-installed -DiffAgainst "$env:SMOKE_OUT\registry-before.json"
      - name: Smoke the installed NSIS build
        if: always() && steps.nsis.outputs.exe != ''
        continue-on-error: true
        timeout-minutes: 22
        run: node "$env:SMOKE\smoke.mjs" --exe "${{ steps.nsis.outputs.exe }}" --label nsis-local --out "$env:SMOKE_OUT"
      - name: Facts after running the installed NSIS build
        if: always()
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-facts.ps1" -Out "$env:SMOKE_OUT" -Label nsis-local-after-run -DiffAgainst "$env:SMOKE_OUT\registry-before.json"
      - name: Uninstall the NSIS build silently
        if: always()
        continue-on-error: true
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-install.ps1" -Action uninstall -Out "$env:SMOKE_OUT" -Label nsis-local
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-facts.ps1" -Out "$env:SMOKE_OUT" -Label nsis-local-uninstalled -DiffAgainst "$env:SMOKE_OUT\registry-before.json"

      - name: Download the published ${{ env.RELEASE_TAG }} installer
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:RELEASE_TAG" --repo "$env:RELEASE_REPO" -p "*${{ matrix.arch }}-setup.exe" -D release-assets
          Get-ChildItem release-assets
      - name: Install the published release visibly (installer UI screenshots, auto-launch)
        id: release
        if: always()
        continue-on-error: true
        run: |
          $setup = Get-ChildItem release-assets -Filter '*-setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          "installer: $setup"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-install.ps1" -Action install -Installer "$setup" -Out "$env:SMOKE_OUT" -Label release-0.2.0
          $info = Get-Content "$env:SMOKE_OUT\release-0.2.0-install.json" -Raw | ConvertFrom-Json
          "exe=$($info.exe)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Facts after the release install
        if: always()
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-facts.ps1" -Out "$env:SMOKE_OUT" -Label release-0.2.0-installed -DiffAgainst "$env:SMOKE_OUT\registry-before.json"
      - name: Smoke the installed release
        if: always() && steps.release.outputs.exe != ''
        continue-on-error: true
        timeout-minutes: 22
        run: node "$env:SMOKE\smoke.mjs" --exe "${{ steps.release.outputs.exe }}" --label release-0.2.0 --out "$env:SMOKE_OUT"
      - name: Facts after running the installed release
        if: always()
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-facts.ps1" -Out "$env:SMOKE_OUT" -Label release-0.2.0-after-run -DiffAgainst "$env:SMOKE_OUT\registry-before.json"
      - name: Uninstall the release silently
        if: always()
        continue-on-error: true
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-install.ps1" -Action uninstall -Out "$env:SMOKE_OUT" -Label release-0.2.0
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SMOKE\win-facts.ps1" -Out "$env:SMOKE_OUT" -Label release-0.2.0-uninstalled -DiffAgainst "$env:SMOKE_OUT\registry-before.json"
      - name: Summary
        if: always()
        run: |
          Get-ChildItem -Recurse "$env:SMOKE_OUT" | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          foreach ($r in Get-ChildItem -Recurse "$env:SMOKE_OUT" -Filter result.json) {
            "## $($r.Directory.Name)" >> $env:GITHUB_STEP_SUMMARY
            '```json' >> $env:GITHUB_STEP_SUMMARY
            (Get-Content $r.FullName -Raw | ConvertFrom-Json).verdict | ConvertTo-Json -Depth 5 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-smoke-${{ matrix.name }}
          path: smoke-out
          if-no-files-found: warn
          retention-days: 14

  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            arch: arm64
          - name: macos-x64
            os: macos-15-intel
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      SMOKE_OUT: ${{ github.workspace }}/smoke-out
      SMOKE: ${{ github.workspace }}/.github/smoke
      # No certificate: do not search the runner keychain, ship the app unsigned (ad-hoc on arm64).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bundle main, preload and renderer
        run: npx electron-vite build
      - name: Package an unpacked app bundle
        run: npx electron-builder --mac --dir --${{ matrix.arch }} --publish never
      - name: Harness dependencies (Playwright for Electron)
        working-directory: .github/smoke
        run: npm install --no-audit --no-fund
      - name: Runner baseline facts
        run: |
          mkdir -p "$SMOKE_OUT"
          {
            sw_vers; uname -m; id -un; echo "HOME=$HOME"
            echo "--- displays"; system_profiler SPDisplaysDataType 2>/dev/null | head -40
            echo "--- windowserver"; pgrep -l WindowServer || echo "no WindowServer"
            echo "--- dist"; ls -la dist dist/mac* 2>/dev/null
            echo "--- diagnostic reports before"; ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | head -20
            echo "--- osascript UI scripting probe"; osascript -e 'tell application "System Events" to get name of every process' 2>&1 | head -c 600; echo
          } | tee "$SMOKE_OUT/runner-baseline.txt"
          screencapture -x "$SMOKE_OUT/runner-desktop.png" || true
      - name: Bundle facts (codesign, Gatekeeper) for the unpacked build
        run: bash "$SMOKE/mac-facts.sh" "$(ls -d dist/mac*/Zen.app | head -1)" "$SMOKE_OUT" unpacked-bundle
      - name: Smoke the unpacked build
        continue-on-error: true
        timeout-minutes: 22
        run: |
          app="$(ls -d dist/mac*/Zen.app | head -1)"
          echo "app: $app"
          node "$SMOKE/smoke.mjs" --exe "$app/Contents/MacOS/Zen" --label unpacked --out "$SMOKE_OUT"
      - name: Facts after running the unpacked build
        if: always()
        run: bash "$SMOKE/mac-facts.sh" "$(ls -d dist/mac*/Zen.app | head -1)" "$SMOKE_OUT" unpacked-after-run

      - name: Download the published ${{ env.RELEASE_TAG }} disk image
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" -p "*${{ matrix.arch }}.dmg" -D release-assets
          ls -la release-assets
      - name: Mount the disk image, copy the app, try open -a with and without quarantine
        id: dmg
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          dmg="$(ls release-assets/*.dmg | head -1)"
          bash "$SMOKE/mac-dmg.sh" "$dmg" "$RUNNER_TEMP/zenium-release" "$SMOKE_OUT/release-0.2.0-dmg"
      - name: Locate the copy of the release app (survives a hung mount step)
        id: dmgapp
        if: always()
        run: |
          p="$SMOKE_OUT/release-0.2.0-dmg/dmg-app-path.txt"
          if [ -f "$p" ] && [ -d "$(cat "$p")" ]; then echo "app=$(cat "$p")" >> "$GITHUB_OUTPUT"; else echo "no release app copy found"; fi
      - name: Bundle facts for the release app
        if: always() && steps.dmgapp.outputs.app != ''
        run: bash "$SMOKE/mac-facts.sh" "${{ steps.dmgapp.outputs.app }}" "$SMOKE_OUT" release-0.2.0-bundle
      - name: Smoke the release app
        if: always() && steps.dmgapp.outputs.app != ''
        continue-on-error: true
        timeout-minutes: 22
        run: node "$SMOKE/smoke.mjs" --exe "${{ steps.dmgapp.outputs.app }}/Contents/MacOS/Zen" --label release-0.2.0 --out "$SMOKE_OUT"
      - name: Facts after running the release app
        if: always() && steps.dmgapp.outputs.app != ''
        run: bash "$SMOKE/mac-facts.sh" "${{ steps.dmgapp.outputs.app }}" "$SMOKE_OUT" release-0.2.0-after-run
      - name: Summary
        if: always()
        run: |
          find "$SMOKE_OUT" -type f | sort | xargs -I{} ls -la {}
          for r in $(find "$SMOKE_OUT" -name result.json); do
            {
              echo "## $(basename "$(dirname "$r")")"
              echo '```json'
              node -e 'const r=require(process.argv[1]); console.log(JSON.stringify(r.verdict, null, 2))' "$r"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-smoke-${{ matrix.name }}
          path: smoke-out
          if-no-files-found: warn
          retention-days: 14
