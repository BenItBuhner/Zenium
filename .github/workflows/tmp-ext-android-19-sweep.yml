name: TEMPORARY - compat round 15 sweep and frame budget trigger

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml or android-ext-runtime-demo.yml (HTTP 403 on the dispatches
# endpoint), and both stay dispatch-only; this file runs the same jobs on a push to the branch:
#   - `[sweep]` in the commit message: the two sweep jobs over compat round 15's rows – the
#     thirty of ranks 331-360 (`.github/scripts/ext-compat/next30-round12.json`, filled in as the
#     round's rows land), the rows carried from round 14 (its section 7: the two webRequest sniffer
#     rows Chrono Download Manager and Video Downloader PLUS read over the media fixtures, the three
#     class-A rows WOT, Calendly and Trust Wallet, class B INSSIST and Talend API Tester, class C
#     Eneba and Buyhatke, Tampermonkey BETA on the 113 line, and the driver rows of 7.18 a-g:
#     StayFocusd, Color Picker, Allow CORS, Adobe Photoshop, Keep Awake, eJOY) on both WebViews;
#   - `[budget]` in the commit message: the runtime demo's two jobs with the frame budget alone
#     (ExtensionScrollBudget under SKIP_DEMO=1: the long fixture scrolled with 0, 2, 3 and 6
#     extensions, the jank report in the job summary) and, ahead of it, EngineProbe.
#   - `[sniff]` in the commit message: the two sweep jobs over the two webRequest sniffer rows alone
#     (Chrono Download Manager, Video Downloader PLUS: the response stage's proof on both fixtures),
#     for a runtime change read on its own without the whole sweep.
# A sweep whose emulator went away under the driver (the shared workflow's `emulator-died`: qemu
# gone or the guest frozen, or the runner action's SDK download coming down broken) boots once more
# and sweeps the rows the first boot did not grade (read off the results.json the sweep script pulls
# after every row), the row that was in flight at the death last so a row that kills the emulator
# loses no row after it; the second boot's artifact is the first's name with `-2`.
on:
  push:
    branches:
      - cursor/android-ext-compat-15-4435

permissions:
  contents: read

concurrency:
  group: tmp-ext-android-19-sweep-${{ github.sha }}
  cancel-in-progress: false

