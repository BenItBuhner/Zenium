name: Android passwords demo

# Records the password manager's phone surfaces on a hardware-accelerated Android emulator with a
# device PIN: the manager opened from the app menu, the vault gate with the system credential
# prompt behind the Keystore-bound vault key, the list, a login's detail with its password
# revealed after the PIN, the generator, the checkup, the manager's settings view, the Settings
# tab's Passwords category (its rows on the phone's Settings tab, the re-authentication grace
# through the picker sheet, Manage passwords as a way into the manager) and the passphrase prompt
# sheet – the device prompt dismissed, the vault passphrase asked for in its place. Dispatch-only,
# like the other demos: it takes about ten minutes and says nothing about a change being correct.
# The build, the emulator and the Gradle cache live in android-emulator-demo.yml; this file only
# picks the driver and the demo it runs. The companion script sets the PIN before the driver
# starts and checks the vault document for plaintext after it.
on:
  workflow_dispatch:
  # TEMPORARY: one recording per push of the services-passwords UI branch, reverted before the PR
  # leaves draft.
  push:
    branches:
      - cursor/services-passwords-ui-24d1

permissions:
  contents: read

concurrency:
  group: android-passwords-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Passwords demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-passwords-ui-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.PasswordsUiDemo
        DEMO_DIR=passwords-ui-demo
        DEMO_OUT=artifacts/android-services-passwords-ui
        DEMO_VIDEO=services-passwords-android-ui-demo.mp4
      artifact-name: android-services-passwords-ui
      artifact-path: artifacts/android-services-passwords-ui/
      api-level: '34'

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Passwords demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-passwords-ui-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.PasswordsUiDemo
        DEMO_DIR=passwords-ui-demo
        DEMO_OUT=artifacts/android-services-passwords-ui
        DEMO_VIDEO=services-passwords-android-ui-demo.mp4
      artifact-name: android-services-passwords-ui-second-boot
      artifact-path: artifacts/android-services-passwords-ui/
      api-level: '34'
