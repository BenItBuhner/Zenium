name: TEMPORARY - compat round 4 sweep trigger

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml (HTTP 403 on the dispatches endpoint), and that workflow stays
# dispatch-only; this file runs the same two sweep jobs for the thirty-one rows of compat round 4
# (the next thirty by installs, `.github/scripts/ext-compat/next30.json`, and Tampermonkey, whose
# WebView 156 core round 3 left unmeasured at normal job speed) on a push to the branch whose
# commit message carries `[sweep]`, so a before run (the first commit, no runtime change) and an
# after run (the final head) measure the same thing the dispatched sweep would.
#
# Before runs: the first (35507200692) crashed the browser process on row 11, AdGuard AdBlocker
# (bgnkhhnnamicmpeenaelnjfhikgbkllg), out of Java heap while Kotlin quoted a 21 MB ruleset file
# into one bridge answer; the second (35508604947) measured the thirty rows behind it without
# it. After runs carry all thirty-one rows: the rulesets are read through the asset loader now.
on:
  push:
    branches:
      - cursor/android-ext-compat-4-4435

permissions:
  contents: read

concurrency:
  group: tmp-ext-android-7-sweep-${{ github.sha }}
  cancel-in-progress: false

jobs:
  system-webview:
    if: contains(github.event.head_commit.message, '[sweep]')
    name: System WebView (API 34 image)
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-ext-compat-sweep.sh
      artifact-name: android-ext-compat-sweep
      artifact-path: artifacts/android-ext-compat-sweep/
      script-env: |
        SWEEP_ONLY=ghbmnnjooekpmoecnnnilnnbdlolhkhi,efaidnbmnnnibpcajpcglclefindmkaj,fheoggkfdfchfphceeifdbepaooicaho,lmjegmlicamnimmfhcmpkclmigmmcbeh,gighmmpiobklfepjocnamgkkbiglidom,inomeogfingihgjfjlpeplalcfajhgai,ppnbnpeolgkicgegkbkbjmhlideopiji,jlhmfgmfgeifomenelglieieghnjghma,ecnphlgnajanjnkcmbpancdjoidceilk,bgnkhhnnamicmpeenaelnjfhikgbkllg,inoeonmfapjbbkmdafoankkfajkcphgd,fcoeoabgfenejglbffodgkkbkcdhcgfn,majdfhpaihoncoakbjgbdhglocklcgno,fjoaledfpmneenckfbpdfhkmimnjocfa,ljglajjnnkapghbckkcmodicjhacbfhk,nkbihfbeogaeaoehlefnkodbefgpgknn,nenlahapcbofgnanklpelkaejcehkggg,cmedhionkhpnakcndndgjdbohmhepckk,ihcjicgdanjaechkgeegckofjjedodee,llbcnfanfmjhpedaedhbcnpgeepdnnok,fdpohaocaechififmbbbbbknoalclacl,oocalimimngaihdkbihfgmpkcpnmlaoa,mmeijimgabbpbgpdklnllpncmdofkcpn,bhghoamapcdpbohphigoooaddinpkbai,kgjfgplpablkjnlkjmjdecgdpfankdle,eiaeiblijfjekdanodkjadfinkhbfgcd,ekhagklcjbdpajgpjgmbionohlpdbjgc,flliilndjeohchalpbbcdekjklbdgfkk,omghfjlpggmjjaagoclmmobgdodcjboh,caljgklbbfbcjjanaijlacgncafpegll,dhdgffkkebhmkfjojejmpbldmpobfkfo
      timeout-minutes: 210

  modern-webview:
    if: contains(github.event.head_commit.message, '[sweep]')
    name: Best effort - Chromium snapshot WebView on an AOSP image
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-ext-compat-sweep.sh
      artifact-name: android-ext-compat-sweep-modern-webview
      artifact-path: artifacts/android-ext-compat-sweep/
      target: default
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -writable-system
      script-env: |
        WEBVIEW_APK=artifacts/webview/SystemWebView.apk
        SOFT_FAIL=1
        SWEEP_ONLY=ghbmnnjooekpmoecnnnilnnbdlolhkhi,efaidnbmnnnibpcajpcglclefindmkaj,fheoggkfdfchfphceeifdbepaooicaho,lmjegmlicamnimmfhcmpkclmigmmcbeh,gighmmpiobklfepjocnamgkkbiglidom,inomeogfingihgjfjlpeplalcfajhgai,ppnbnpeolgkicgegkbkbjmhlideopiji,jlhmfgmfgeifomenelglieieghnjghma,ecnphlgnajanjnkcmbpancdjoidceilk,bgnkhhnnamicmpeenaelnjfhikgbkllg,inoeonmfapjbbkmdafoankkfajkcphgd,fcoeoabgfenejglbffodgkkbkcdhcgfn,majdfhpaihoncoakbjgbdhglocklcgno,fjoaledfpmneenckfbpdfhkmimnjocfa,ljglajjnnkapghbckkcmodicjhacbfhk,nkbihfbeogaeaoehlefnkodbefgpgknn,nenlahapcbofgnanklpelkaejcehkggg,cmedhionkhpnakcndndgjdbohmhepckk,ihcjicgdanjaechkgeegckofjjedodee,llbcnfanfmjhpedaedhbcnpgeepdnnok,fdpohaocaechififmbbbbbknoalclacl,oocalimimngaihdkbihfgmpkcpnmlaoa,mmeijimgabbpbgpdklnllpncmdofkcpn,bhghoamapcdpbohphigoooaddinpkbai,kgjfgplpablkjnlkjmjdecgdpfankdle,eiaeiblijfjekdanodkjadfinkhbfgcd,ekhagklcjbdpajgpjgmbionohlpdbjgc,flliilndjeohchalpbbcdekjklbdgfkk,omghfjlpggmjjaagoclmmobgdodcjboh,caljgklbbfbcjjanaijlacgncafpegll,dhdgffkkebhmkfjojejmpbldmpobfkfo
      setup-script: |
        base=https://commondatastorage.googleapis.com/chromium-browser-snapshots/AndroidDesktop_x64
        rev=$(curl -fsSL "$base/LAST_CHANGE")
        echo "chromium snapshot revision $rev"
        curl -fsSL -o /tmp/chrome-android-desktop.zip "$base/$rev/chrome-android-desktop.zip"
        mkdir -p artifacts/webview
        unzip -j -o /tmp/chrome-android-desktop.zip chrome-android-desktop/apks/SystemWebView.apk -d artifacts/webview
        rm -f /tmp/chrome-android-desktop.zip
        curl -fsSL "$base/$rev/REVISIONS" > artifacts/webview/REVISIONS.json
        unzip -l artifacts/webview/SystemWebView.apk | grep -E "lib/[^/]+/libwebviewchromium.so"
        ls -la artifacts/webview
      timeout-minutes: 210
