name: Android omnibox tab group suggestion demo

# Records wave 6's tab group suggestion (W6-E14, OMN-15: typing the start of a tab group's name
# – or of a word in one of its pages' addresses – offers the group as a row of the omnibox, and
# the touch on it opens the group) on a hardware-accelerated Android emulator under REAL fingers,
# and uploads the video, the stills, the findings and the per-frame rows.
# OmniboxGroupSuggestionDemo reads each claim off the chrome's DOM or the core's state, never off
# the still alone, and the run FAILS when one does not hold: the `folder` row among the search,
# history and open tab rows for "res" – the group glyph in the group's colour, the name, the
# members' sites, Chrome's spoken sentence "Open Research tab group, colour Blue, with sites …",
# on the phone in the section headed Chrome's "Tabs and tab groups" beside the open tab, on the
# tablet with the "Open tab group" hint beside the tab row's "Switch to tab"; a real touch on the
# row running the core's `folder.open` (the group unfolded, its first page up, the field closed);
# the group closed and offered again as a SAVED group by a member page's address ("cit"), the
# ring for its glyph, the touch bringing its pages back. Both sites are the driver's own on the
# loopback.
#
# Three acts, in parallel, each on its own emulator: the light and the dark colour scheme on the
# phone (the same claims; the stills are the design record's), and the tablet layout at
# 1280x800@160 (the list's row and its hint). Dispatch-only, like the other demos: about four
# minutes an act, and it says nothing about a change being correct. The build, the emulator and
# the Gradle cache live in android-emulator-demo.yml; this file picks the driver, the theme and
# the chassis. One more boot per act when the emulator itself went away under the driver, never
# when the driver failed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-omnibox-group-suggestion-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light:
    name: Omnibox tab group suggestion demo, light
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.OmniboxGroupSuggestionDemo
        DEMO_DIR=omnibox-group-suggestion-demo
        DEMO_OUT=artifacts/android-omnibox-group-suggestion-demo
        DEMO_VIDEO=android-omnibox-group-suggestion-demo-light.mp4
        DEMO_THEME=light
      artifact-name: android-omnibox-group-suggestion-demo-light
      artifact-path: artifacts/android-omnibox-group-suggestion-demo/

  light-again:
    name: Omnibox tab group suggestion demo, light, second boot
    needs: light
    if: ${{ failure() && needs.light.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.OmniboxGroupSuggestionDemo
        DEMO_DIR=omnibox-group-suggestion-demo
        DEMO_OUT=artifacts/android-omnibox-group-suggestion-demo
        DEMO_VIDEO=android-omnibox-group-suggestion-demo-light.mp4
        DEMO_THEME=light
      artifact-name: android-omnibox-group-suggestion-demo-light-second-boot
      artifact-path: artifacts/android-omnibox-group-suggestion-demo/

  dark:
    name: Omnibox tab group suggestion demo, dark
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.OmniboxGroupSuggestionDemo
        DEMO_DIR=omnibox-group-suggestion-demo
        DEMO_OUT=artifacts/android-omnibox-group-suggestion-demo
        DEMO_VIDEO=android-omnibox-group-suggestion-demo-dark.mp4
        DEMO_THEME=dark
      artifact-name: android-omnibox-group-suggestion-demo-dark
      artifact-path: artifacts/android-omnibox-group-suggestion-demo/

  dark-again:
    name: Omnibox tab group suggestion demo, dark, second boot
    needs: dark
    if: ${{ failure() && needs.dark.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.OmniboxGroupSuggestionDemo
        DEMO_DIR=omnibox-group-suggestion-demo
        DEMO_OUT=artifacts/android-omnibox-group-suggestion-demo
        DEMO_VIDEO=android-omnibox-group-suggestion-demo-dark.mp4
        DEMO_THEME=dark
      artifact-name: android-omnibox-group-suggestion-demo-dark-second-boot
      artifact-path: artifacts/android-omnibox-group-suggestion-demo/

  tablet:
    name: Omnibox tab group suggestion demo, tablet
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # A tablet AVD laid out at 1280x800@160 (the tablet layout demo's recipe): the list's row
      # with its "Open tab group" hint, where the phone has the sheet's section.
      profile: pixel_tablet
      api-level: '34'
      script-env: |
        DEMO_CLASS=app.zen.chromium.OmniboxGroupSuggestionDemo
        DEMO_DIR=omnibox-group-suggestion-demo
        DEMO_OUT=artifacts/android-omnibox-group-suggestion-demo
        DEMO_VIDEO=android-omnibox-group-suggestion-demo-tablet.mp4
        DEMO_THEME=light
        DEMO_DISPLAY=1280x800@160
      artifact-name: android-omnibox-group-suggestion-demo-tablet
      artifact-path: artifacts/android-omnibox-group-suggestion-demo/

  tablet-again:
    name: Omnibox tab group suggestion demo, tablet, second boot
    needs: tablet
    if: ${{ failure() && needs.tablet.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      profile: pixel_tablet
      api-level: '34'
      script-env: |
        DEMO_CLASS=app.zen.chromium.OmniboxGroupSuggestionDemo
        DEMO_DIR=omnibox-group-suggestion-demo
        DEMO_OUT=artifacts/android-omnibox-group-suggestion-demo
        DEMO_VIDEO=android-omnibox-group-suggestion-demo-tablet.mp4
        DEMO_THEME=light
        DEMO_DISPLAY=1280x800@160
      artifact-name: android-omnibox-group-suggestion-demo-tablet-second-boot
      artifact-path: artifacts/android-omnibox-group-suggestion-demo/
