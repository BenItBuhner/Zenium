name: Android cold start pair

# The P0 rule's GATE for a change near the boot path: MainActivity's cold start under a BASE
# build and under the HEAD (this workflow's commit) on the same emulator boot, `am start -W` after
# `am force-stop`, N = runs × starts paired starts by each way (the arms interleaved in blocks),
# judged on the PAIRED MEDIAN of TotalTime and of Fully drawn against the thresholds in
# android-cold-start-pair.sh (the root's ruling of 25 Sep: TotalTime over +100 ms on either way
# fails, Fully drawn over +300 direct / +500 alias – its null band –, the job goes red; a row
# with fewer than half its pairs valid is INCONCLUSIVE and red too, unless every reading it
# lacks is UNREAD – the runner's read failed, not the build's mark missing – which is a warning,
# the row not judged); the record beside it – the medians of TotalTime, Fully drawn and WaitTime
# side by side – lands in the job summary and in the artifact as cold-start-pair.txt with every am
# start answer and read-errors.txt, every log read's stderr. The defaults (runs, starts, the timeout) are the calibration's, from null pairs
# (the same tree in both arms; the PR body of #482, H4 round 2). The base build is assembled here
# from the base ref (the same web build and Gradle tasks as the head's, in a worktree; the head's
# node_modules serve it, since the base and the head share a lockfile or the base's own install
# is made). Dispatch-only: a worker whose change touches the boot path's neighbourhood fires it
# on its branch and writes the numbers into its PR body; a PASS says nothing about a change being
# correct, only that the two builds' cold starts measured within the gate on the recipe's
# emulator. The build, the emulator and the Gradle cache live in android-emulator-demo.yml.
on:
  # TEMPORARY (H5, removed before READY): one NULL pair (base = this commit) at the trimmed cadence
  # (STATS_AT_S 8 / NEXT_AT_S 15, the frames probed at 5 and 8) and one deliberate UNREAD run (a
  # logcat buffer adb refuses) on this branch.
  push:
    branches: [cursor/android-harness-h5b-9271]
  workflow_dispatch:
    inputs:
      base-ref:
        description: The ref the before build is assembled from (a branch, tag or commit)
        required: false
        type: string
        default: main
      api-level:
        description: System image (34 is the phone shards' image, 35 is Android 15 with the current WebView)
        type: choice
        default: '34'
        options:
          - '34'
          - '35'
      runs:
        description: Blocks (each installs, settles and measures one arm, then the other; the order alternates block to block); N = runs × starts pairs
        required: false
        type: number
        default: 15
      starts:
        description: Measured cold starts by each way per install
        required: false
        type: number
        default: 2
      timeout-minutes:
        description: The job's timeout; a block of 2 starts takes about 4 minutes, the build and the boot about 10
        required: false
        type: number
        default: 150

permissions:
  contents: read

concurrency:
  group: android-cold-start-pair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pair:
    name: Cold start pair (before ${{ inputs.base-ref || 'main' }} / after this commit) – ${{ matrix.run }}
    # TEMPORARY (H5, removed before READY): two arms – null-trim (N = 30, base = this commit, the
    # trimmed clock) and unread (one start by each way, the buffers adb refuses).
    strategy:
      fail-fast: false
      matrix:
        run: [null-trim, unread]
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-cold-start-pair.sh
      api-level: ${{ inputs.api-level || '34' }}
      # The base APK: the base ref in a worktree, its web build, then assembleDebug -PskipWeb as the
      # head's own step ran it. The labels are the two commits, for the table.
      script-env: |
        P0_BASE_REF=${{ inputs.base-ref || github.sha }}
        P0_BASE_APK=artifacts/cold-start-base/app-base.apk
        P0_RUNS=${{ matrix.run == 'unread' && 1 || inputs.runs || 15 }}
        P0_STARTS=${{ matrix.run == 'unread' && 1 || inputs.starts || 2 }}
        P0_FRAMES_AT_S=5 8
        P0_STATS_AT_S=8
        P0_NEXT_AT_S=15
        P0_LOGCAT_BUFFERS=${{ matrix.run == 'unread' && 'nonesuch' || 'main,system' }}
        DEMO_OUT=artifacts/android-cold-start-pair
      setup-script: |
        set -euo pipefail
        git fetch --no-tags --depth 1 origin "$P0_BASE_REF"
        base_sha=$(git rev-parse FETCH_HEAD)
        echo "base ref $P0_BASE_REF = $base_sha; head $GITHUB_SHA"
        git worktree add --detach /tmp/cold-start-base "$base_sha"
        cd /tmp/cold-start-base
        if cmp -s package-lock.json "$GITHUB_WORKSPACE/package-lock.json"; then
          ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
        else
          npm ci
        fi
        npm run build:android:web
        cd android
        ./gradlew assembleDebug -PskipWeb --no-daemon --stacktrace
        cd "$GITHUB_WORKSPACE"
        mkdir -p artifacts/cold-start-base
        base_apk=$(find /tmp/cold-start-base/android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
        echo "base APK: $base_apk"
        cp "$base_apk" artifacts/cold-start-base/app-base.apk
        {
          echo "P0_BASE_LABEL=${base_sha:0:9}"
          echo "P0_HEAD_LABEL=${GITHUB_SHA:0:9}"
        } >> "$GITHUB_ENV"
      artifact-name: android-cold-start-pair-${{ matrix.run }}
      artifact-path: artifacts/android-cold-start-pair/
      timeout-minutes: ${{ inputs.timeout-minutes || 150 }}
