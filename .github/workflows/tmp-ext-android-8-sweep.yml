name: TEMPORARY - compat round 5 sweep trigger

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml (HTTP 403 on the dispatches endpoint), and that workflow stays
# dispatch-only; this file runs the same two sweep jobs for the thirty-two rows of compat round 5
# (the desktop round-3 list, ranks 61-90 by installs, `.github/scripts/ext-compat/next30-round3.json`,
# and the two rows round 4 left open, Read&Write and Kami) on a push to the branch whose commit
# message carries `[sweep]`, so a before run (the first commit, no runtime change) and an after run
# (the final head) measure the same thing the dispatched sweep would.
on:
  push:
    branches:
      - cursor/android-ext-compat-5-4435

permissions:
  contents: read

concurrency:
  group: tmp-ext-android-8-sweep-${{ github.sha }}
  cancel-in-progress: false

jobs:
  system-webview:
    if: contains(github.event.head_commit.message, '[sweep]')
    name: System WebView (API 34 image)
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-ext-compat-sweep.sh
      artifact-name: android-ext-compat-sweep
      artifact-path: artifacts/android-ext-compat-sweep/
      script-env: |
        SWEEP_ONLY=glcimepnljoholdmjchkloafkggfoijh,fcfhplploccackoneaefokcmbjfbkenj,eppiocemhmnlbhjplcgkofciiegomcon,jghecgabfgfdldnmbfkhmffcabddioke,lpcaedmchfhocbbapmcbpinfpgnhiddi,gmbmikajjgmnabiglmofipeabaddhgne,fkepacicchenbjecpbpbclokcabebhah,pejdijmoenmkgeppbflobdenhhabjlaj,kdpelmjpfafjppnhbloffcjpeomlnpah,ogdlpmhglpejoiomcodnpjnfgcpmgale,lmjnegcaeklhafolokijcfjliaokphfk,gpdjojdkbbmdfjfahjcgigfpmkopogic,iidnbdjijdkbmajdffnidomddglmieko,hdhinadidafjejdhmfkjgnolgimiaplp,aopddeflghjljihihabdclejbojaomaf,fjgncogppolhfdpijihbpfmeohpaadpc,feepmdlmhplaojabeoecaobfmibooaid,elicpjhcidhpjomhibiffojpinpmmpil,difoiogjjojoaoomphldepapgpbgkhkb,mmioliijnhnoblpgimnlajmefafdfilb,gomekmidlodglbbmalcneegieacbdmki,admmjipmmciaobhojoghlmleefbicajg,bfnaelmomeimhlpmgjnjophhpkkoljpa,hehggadaopoacecdllhhajmbjkdcmajg,mpnlkmlkncncpgnnkmkgoobfpnjmblnk,ddojnmkongaimkdddgmcccldlfhokcfb,gkojfkhlekighikafcpjkiklfbnlmeio,nlipoenfbbikpbjkfpfillcgkoblgpmj,hehijbfgiekmjfkfjpbkbammjbdenadd,mgijmajocgfcbeboacabfgobmjgjcoja,inoeonmfapjbbkmdafoankkfajkcphgd,ecnphlgnajanjnkcmbpancdjoidceilk
