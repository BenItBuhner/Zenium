name: TEMPORARY - compat round 19 sweep and frame budget trigger

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml or android-ext-runtime-demo.yml (HTTP 403 on the dispatches
# endpoint), and both stay dispatch-only; this file runs the same jobs on a push to the branch:
#   - `[sweep]` in the commit message: the two sweep jobs over compat round 19's rows – the
#     thirty of ranks 451-480 (`.github/scripts/ext-compat/next30-round16.json`, the five largest
#     bundles last in the table as round 18 ordered its own) and the sixteen rows carried from
#     round 18 (its section 7.1 and the brief's regression list): the two webRequest sniffer rows Chrono Download Manager (with its restart
#     proof) and Video Downloader PLUS and the #448 proof row as regression rows for the response
#     stage and the extension-URL exemption; round 17's fixed rows Markdown Viewer, Cursor Helper
#     and NoteGPT (R1/R3/R4); round 18's SingleFile (R5, with the six-pass lane beside), Toggl
#     Track (the install), Buyhatke (its Flipkart leg on the isolated-world WebView; notOnGoogleImage
#     on 113) and Speak Subtitles (the externally_connectable page API; the paused video the
#     driver's item); round 18b's tl;dv (rank 440: zero re-executions, the renderer alive, one
#     refusal line); and the seed rows Zoom Video (the storage latency's lost update), Infinity New
#     Tab (the background's onMessage on the isolated-world lane), Search by Image (the silent stop
#     after the image message), 2048 and Ice Dodo (the games' start taps) on both WebViews. AdGuard
#     VPN is in no list: it reads n/a on the Google image by round 16's diagnosis (the emulator's
#     own fault) and is not re-run. `[sweep113]` fires the System WebView sweep job alone (with its
#     rows-left check and second boot) – only for a re-run the coordinator grants.
#   - `[budget]` in the commit message: the runtime demo's two jobs with the frame budget alone
#     (ExtensionScrollBudget under SKIP_DEMO=1: the long fixture scrolled with 0, 2, 3 and 6
#     extensions and the fetch-heavy twin, the jank report in the job summary) and, ahead of it,
#     EngineProbe. `[budget113]` fires the System WebView budget job alone – only for a re-run the
#     coordinator grants.
#   - `[singlefile]` in the commit message: SingleFile's row alone, repeated six times on one boot
#     per WebView (SWEEP_REPEAT=6: the driver grades the row again after its disable, each reading
#     its own row in results.json), R5's measure (round 18 section 6.1 row 04).
#   - `[lane]` in the commit message: a targeted one-row-or-few lane (SWEEP_ONLY set by hand below:
#     the seed's runtime rows Zoom Video, Speak Subtitles, Infinity New Tab, Search by Image and
#     tl;dv) for a runtime or driver change read on its own without the whole sweep.
# A sweep whose emulator went away under the driver (the shared workflow's `emulator-died`: qemu
# gone or the guest frozen, or the runner action's SDK download coming down broken) boots once more
# and sweeps the rows the first boot did not grade (read off the results.json the sweep script pulls
# after every row), the row that was in flight at the death last so a row that kills the emulator
# loses no row after it; the second boot's artifact is the first's name with `-2`.
