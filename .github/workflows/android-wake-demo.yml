name: Android wake demo

# Puts the browser through screen off and on (through the lock screen), the memory trims of a
# backgrounded app, Doze, a killed WebView renderer and a hung one on a hardware-accelerated
# Android emulator, checks that the chrome is painted and answering after each, and uploads the
# recordings, the screenshots and the driver's report (WakeDemo). With `before` it first records
# the same sequence on the APK built from main, so the two takes can be compared. Dispatch-only:
# it takes fifteen to twenty minutes and only regresses the wake path; the recordings come from an
# API 34 Google APIs image on a software GPU, so expect a handful of frames per second.
on:
  workflow_dispatch:
    inputs:
      assert:
        description: Fail when the chrome is not painted or does not answer after a scenario
        type: boolean
        default: true
      before:
        description: Also record the APK built from main first, for comparison
        type: boolean
        default: false
  push:
    branches: [cursor/android-wake-blank-chrome-b675]

permissions:
  contents: read

concurrency:
  group: android-wake-demo-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  WAKE_ASSERT: ${{ github.event_name == 'workflow_dispatch' && inputs.assert && 'true' || 'false' }}
  WAKE_BEFORE: ${{ (github.event_name == 'push' || inputs.before) && 'true' || 'false' }}

jobs:
  record:
    name: Record on an API 34 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: npm ci
      - name: Build the chrome and page script
        run: npm run build:android:web
      - name: Assemble the debug APK and the wake driver
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest -PskipWeb --no-daemon --stacktrace
      - name: Check out main for the "before" take
        if: env.WAKE_BEFORE == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          path: before
      - name: Build the "before" APK
        if: env.WAKE_BEFORE == 'true'
        working-directory: before
        run: |
          npm ci
          npm run build:android:web
          cd android && ./gradlew assembleDebug -PskipWeb --no-daemon --stacktrace
      - name: Enable KVM for the emulator
        # https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Sleep, wake, trim, doze, kill and hang the renderer
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BEFORE_APK_DIR: ${{ env.WAKE_BEFORE == 'true' && 'before/android/app/build/outputs/apk/debug' || '' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 512M
          # An animator scale of 0 reads as prefers-reduced-motion in the WebView, which would
          # skip every spring – the recovery is what is being recorded.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/android-wake-demo.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-wake-demo
          path: artifacts/android-wake-demo/
          if-no-files-found: warn
          retention-days: 14
