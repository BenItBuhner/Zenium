name: Release

# Builds every desktop package and the Android APK for a v* tag and publishes them as a GitHub
# release together with what the in-app updater needs: `update-manifest.json` (+ `.sig`), the
# electron-updater feeds (`latest*.yml`, `*.blockmap`) and `SHA256SUMS.txt`. Start it by pushing a
# tag (or running "Prepare release", which pushes one for you), or dispatch it by hand to rebuild
# an existing tag or to dry-run the pipeline from a branch. Pull requests that touch the pipeline
# itself run the whole build as a dry run (nothing is published) so changes are proven before merge.
#
# Optional repository secrets turn on code signing; without them the packages are built unsigned
# and the release notes say so:
#   MAC_CERTIFICATE_P12_BASE64, MAC_CERTIFICATE_PASSWORD      Developer ID Application certificate
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID       notarization (needs the certificate)
#   WINDOWS_CERTIFICATE_P12_BASE64, WINDOWS_CERTIFICATE_PASSWORD  Authenticode certificate
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD                    APK release keystore
#   UPDATE_MANIFEST_SIGNING_KEY                                ed25519 key (PKCS#8 PEM) that signs
#                                                              update-manifest.json; its public key is
#                                                              built into the apps of the same release
#                                                              (node .github/scripts/update-manifest.mjs keygen)

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - 'electron-builder.yml'
      - 'build/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.2.0). Leave empty to use the ref this run starts from.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build every package and keep them as workflow artifacts without creating a GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
      title: ${{ steps.meta.outputs.title }}
      update_public_key: ${{ steps.signing.outputs.public_key }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Check the tag against package.json
        id: meta
        run: node .github/scripts/release-meta.mjs
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Update-manifest signing key
        id: signing
        env:
          UPDATE_MANIFEST_SIGNING_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY }}
        run: |
          if [[ -n "$UPDATE_MANIFEST_SIGNING_KEY" ]]; then
            key="$(node .github/scripts/update-manifest.mjs public-key)"
            echo "public_key=$key" >> "$GITHUB_OUTPUT"
            echo "Update manifests of this release are signed; the apps pin the public key $key"
          else
            echo "public_key=" >> "$GITHUB_OUTPUT"
            echo "::notice::UPDATE_MANIFEST_SIGNING_KEY is not configured: the update manifest is published unsigned" \
              "and the apps rely on HTTPS + per-file SHA-256 (node .github/scripts/update-manifest.mjs keygen creates a key)"
          fi

  check:
    name: Typecheck, lint, test
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [prepare, check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            args: --linux --x64
          - name: linux-arm64
            os: ubuntu-latest
            args: --linux --arm64
          - name: windows-x64
            os: windows-latest
            args: --win --x64
          - name: windows-arm64
            os: windows-latest
            args: --win --arm64
            # electron-builder's bundled 7-Zip (24.09) packs the ARM64 executables of the NSIS payload
            # with its ARM64 branch filter (7-Zip 23+), which the installer's Nsis7z extractor cannot
            # decode: the installer exited 0 without zenium.exe and the six Chromium DLLs. Pinning the
            # older single-stream BCJ filter keeps every entry decodable. The x64 payload never used
            # that filter and is left as it is. electron-builder >= 26.15.6 pins BCJ for every NSIS
            # payload itself (electron-userland/electron-builder#9988); drop this with that bump.
            sevenzip_filter: BCJ
          - name: macos
            os: macos-latest
            args: --mac # x64 and arm64 disk images + zips, see electron-builder.yml
    defaults:
      run:
        shell: bash
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_P12_BASE64 }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      # Built into the app: the key the update manifest must be signed with (empty = not enforced).
      VITE_ZEN_UPDATE_PUBLIC_KEY: ${{ needs.prepare.outputs.update_public_key }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Decide what gets signed
        id: signing
        run: |
          signed=false
          notarized=false
          case "${{ matrix.name }}" in
            macos)
              if [[ -n "$MAC_CSC_LINK" ]]; then
                signed=true
                if [[ -n "$APPLE_ID" ]]; then notarized=true; fi
              fi
              ;;
            windows-*)
              if [[ -n "$WIN_CSC_LINK" ]]; then signed=true; fi
              ;;
          esac
          # A signed macOS app can be swapped in place by Squirrel.Mac; the app needs to know.
          echo "VITE_ZEN_MAC_SIGNED=$signed" >> "$GITHUB_ENV"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "notarized=$notarized" >> "$GITHUB_OUTPUT"
      - name: Bundle main, preload and renderer
        run: npx electron-vite build
      - name: Package
        env:
          # Only the 7z payload of an NSIS installer reads this (see the matrix); empty = 7-Zip default.
          ELECTRON_BUILDER_7Z_FILTER: ${{ matrix.sevenzip_filter }}
        run: |
          case "${{ matrix.name }}" in
            macos)
              if [[ -n "$MAC_CSC_LINK" ]]; then
                export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
              else
                # No certificate: do not search the runner keychain. build/after-pack.mjs then
                # ad-hoc signs the bundle (resource seal, hardened runtime) before the DMG / zip
                # are built; the macos-verify job checks the result on both architectures.
                export CSC_IDENTITY_AUTO_DISCOVERY=false
                unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
              fi
              ;;
            windows-*)
              if [[ -z "$WIN_CSC_LINK" ]]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
              ;;
          esac
          # --publish never: electron-builder would otherwise try to upload to GitHub itself. It
          # still writes the latest*.yml feeds because electron-builder.yml has a publish block.
          npx electron-builder ${{ matrix.args }} --publish never
      - name: Collect packages and updater feeds
        run: |
          mkdir -p release/assets release/meta
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::electron-builder produced no packages in dist/"
            ls -la dist || true
            exit 1
          fi
          cp "${files[@]}" release/assets/
          feeds=(dist/latest*.yml dist/*.blockmap)
          if [[ ${#feeds[@]} -eq 0 ]]; then
            echo "::error::electron-builder wrote no latest*.yml feed (is the publish block in electron-builder.yml intact?)"
            exit 1
          fi
          cp "${feeds[@]}" release/assets/
          if [[ "${{ matrix.name }}" == windows-arm64 && -f release/assets/latest.yml ]]; then
            # electron-builder names the Windows feed latest.yml for every arch; give arm64 its own
            # so both can sit in one release (the app asks for latest-arm64.yml on ARM Windows).
            mv release/assets/latest.yml release/assets/latest-arm64.yml
          fi
          # adhoc: macOS bundle sealed with an ad-hoc signature because no Developer ID is configured.
          adhoc=false
          if [[ "${{ matrix.name }}" == macos && "${{ steps.signing.outputs.signed }}" != true ]]; then adhoc=true; fi
          printf '{"platform":"%s","signed":%s,"notarized":%s,"adhoc":%s}\n' \
            "${{ matrix.name }}" "${{ steps.signing.outputs.signed }}" "${{ steps.signing.outputs.notarized }}" "$adhoc" \
            > "release/meta/${{ matrix.name }}.json"
          ls -l release/assets
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  android:
    name: Android
    needs: [prepare, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ZEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ZEN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ZEN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VITE_ZEN_UPDATE_PUBLIC_KEY: ${{ needs.prepare.outputs.update_public_key }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: npm ci
      - name: Build the chrome and page script
        run: npm run build:android:web
      - name: Release keystore
        id: keystore
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ZEN_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            # Gradle falls back to android/ci-debug.keystore: a debug key, but the same one in every
            # run, so debug-keyed releases upgrade each other in place.
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not configured; the APK is signed with the committed CI debug key (android/ci-debug.keystore), not a release key"
            echo "signing=ci-debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease -PskipWeb --no-daemon --stacktrace
      - name: Collect and verify the APK
        run: |
          mkdir -p release/assets release/meta
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one release APK, found: ${apks[*]:-none}"
            exit 1
          fi
          target="release/assets/zenium-${{ needs.prepare.outputs.version }}.apk"
          cp "${apks[0]}" "$target"
          # The applicationId goes into the update manifest: an installed app with another id
          # (app.zen.chromium, before the rename) gets this APK installed alongside, not over it,
          # and the app explains that instead of comparing signing keys.
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          package="$("$aapt" dump badging "$target" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          if [[ -z "$package" ]]; then
            echo "::error::Could not read the applicationId from the APK (aapt dump badging)"
            exit 1
          fi
          echo "APK applicationId: $package"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$target" | tee "$RUNNER_TEMP/certs.txt"
          # The signing certificate's digest goes into the update manifest: Android only upgrades
          # in place when it matches the installed app, and the app warns the user otherwise.
          # apksigner prints "Signer #1 certificate SHA-256 digest:" or, per scheme, "V2 Signer:
          # certificate SHA-256 digest:"; every signer of one APK shares the certificate.
          signer="$(sed -n 's/.*certificate SHA-256 digest: *\([0-9a-fA-F]\{64\}\).*/\1/p' "$RUNNER_TEMP/certs.txt" | head -1 | tr 'A-F' 'a-f')"
          if [[ -z "$signer" ]]; then
            echo "::warning::Could not read the APK signing certificate digest from apksigner; the manifest will not carry it"
          fi
          if [[ "${{ steps.keystore.outputs.signing }}" == ci-debug ]]; then
            # The whole point of the committed key is a signer that never changes: prove it.
            expected="$(keytool -exportcert -rfc -keystore android/ci-debug.keystore -storepass zenium-ci-debug -alias zenium-ci-debug \
              | openssl x509 -noout -fingerprint -sha256 | sed 's/.*=//; s/://g' | tr 'A-F' 'a-f')"
            if [[ "$signer" != "$expected" ]]; then
              echo "::error::APK signer $signer is not the committed CI debug key $expected (did Gradle fall back to a per-machine debug key?)"
              exit 1
            fi
            echo "APK signed with the committed CI debug key $expected"
          fi
          printf '{"platform":"android","signing":"%s","signer":"%s","packageName":"%s"}\n' \
            "${{ steps.keystore.outputs.signing }}" "$signer" "$package" > release/meta/android.json
          cat release/meta/android.json
          ls -l release/assets
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos-verify:
    name: macOS bundle check (${{ matrix.arch }})
    needs: [prepare, desktop]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest # Apple Silicon
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: release
      - name: Unpack the ${{ matrix.arch }} archive and disk image
        run: |
          set -euo pipefail
          zip="release/assets/zenium-$VERSION-$ARCH.zip"
          dmg="release/assets/zenium-$VERSION-$ARCH.dmg"
          ls -l "$zip" "$dmg"
          mkdir -p "$RUNNER_TEMP/zip" && ditto -x -k "$zip" "$RUNNER_TEMP/zip"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg" > /dev/null
          echo "APP_ZIP=$RUNNER_TEMP/zip/Zenium.app" >> "$GITHUB_ENV"
          echo "APP_DMG=$RUNNER_TEMP/dmg/Zenium.app" >> "$GITHUB_ENV"
      - name: Signature and resource seal
        # The whole point of the ad-hoc signature: a sealed bundle that codesign accepts strictly.
        # With a Developer ID configured this step verifies that signature instead.
        run: |
          set -euo pipefail
          for app in "$APP_ZIP" "$APP_DMG"; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dvv "$app" 2>&1 | grep -E '^(Identifier|Signature|CodeDirectory|Sealed Resources|TeamIdentifier)' | sed 's/^/   /'
            codesign -dvv "$app" 2>&1 | grep -q '^Sealed Resources version=' || { echo "::error::$app has no resource seal"; exit 1; }
            file "$app/Contents/MacOS/Zenium" | sed 's/^/   /'
          done
          echo "== Gatekeeper assessment (informational; an ad-hoc signature is rejected, but as 'unsigned', not 'damaged')"
          spctl --assess --type execute --verbose=4 "$APP_ZIP" 2>&1 | sed 's/^/   /' || true
      - name: Launch smoke test
        # A hardened-runtime ad-hoc signature with the wrong entitlements would kill the app at
        # startup; a launch that survives 20 s proves the bundle runs on this architecture.
        run: |
          set -euo pipefail
          "$APP_ZIP/Contents/MacOS/Zenium" > "$RUNNER_TEMP/zenium.log" 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            echo "Zenium $VERSION ($ARCH) is running after 20 s (pid $pid)"
            kill "$pid" || true
          else
            wait "$pid" || code=$?
            echo "::error::Zenium exited early with code ${code:-?}"
            cat "$RUNNER_TEMP/zenium.log"
            exit 1
          fi
      - name: Detach
        if: always()
        run: hdiutil detach "$RUNNER_TEMP/dmg" > /dev/null 2>&1 || true

  assemble:
    name: Manifest, checksums, notes
    needs: [prepare, desktop, android, macos-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0 # every tag, to pick the changelog range
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Update manifest
        run: node .github/scripts/update-manifest.mjs build
        env:
          RELEASE_TAG: ${{ env.TAG }}
          RELEASE_VERSION: ${{ env.VERSION }}
          UPDATE_MANIFEST_SIGNING_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY }}
      - name: Checksums
        working-directory: release/assets
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        # The "What's changed" API needs contents: write, which this read-only job does not have
        # on purpose; here the notes fall back to a commit-history link and the publish job
        # regenerates them with the full changelog.
        run: node .github/scripts/release-notes.mjs
        env:
          RELEASE_TAG: ${{ env.TAG }}
          RELEASE_VERSION: ${{ env.VERSION }}
          NOTES_FILE: release/notes.md
      - name: Dry-run summary
        if: needs.prepare.outputs.publish != 'true'
        run: |
          {
            echo "### Dry run: nothing published"
            echo
            echo "The packages, feeds, manifest and notes below are attached to this run as the \`release-bundle\` artifact."
            echo
            echo '```'
            ls -l release/assets
            echo '```'
            echo
            cat release/notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          # The publish job regenerates the notes (with the changelog); it needs the per-platform
          # signing facts in release/meta as much as the packages.
          path: |
            release/assets
            release/meta
            release/notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: [prepare, assemble]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Normally ~5 minutes; the headroom is for the bounded upload retries below (worst case for
    # one package: 5 attempts × 5 minutes plus the pauses), not for the happy path.
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TITLE: ${{ needs.prepare.outputs.title }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0 # every tag, to pick the changelog range
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release
      - name: Release notes with the generated changelog
        run: node .github/scripts/release-notes.mjs
        env:
          RELEASE_TAG: ${{ env.TAG }}
          RELEASE_VERSION: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ github.token }}
          NOTES_FILE: release/notes.md
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: release/assets/*
      - name: Create the draft release and upload the packages
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft" 2>/dev/null; then
            if [[ "$(cat "$RUNNER_TEMP/is-draft")" != "true" ]]; then
              echo "::error::Release $TAG is already published. Delete it first to rebuild it, or bump the version."
              exit 1
            fi
            gh release edit "$TAG" --title "$TITLE" --notes-file release/notes.md --prerelease="$PRERELEASE"
          else
            flags=()
            if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" --draft --verify-tag --title "$TITLE" --notes-file release/notes.md "${flags[@]}"
          fi
          # One file per call with retries: a single transient HTTP 500 from uploads.github.com
          # used to fail the whole step halfway through (v0.3.19, first attempt). Every attempt is
          # bounded, because `gh release upload` has no timeout of its own: on v0.3.21 an attempt
          # stalled for 17 minutes during a GitHub upload incident and ate the job's time limit.
          # When GitHub is healthy the runner pushes all 24 assets (1.2 GB) in about a minute
          # (v0.3.21 retry: 65 s); on a slow day the batch took 8 minutes (v0.3.20), i.e. about a
          # minute for the largest ~140 MB package. Five minutes for one package therefore means
          # "stalled", not "slow".
          for file in release/assets/*; do
            for attempt in 1 2 3 4 5; do
              if timeout -k 30 300 gh release upload "$TAG" "$file" --clobber; then break; fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "::error::Uploading $(basename "$file") failed after $attempt attempts"
                exit 1
              fi
              echo "::warning::Uploading $(basename "$file") failed or stalled (attempt $attempt); retrying"
              sleep $((15 * attempt))
            done
          done
          uploaded="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          expected="$(find release/assets -type f | wc -l | tr -d ' ')"
          if [[ "$uploaded" != "$expected" ]]; then
            echo "::error::Release $TAG has $uploaded assets, expected $expected"
            exit 1
          fi
      - name: Publish
        run: |
          gh release edit "$TAG" --draft=false
          url="$(gh release view "$TAG" --json url --jq .url)"
          echo "Published $url"
          {
            echo "## Released $TAG"
            echo
            echo "$url"
            echo
            echo "Update manifest: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/update-manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"
