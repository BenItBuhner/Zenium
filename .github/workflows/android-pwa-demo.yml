name: Android Add to Home screen demo

# Records "Add to Home screen" on a hardware-accelerated Android emulator: the name-edit sheet for
# a page without a manifest, the ambient banner on an app's second visit (swiped away), the app
# menu's Add to Home Screen opening the install sheet built from the manifest, its Add handing the
# request to the launcher's own pin dialog, the confirmation toast, the menu reading "Open <app>"
# inside the app, and the pinned tile opening the app's URL in Zenium from the Home screen. The
# pages come from a loopback server inside the driver. Dispatch-only, like the gesture demo: it
# takes about ten minutes and says nothing about a change being correct. The build, the emulator
# and the Gradle cache live in android-emulator-demo.yml; this file only picks the driver and the
# demo it runs.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/android-add-to-home-install-7c2e

permissions:
  contents: read

concurrency:
  group: android-pwa-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Add to Home screen demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.PwaDemo
        DEMO_DIR=pwa-demo
        DEMO_OUT=artifacts/android-pwa-demo
        DEMO_VIDEO=android-pwa-demo.mp4
      artifact-name: android-pwa-demo
      artifact-path: artifacts/android-pwa-demo/

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Add to Home screen demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.PwaDemo
        DEMO_DIR=pwa-demo
        DEMO_OUT=artifacts/android-pwa-demo
        DEMO_VIDEO=android-pwa-demo.mp4
      artifact-name: android-pwa-demo-second-boot
      artifact-path: artifacts/android-pwa-demo/
