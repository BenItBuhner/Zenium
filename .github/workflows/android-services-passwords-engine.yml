name: Android passwords engine demo (temporary, branch only)

# Temporary verification for the services-passwords engine branch, removed before the PR is
# marked ready: records the password engine on an API 34 emulator with a device PIN through the
# shared emulator recipe, so the Keystore-bound vault key, BiometricPrompt re-authentication and
# the document-picker CSV export and import all go through the real system UI.
on:
  push:
    branches: [cursor/services-passwords-24d1]

permissions:
  contents: read

jobs:
  record:
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-passwords-engine-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.PasswordsEngineDemo
        DEMO_DIR=passwords-demo
        DEMO_OUT=artifacts/android-services-passwords-engine
        DEMO_VIDEO=services-passwords-android-engine.mp4
      artifact-name: android-services-passwords-engine
      artifact-path: artifacts/android-services-passwords-engine/
