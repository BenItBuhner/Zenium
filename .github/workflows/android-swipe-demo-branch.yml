name: Android swipe demo (branch)

# Temporary per-branch caller: records the swipe-reorder sequence on every push of this branch.
# Removed before the PR is marked ready; the sequence stays available as `demo: swipe-reorder`
# of android-overview-demo.yml.
on:
  push:
    branches:
      - cursor/overview-swipe-reorder-f378

permissions:
  contents: read

concurrency:
  group: android-swipe-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: swipe-reorder demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.SwipeReorderDemo
        DEMO_DIR=swipe-demo
        DEMO_OUT=artifacts/android-overview-demo
        DEMO_VIDEO=overview-swipe-reorder-demo.mp4
      artifact-name: android-overview-demo
      artifact-path: artifacts/android-overview-demo/
