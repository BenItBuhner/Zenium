name: Android Magic Stack demo

# Runs the new tab page's cards (Chrome's Magic Stack; "Cards" to the user) on a device, every act
# a finger's (NTP-16, W6-4): a seeded profile with a recently closed tab, a completed download
# whose file is on the device, two bookmarks and one revoked-permissions record gives the stack
# its four cards in the stack's fixed order (Continue where you left off, Downloads, Bookmarks,
# Safety check), the tip card (NTP-20, W6-E15: Chrome's educational tip module, "Zenium tips")
# a fifth – one tip at a time at the stack's end, the theme tip on a fresh profile's memory; the
# cards named for TalkBack, the strip a carousel with a page indicator (dots that are no
# controls, a status line reading the page), above the tiles at the bottom dock, each card the
# strip's width less the 24 the next one peeks by; a real swipe pages the strip (a measured
# scene, magic-stack-swipe) and a swipe back pages back; the Safety check card (NTP-19, W6-E9:
# Chrome's Safety Hub module, its low-priority type from the seed's one revoked record) swiped
# to, its face read against Chrome's and the gate's numbers, Review opening Settings on the
# Safety check group in a new tab without ending the card's run, the page made active again in
# front of the Settings tab – re-mounted, without the tip card: the module rests three days after
# an impression – and the strip swiped home; the tip card's step: fresh pages opened by a finger
# on the bar's New tab and swiped to their last card show the tips in Chrome's order (the theme,
# the default browser where the host says Zenium is not the default, tab groups over the seed's
# twelve tabs, Delete browsing data), each face read against Chrome's words and the gate's
# numbers and shot light and dark, the impression on the device's memory before the finger, the
# theme tip's Try it now opening the page's customise sheet and retiring the card, the days
# between the tips the driver's (the memory's stamps moved back through the page's own command),
# a page within three days of a tip showing none; a card's ⋮ opens the shared local menu titled
# by the module, Hide This (a measured scene, magic-stack-hide, a probe on the strip recording
# the 120 ms fade and the siblings' glide into the gap) writes the device's hidden set; Customise
# opens the "Cards" sheet of switch rows and a switch brings the card back; every switch off
# leaves the page without the stack; the gear sheet's Cards row is the way back when no ⋮ is
# left, swapping the sheets; one card back stands alone at full width without dots; the Continue
# card's row restores the closed tab. The driver (MagicStackDemo) writes its findings next to the
# recording; a claim that does not hold fails the run. Dispatch-only, like the other demos: it
# takes about ten minutes. The build, the emulator and the Gradle cache live in
# android-emulator-demo.yml; this file only picks the driver.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-magic-stack-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Magic Stack demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.MagicStackDemo
        DEMO_DIR=magic-stack-demo
        DEMO_OUT=artifacts/android-magic-stack-demo
        DEMO_VIDEO=android-magic-stack-demo.mp4
      artifact-name: android-magic-stack-demo
      artifact-path: artifacts/android-magic-stack-demo/
