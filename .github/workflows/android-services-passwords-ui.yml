name: Android services-passwords UI demo (temporary)

# TEMPORARY caller for the services-passwords UI branch, removed before the PR leaves draft:
# records PasswordsUiDemo (the password manager's phone surfaces behind a device PIN) on a
# GitHub-hosted emulator once per push. The build, the emulator and the Gradle cache live in
# android-emulator-demo.yml; this file picks the driver and names the artifact.
on:
  push:
    branches:
      - cursor/services-passwords-ui-24d1

permissions:
  contents: read

concurrency:
  group: android-services-passwords-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Passwords UI demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-passwords-ui-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.PasswordsUiDemo
        DEMO_DIR=passwords-ui-demo
        DEMO_OUT=artifacts/android-services-passwords-ui
        DEMO_VIDEO=services-passwords-android-ui-demo.mp4
      artifact-name: android-services-passwords-ui
      artifact-path: artifacts/android-services-passwords-ui/
      api-level: '34'
