name: Android unload probe latency smoke (temporary)

# TEMPORARY, this branch alone: proves the opt-in UnloadProbeLatency measurement (seed A10
# step 1; android/docs/unload-probe-latency.md) runs end to end on the CI emulator, prints its
# findings block and exits 0, in the light and the dark colour scheme. The numbers it prints are
# the emulator's, labelled as such; the device run is a human's with a phone. Reverted on its
# own before the PR is ready, so .github/ is byte-identical to main at the final head.
on:
  push:
    branches:
      - cursor/android-unload-probe-latency-9271

permissions:
  contents: read

concurrency:
  group: android-unload-probe-latency-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light:
    name: Unload probe latency, light
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.UnloadProbeLatency
        DEMO_DIR=unload-probe-latency
        DEMO_OUT=artifacts/android-unload-probe-latency
        DEMO_VIDEO=android-unload-probe-latency-light.mp4
        DEMO_THEME=light
        DEMO_RECORD=0
        DEMO_ARGS=-e holdBackgroundWork true
      post-script: |
        { echo '```'; cat artifacts/android-unload-probe-latency/unload-probe-latency.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-unload-probe-latency-light
      artifact-path: artifacts/android-unload-probe-latency/

  light-again:
    name: Unload probe latency, light, second boot
    needs: light
    if: ${{ failure() && needs.light.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.UnloadProbeLatency
        DEMO_DIR=unload-probe-latency
        DEMO_OUT=artifacts/android-unload-probe-latency
        DEMO_VIDEO=android-unload-probe-latency-light.mp4
        DEMO_THEME=light
        DEMO_RECORD=0
        DEMO_ARGS=-e holdBackgroundWork true
      post-script: |
        { echo '```'; cat artifacts/android-unload-probe-latency/unload-probe-latency.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-unload-probe-latency-light-second-boot
      artifact-path: artifacts/android-unload-probe-latency/

  dark:
    name: Unload probe latency, dark
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.UnloadProbeLatency
        DEMO_DIR=unload-probe-latency
        DEMO_OUT=artifacts/android-unload-probe-latency
        DEMO_VIDEO=android-unload-probe-latency-dark.mp4
        DEMO_THEME=dark
        DEMO_RECORD=0
        DEMO_ARGS=-e holdBackgroundWork true
      post-script: |
        { echo '```'; cat artifacts/android-unload-probe-latency/unload-probe-latency.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-unload-probe-latency-dark
      artifact-path: artifacts/android-unload-probe-latency/

  dark-again:
    name: Unload probe latency, dark, second boot
    needs: dark
    if: ${{ failure() && needs.dark.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.UnloadProbeLatency
        DEMO_DIR=unload-probe-latency
        DEMO_OUT=artifacts/android-unload-probe-latency
        DEMO_VIDEO=android-unload-probe-latency-dark.mp4
        DEMO_THEME=dark
        DEMO_RECORD=0
        DEMO_ARGS=-e holdBackgroundWork true
      post-script: |
        { echo '```'; cat artifacts/android-unload-probe-latency/unload-probe-latency.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-unload-probe-latency-dark-second-boot
      artifact-path: artifacts/android-unload-probe-latency/
