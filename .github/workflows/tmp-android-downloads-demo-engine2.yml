name: Android downloads demo (engine-2 verification, temporary)

# TEMPORARY caller for the one emulator run that verifies the downloads engine additions
# (interrupt reasons, download.deleteFile, fileMissing) on cursor/services-downloads-engine-2-24d1.
# Same driver, server and inputs as android-downloads-demo.yml, which stays dispatch-only; this
# file is removed before the PR goes ready.
on:
  push:
    branches:
      - cursor/services-downloads-engine-2-24d1

permissions:
  contents: read

concurrency:
  group: tmp-android-downloads-demo-engine2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Downloads demo (engine-2)
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.DownloadsDemo
        DEMO_DIR=downloads-demo
        DEMO_OUT=artifacts/android-downloads-demo
        DEMO_VIDEO=android-downloads-demo.mp4
      setup-script: |
        mkdir -p artifacts/android-downloads-demo
        (setsid nohup node .github/scripts/downloads-demo-server.mjs 18923 > artifacts/android-downloads-demo/server.log 2>&1 &)
        sleep 2
        curl -sf -o /dev/null http://127.0.0.1:18923/page.html
        curl -sf -o /dev/null -H 'Range: bytes=1048576-' http://127.0.0.1:18923/flaky.bin
        echo "download test server answering on 18923"
      artifact-name: android-downloads-demo-engine2
      artifact-path: artifacts/android-downloads-demo/
      api-level: '34'
