name: Android credential safety demo

# Records the credential-safety UI on a hardware-accelerated Android emulator: a fixture sign-in on
# a demo shop the instrumentation serves, judged against a stand-in for the Pwned Passwords range
# API on the same server (the host's debug-only net origin override; the real service is never
# asked) – the save prompt sheet for a clean password as the reference, the leak warning sheet for
# a breached one ("Change your password", dragged and let go, then Ignore under a finger, the
# deferred save prompt behind it) – and the password manager's note row in a login's detail and
# its edit view. The driver measures the frames of both sheets' open and dismiss and of the drag
# (DemoHarness.measureFrames; the tables land in the job summary). Dispatch-only, like the other
# demos: it takes about ten minutes and says nothing about a change being correct. The build, the
# emulator and the Gradle cache live in android-emulator-demo.yml; this file only picks the driver.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-credential-safety-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Credential safety demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.CredentialSafetyDemo
        DEMO_DIR=credential-safety-demo
        DEMO_OUT=artifacts/android-services-credential-safety
        DEMO_VIDEO=services-credential-safety-android-demo.mp4
      artifact-name: android-services-credential-safety
      artifact-path: artifacts/android-services-credential-safety/
      api-level: '34'

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Credential safety demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.CredentialSafetyDemo
        DEMO_DIR=credential-safety-demo
        DEMO_OUT=artifacts/android-services-credential-safety
        DEMO_VIDEO=services-credential-safety-android-demo.mp4
      artifact-name: android-services-credential-safety-second-boot
      artifact-path: artifacts/android-services-credential-safety/
      api-level: '34'
