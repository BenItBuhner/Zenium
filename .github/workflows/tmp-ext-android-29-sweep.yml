name: TEMPORARY - compat round 23 sweep and frame budget trigger

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml or android-ext-runtime-demo.yml (HTTP 403 on the dispatches
# endpoint), and both stay dispatch-only; this file runs the same jobs on a push to the branch,
# and only for an EMPTY marker commit whose subject starts with the bracketed tokens below and
# carries no other bracketed word:
#   - `[sweep]`: the two sweep jobs over compat round 23's rows – the thirty of ranks 571-600
#     (`.github/scripts/ext-compat/next30-round20.json`, the five largest bundles last in the
#     table as rounds 19-22 ordered their own; their ids lead the lists below in rank order, ahead
#     of the carried) and the thirty rows carried from round 22 (its section 7 and the brief's
#     regression list): ADBLOCK AD BLOCKER PRO as the OOM class's regression row (the install, the
#     heap split, the `configured` line's `builders presized … (N grown)` field and – this round –
#     the ART peak's STEP, R23-1; its same-process restart proof runs in the `[lane]` job, where it
#     is the first row); QR Code Reader (rank 543 P with the app alive on both WebViews); iCloud
#     Passwords (its `chrome.privacy 3/3` and the DNT key row: `privacy.doNotTrack` published, no
#     `privacy.dnt`); Zoom Video (the storage round trip's `back` leg, medians 0-1 ms; its own
#     two-writer race standing) with round 21's storage order probe (R23-3's lost finger on 156);
#     Extensity and Bookmark Sidebar (round 22's R22-7 and R22-6 readings); the two webRequest
#     sniffer rows Chrono Download Manager (with its restart proof) and Video Downloader PLUS and
#     the #448 proof row for the header stage, the response stage and the extension-URL exemption;
#     tl;dv (zero re-executions); SingleFile (with the six-pass lane beside); round 20's proof rows
#     Advanced Font Settings with the fonts probes A and B, the privacy probe and the fonts page
#     probe; rounds 17-21's fixed rows Markdown Viewer, Cursor Helper, Toggl Track, Infinity New
#     Tab and RoValra; and round 22's open rows with an item this round – Temp Mail (R23-4),
#     PerfectPixel and Jungle Scout (R23-5), Screen Recorder (R23-6, the page-dialog sheet's proof),
#     Image Downloader and Wayback Machine (R23-8, recorded readings), Zoom for Google Chrome and
#     Magical. Round 22's carried rows the brief does not carry (Buyhatke, Speak Subtitles, NoteGPT,
#     Search by Image, OP Auto Clicker) keep their rows in CompatSweep.kt and are in no list here.
#     AdGuard VPN, Buyhatke on 113, axe DevTools and Augmented Steam are notOnGoogleImage by rounds
#     16, 19 and 20, read on the AOSP lane when their rows run, and not re-run on the Google image.
#     `[sweep113]` fires the System WebView sweep job alone (with its rows-left check and second
#     boot) and `[sweep156]` the AOSP-image sweep job alone (with its rows-left check and second
#     boot) – optional single-lane markers, only for a re-run the coordinator grants.
#     SWEEP_LAST and the rows-left job's LAST_IDS are empty for the sweep this round.
#   - `[budget]`: the runtime demo's two jobs with the frame budget alone (ExtensionScrollBudget
#     under SKIP_DEMO=1: the long fixture scrolled with 0, 2, 3 and 6 extensions and the
#     fetch-heavy twin, the jank report in the job summary) and, ahead of it, EngineProbe.
#     `[budget113]` fires the System WebView budget job alone – only for a re-run the coordinator
#     grants.
#   - `[singlefile]`: SingleFile's row alone, repeated six times on one boot per WebView
#     (SWEEP_REPEAT=6: the driver grades the row again after its disable, each reading its own row
#     in results.json), R5's measure (round 18 section 6.1 row 04).
#   - `[lane]`: a targeted few-row lane (SWEEP_ONLY set by hand below) for a runtime or driver
#     change read on its own without the whole sweep: Adblock Ad Blocker Pro FIRST – the boot's
#     first options-P row, so the driver's post-sweep restart proof (`restoredOptionsTab`, the
#     same-process start-over round 21b closed) runs on it and its install and restart are read on
#     both WebViews with the app alive, `(0 grown)` and the heap split –, then Popup Blocker
#     (strict) (its popup's `confirm()` as the host's page-dialog sheet, 949db0685 / 295901d38), the
#     storage order probe (R23-3), Magical (round 22's `[lane]` read), and Reader View LAST OF ALL
#     (R23-7: the stall poll's sink on 156 – a row that sinks loses nothing behind it). The driver
#     runs the selected rows in ITS TABLE's order with the SWEEP_LAST ids moved to the end, and –
#     from this round's driver item – the SWEEP_LAST ids in THEIR LIST's order (round 22's BEFORE
#     read them in the table's); so the lane's SWEEP_LAST names the four behind Adblock in the
#     order they are to run, Reader View last.
# Every emulator job's driver step carries its own `timeout-minutes` below the job's cap
# (`driver-timeout-minutes`, this round's optional input of the shared workflow): a driver that
# sinks past it is cut with the job still alive, so the artifact upload and the emulator-death
# reading run – round 22's AFTER lost its 156 sweep's artifact to the job cap.
# One run per marker push; a re-run past the one attempt is the coordinator's to grant.
# A sweep whose emulator went away under the driver (the shared workflow's `emulator-died`: qemu
# gone or the guest frozen, or the runner action's SDK download coming down broken) boots once more
# and sweeps the rows the first boot did not grade (read off the results.json the sweep script pulls
# after every row), the row that was in flight at the death last so a row that kills the emulator
# loses no row after it; the second boot's artifact is the first's name with `-2`.
