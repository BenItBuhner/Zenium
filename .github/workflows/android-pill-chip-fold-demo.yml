name: Android pill chip fold demo

# Records the phone pill at rest and its chips' fold (OMN-02; design language v2 §9.29 as amended
# on Bennett's ruling) on the GitHub repository page he photographed, with real touches
# (PillChipFoldDemo): the resting pill carrying the favicon, the host and the lock alone in light
# and dark with the bar docked at the top and at the bottom (the stills
# `android-chip-fold-rest-github-{light,dark}-{top,bottom}`), the host box measured on Bennett's
# five-button bar and on the default bar at the system font size, at 130 percent and with #237's
# text zoom emulated, the site-information sheet's rows for the folded chips (the shield with its
# count leading to Settings › Privacy and Security, the translate offer raising its bar), a playing
# video taking the lock's slot with the Now playing chip on the §11.4 cross-fade (the chrome's
# `animate` calls on record) and giving it back, and what TalkBack hears at the address stop. The
# driver writes `android-chip-fold-results.json` and `android-chip-fold-notes.txt`, and fails when
# a claim did not hold. Dispatch-only, like the other demos: it takes about twelve minutes and says
# nothing about a change being correct. The build, the emulator and the Gradle cache live in
# android-emulator-demo.yml; this file only picks the driver and the demo it runs.
on:
  workflow_dispatch:
    inputs:
      theme:
        description: Colour scheme the profile boots in (the driver records both; this one comes first, on the video)
        required: false
        type: choice
        options:
          - dark
          - light
        default: dark

permissions:
  contents: read

concurrency:
  group: android-pill-chip-fold-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Pill chip fold demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.PillChipFoldDemo
        DEMO_DIR=pill-chip-fold-demo
        DEMO_OUT=artifacts/android-pill-chip-fold-demo
        DEMO_VIDEO=android-chip-fold-demo.mp4
        DEMO_THEME=${{ inputs.theme || 'dark' }}
      artifact-name: android-pill-chip-fold-demo
      artifact-path: artifacts/android-pill-chip-fold-demo/

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Pill chip fold demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.PillChipFoldDemo
        DEMO_DIR=pill-chip-fold-demo
        DEMO_OUT=artifacts/android-pill-chip-fold-demo
        DEMO_VIDEO=android-chip-fold-demo.mp4
        DEMO_THEME=${{ inputs.theme || 'dark' }}
      artifact-name: android-pill-chip-fold-demo-second-boot
      artifact-path: artifacts/android-pill-chip-fold-demo/
