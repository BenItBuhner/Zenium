name: Android status bar stills

# TEMPORARY (removed before the PR is marked ready): the before/after stills of the status-bar
# fix on the shared emulator recipe – the 0.3.82 release APK (main, unfixed) and this branch's
# debug APK, each started cold under the release bisect's reproducing condition, in every dock
# and scheme (see the driver's header).
on:
  push:
    branches: [cursor/android-status-bar-inset-5775]
    paths:
      - .github/workflows/android-status-bar-stills.yml
      - .github/scripts/android-status-bar-stills.sh

permissions:
  contents: read

concurrency:
  group: android-status-bar-stills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stills:
    name: Before and after stills
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-status-bar-stills.sh
      gradle-tasks: assembleDebug -PskipWeb
      script-env: |
        APKS=before=artifacts/apks/zenium-0.3.82.apk=io.github.benitbuhner.zenium after=android/app/build/outputs/apk/debug=io.github.benitbuhner.zenium.debug
        STILLS_OUT=artifacts/android-status-bar-stills
      setup-script: |
        mkdir -p artifacts/apks
        curl -fsSL --retry 3 -o artifacts/apks/zenium-0.3.82.apk \
          https://github.com/BenItBuhner/Zenium/releases/download/v0.3.82/zenium-0.3.82.apk
        ls -la artifacts/apks android/app/build/outputs/apk/debug
      artifact-name: android-status-bar-stills
      artifact-path: artifacts/android-status-bar-stills/
      timeout-minutes: 45
