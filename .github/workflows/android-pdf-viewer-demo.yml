name: Android PDF viewer demo

# Records the inline PDF viewer (zen://pdf, CT-02) on a hardware-accelerated Android emulator and
# uploads the video and screenshots: a page of the driver's loopback server links to a PDF it
# sends as application/pdf; a finger on the link has the WebView hand the response to the
# downloader and, complete, the tab shows the file in the viewer instead of the system chooser.
# Then the viewer's controls under real fingers (PdfViewerUiDemo, the default): a pinch out
# zooms and the bar's zoom reads the percentage, the zoom sheet's Fit to width brings the pages
# back, Go to page leads to a typed page, the find bar counts and steps through the matches, the
# Contents sheet leads to its last page, the overflow's Rotate turns the pages and Open with
# brings the system chooser, Share on the bar the share sheet. The engine's driver
# (PdfViewerDemo, `driver: engine`) presses the same commands through the core instead. Either
# asserts on the viewer's report after every step and fails the run when a touch or a command
# did not take. Dispatch-only, like the downloads demo: it takes about ten minutes and says
# nothing about a change being correct. The build, the emulator and the Gradle cache live in
# android-emulator-demo.yml; this file picks the driver and names the artifact.
on:
  workflow_dispatch:
    inputs:
      driver:
        description: >-
          Which driver runs: ui presses the viewer's bar and sheets with real fingers
          (PdfViewerUiDemo); engine drives the viewer through the core's commands (PdfViewerDemo).
        type: choice
        options: [ui, engine]
        default: ui

permissions:
  contents: read

concurrency:
  group: android-pdf-viewer-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: PDF viewer demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header). The UI
      # driver unless the dispatch asked for the engine's; the artifact keeps its name either way.
      script-env: |
        DEMO_CLASS=app.zen.chromium.${{ inputs.driver == 'engine' && 'PdfViewerDemo' || 'PdfViewerUiDemo' }}
        DEMO_DIR=pdf-viewer-demo
        DEMO_OUT=artifacts/android-pdf-viewer-demo
        DEMO_VIDEO=android-pdf-viewer-demo.mp4
      artifact-name: android-pdf-viewer-demo
      artifact-path: artifacts/android-pdf-viewer-demo/
      # The downloader writes through MediaStore.Downloads (API 29+); the downloads demo's image.
      api-level: '34'
