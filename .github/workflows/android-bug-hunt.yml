name: Android bug hunt

# Walks every surface of the phone chrome on a hardware-accelerated Android emulator the way a
# user would (onboarding, omnibox, navigation and back, tab overview, menu, settings, panels,
# downloads, long-press, rotation, dark mode, font scale, intents, fullscreen video, restart,
# error pages) while recording the screen and logcat, and uploads it all for a human or an agent
# to grade. Dispatch-only: it takes half an hour and asserts nothing about correctness. The
# recording comes from an API 34 Google APIs image on a software GPU, so expect a handful of
# frames per second; judge motion by whether frames exist between states, not by smoothness.
on:
  workflow_dispatch:
  # TEMPORARY: worker tokens cannot dispatch workflows; remove before the branch is reviewed.
  push:
    branches: [cursor/android-bug-hunt-adab]

permissions:
  contents: read

concurrency:
  group: android-bug-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  hunt:
    name: Walk the app on an API 34 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: npm ci
      - name: Build the chrome and page script
        run: npm run build:android:web
      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew assembleDebug -PskipWeb --no-daemon --stacktrace
      - name: Enable KVM for the emulator
        # https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Walk the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 512M
          # An animator scale of 0 reads as prefers-reduced-motion in the WebView, which would
          # skip every spring – the animations are part of what is being graded.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/android-bug-hunt.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-bug-hunt
          path: artifacts/android-bug-hunt/
          if-no-files-found: warn
          retention-days: 14
