name: TEMPORARY - compat round 18b single-row lane trigger (tl;dv)

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml (HTTP 403 on the dispatches endpoint) and it stays dispatch-only;
# this file runs the same driver on a push to the branch, modelled on compat round 18's
# tmp-ext-android-22-sweep.yml with its `[lane]` jobs alone:
#   - `[lane]` in the commit message: ONE ROW, tl;dv (rank 440, lknmjhcajhfbbglglccadlfdjbaiifig,
#     its row as CompatSweep.kt has it after round 18), on both WebViews – the measurement of the
#     worker page's refusal to serve its own script as a sub-resource (round 18 section 7.1's
#     first item: tl;dv's Firebase Auth build appended `<script src="?onload=__iframefcb<N>">`
#     through the worker page's bare `document`, the served origin answered the file, and the
#     1.09 M-char bundle ran again and again – 115 runs in 103 s on the AOSP lane – until the
#     guest's low-memory killer took the WebView's one shared renderer at 2.55 GB RSS).
#     Measured off the artifact: distinct `__iframefcb<N>` ids as console-line sources (the
#     re-executions; the target is none), the refusal's `ZenExt` log line, no `lowmemorykiller`
#     kill of the sandboxed process and no `chrome renderer gone`, the app's and the renderer's
#     RSS peaks in memory-samples.txt / memory-peaks.txt, and the row's grades beside round 18's.
# One run is granted; any second run asks first. No rows-left / second-boot machinery: a single
# row's second boot would be a second run.
on:
  push:
    branches:
      - cursor/android-ext-worker-page-self-script-4435

permissions:
  contents: read

concurrency:
  group: tmp-ext-android-23-sweep-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lane-system-webview:
    if: contains(github.event.head_commit.message, '[lane]')
    name: tl;dv alone - System WebView (API 34 image)
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-ext-compat-sweep.sh
      artifact-name: android-ext-compat-sweep-lane
      artifact-path: artifacts/android-ext-compat-sweep/
      script-env: |
        SWEEP_ONLY=lknmjhcajhfbbglglccadlfdjbaiifig
        SWEEP_LAST=
      timeout-minutes: 75

  lane-modern-webview:
    if: contains(github.event.head_commit.message, '[lane]')
    name: tl;dv alone - Best effort - Chromium snapshot WebView on an AOSP image
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-ext-compat-sweep.sh
      artifact-name: android-ext-compat-sweep-lane-modern-webview
      artifact-path: artifacts/android-ext-compat-sweep/
      target: default
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -writable-system
      script-env: |
        WEBVIEW_APK=artifacts/webview/SystemWebView.apk
        SOFT_FAIL=1
        SWEEP_ONLY=lknmjhcajhfbbglglccadlfdjbaiifig
        SWEEP_LAST=
      setup-script: |
        base=https://commondatastorage.googleapis.com/chromium-browser-snapshots/AndroidDesktop_x64
        rev=$(curl -fsSL "$base/LAST_CHANGE")
        echo "chromium snapshot revision $rev"
        curl -fsSL -o /tmp/chrome-android-desktop.zip "$base/$rev/chrome-android-desktop.zip"
        mkdir -p artifacts/webview
        unzip -j -o /tmp/chrome-android-desktop.zip chrome-android-desktop/apks/SystemWebView.apk -d artifacts/webview
        rm -f /tmp/chrome-android-desktop.zip
        curl -fsSL "$base/$rev/REVISIONS" > artifacts/webview/REVISIONS.json
        unzip -l artifacts/webview/SystemWebView.apk | grep -E "lib/[^/]+/libwebviewchromium.so"
        ls -la artifacts/webview
      timeout-minutes: 75
