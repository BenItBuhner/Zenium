name: TEMPORARY - compat round 21 sweep and frame budget trigger

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml or android-ext-runtime-demo.yml (HTTP 403 on the dispatches
# endpoint), and both stay dispatch-only; this file runs the same jobs on a push to the branch,
# and only for an EMPTY marker commit whose subject starts with the bracketed tokens below and
# carries no other bracketed word:
#   - `[sweep]`: the two sweep jobs over compat round 21's rows – the thirty of ranks 511-540
#     (`.github/scripts/ext-compat/next30-round18.json`, the five largest bundles last in the
#     table as round 20 ordered its own; their ids lead the lists below, ahead of the carried) and the
#     twenty-two rows carried from round 20 (its section 7 and the brief's regression list): the
#     two webRequest sniffer rows Chrono Download Manager (with its restart proof) and Video
#     Downloader PLUS and the #448 proof row as regression rows for the header stage
#     (onBeforeSendHeaders / onSendHeaders heard), the response stage and the extension-URL
#     exemption; rounds 17-20's fixed rows Markdown Viewer, Cursor Helper, NoteGPT, Toggl Track,
#     Buyhatke (its Flipkart leg on the isolated-world WebView; notOnGoogleImage on 113), Speak
#     Subtitles (its bundle speaking with zero ReferenceErrors), Infinity New Tab, Search by Image,
#     OP Auto Clicker and RoValra; tl;dv (zero re-executions) and SingleFile (with the six-pass lane
#     beside); round 20's proof rows Advanced Font Settings with the fonts probes A and B, the
#     privacy probe, iCloud Passwords (its published `passwords.offerToSave`) and the fonts page
#     probe (the seam row with the phone's Fonts page); and the seed row Zoom Video (the storage
#     round trip's `back` leg and its lost update, the order probe's measure). Round 19's open rows
#     the brief does not carry (Soda PDF Viewer, Responsive Viewer, 2048, Ice Dodo, Directo,
#     User-Agent Switcher and Manager) keep their rows in CompatSweep.kt and are in no list here.
#     AdGuard VPN, Buyhatke on 113, axe DevTools and Augmented Steam are notOnGoogleImage by rounds
#     16, 19 and 20, read on the AOSP lane when their rows run, and not re-run on the Google image.
#     `[sweep113]` fires the System WebView sweep job alone (with its rows-left check and second
#     boot) – only for a re-run the coordinator grants.
#     SWEEP_LAST and the rows-left job's LAST_IDS are empty for the sweep this round; the targeted
#     lane runs Adblock Ad Blocker Pro last (see `[lane]`).
#   - `[budget]`: the runtime demo's two jobs with the frame budget alone (ExtensionScrollBudget
#     under SKIP_DEMO=1: the long fixture scrolled with 0, 2, 3 and 6 extensions and the
#     fetch-heavy twin, the jank report in the job summary) and, ahead of it, EngineProbe.
#     `[budget113]` fires the System WebView budget job alone – only for a re-run the coordinator
#     grants.
#   - `[singlefile]`: SingleFile's row alone, repeated six times on one boot per WebView
#     (SWEEP_REPEAT=6: the driver grades the row again after its disable, each reading its own row
#     in results.json), R5's measure (round 18 section 6.1 row 04).
#   - `[lane]`: a targeted one-row-or-few lane (SWEEP_ONLY set by hand below: Zoom Video, Advanced
#     Font Settings, the fonts probes A and B, iCloud Passwords, the privacy probe and the fonts
#     page probe and the storage order probe, then Adblock Ad Blocker Pro last through SWEEP_LAST –
#     the capped-bucket fold's early read, after the probe rows are in should the app still die
#     there) for a runtime or driver change read on its own without the whole sweep.
# One run per marker push; a re-run past the one attempt is the coordinator's to grant.
# A sweep whose emulator went away under the driver (the shared workflow's `emulator-died`: qemu
# gone or the guest frozen, or the runner action's SDK download coming down broken) boots once more
# and sweeps the rows the first boot did not grade (read off the results.json the sweep script pulls
# after every row), the row that was in flight at the death last so a row that kills the emulator
# loses no row after it; the second boot's artifact is the first's name with `-2`.
