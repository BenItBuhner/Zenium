name: Android touch fix demo

# Records the phone chrome's touch fixes on a hardware-accelerated Android emulator and uploads
# the video and screenshots: the History, Bookmarks and Downloads panels with their per-row Remove
# buttons visible under a finger (and one entry removed by tapping it), and the find bar in its
# phone layout stepping through matches with the keyboard up. Dispatch-only, like the gesture
# demo: it says nothing about a change being correct. The build, the emulator and its caches live
# in android-emulator-demo.yml; this file only picks the driver and the colour scheme.
on:
  workflow_dispatch:
    inputs:
      theme:
        description: Colour scheme the profile is seeded with
        type: choice
        default: light
        options:
          - light
          - dark
  # TEMPORARY: runs the demo on this branch while the fixes are being verified.
  push:
    branches: [cursor/android-touchfix-ci-cache-a7c3]

permissions:
  contents: read

concurrency:
  group: android-touchfix-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Touch fix demo (${{ inputs.theme || 'light' }})
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.TouchFixDemo
        DEMO_DIR=touchfix-demo
        DEMO_OUT=artifacts/android-touchfix-demo
        DEMO_VIDEO=touchfix-demo-${{ inputs.theme || 'light' }}.mp4
        DEMO_THEME=${{ inputs.theme || 'light' }}
      artifact-name: android-touchfix-demo-${{ inputs.theme || 'light' }}
      artifact-path: artifacts/android-touchfix-demo/
