name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  bundle-windows:
    name: Bundle on a case-insensitive filesystem
    # Linux resolves `./Departures` and `./departures` to different files; Windows and macOS do
    # not. Bundling on Windows here catches module-name collisions before they break the
    # Windows and macOS release jobs (v0.3.18 was lost to exactly that).
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx electron-vite build

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Syntax, expression types, action inputs and shellcheck for every `run:` block.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  desktop:
    name: Desktop package (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bundle main, preload and renderer
        run: npx electron-vite build
      - name: Package an unpacked Linux build
        # Exercises the electron-builder configuration without producing installers;
        # the release workflow builds the real packages for every platform.
        run: npx electron-builder --linux --dir --publish never

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: npm ci
      - name: Build the chrome and page script
        run: npm run build:android:web
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug -PskipWeb --no-daemon --stacktrace
      - name: Check the APK is signed with the committed CI debug key
        # Debug builds share android/ci-debug.keystore so successive APKs install over each other.
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          apk="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          signer="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: *\([0-9a-fA-F]\{64\}\).*/\1/p' | head -1 | tr 'A-F' 'a-f')"
          expected="$(keytool -exportcert -rfc -keystore android/ci-debug.keystore -storepass zenium-ci-debug -alias zenium-ci-debug \
            | openssl x509 -noout -fingerprint -sha256 | sed 's/.*=//; s/://g' | tr 'A-F' 'a-f')"
          if [[ "$signer" != "$expected" ]]; then
            echo "::error::debug APK signer $signer is not the committed CI debug key $expected"
            exit 1
          fi
          echo "debug APK signed with the committed CI debug key $expected"
      - uses: actions/upload-artifact@v7
        with:
          name: zenium-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
