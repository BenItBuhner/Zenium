name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  bundle-windows:
    name: Bundle on a case-insensitive filesystem
    # Linux resolves `./Departures` and `./departures` to different files; Windows and macOS do
    # not. Bundling on Windows here catches module-name collisions before they break the
    # Windows and macOS release jobs (v0.3.18 was lost to exactly that).
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx electron-vite build

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Syntax, expression types, action inputs and shellcheck for every `run:` block.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  desktop-smoke-linux:
    name: Desktop boot smoke (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SMOKE_OUT: ${{ github.workspace }}/smoke-out
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bundle main, preload and renderer
        run: npx electron-vite build
      - name: Package an unpacked Linux build
        # Exercises the electron-builder configuration without producing installers;
        # the release workflow builds the real packages for every platform.
        run: npx electron-builder --linux --dir --publish never
      - name: Display tools (Xvfb; ffmpeg grabs the screenshots; xdotool drives the real clicks of both smokes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb ffmpeg x11-utils xdotool
      - name: Boot the unpacked build under Xvfb and walk through it
        # Playwright for Electron drives dist/linux-unpacked/zenium (the devDependency ships no
        # browsers; nothing to download). --no-sandbox: the unpacked build's chrome-sandbox helper
        # is not setuid and ubuntu-24.04 denies unprivileged user namespaces. Every profile lives
        # under a temporary XDG_CONFIG_HOME; the scenarios, their screenshots and result.json land
        # in smoke-out/unpacked. boot and restore run on every platform; the crash pair (a killed
        # run, then "Restore pages?") and the Chrome-preset shortcut walkthrough run here only
        # (clear-on-exit too, in the step after this one) –
        # the walkthrough ends with a pop-up opened by a real xdotool click on a button inside a
        # cross-origin iframe of a local fixture (the #142 regressions: the frame's gesture must
        # reach the pop-up blocker and the pop-up's page must run the page preload). Known bugs
        # are named through .github/smoke/known-failures.json.
        # --disable-gpu (both smoke steps): under Xvfb there is no GPU, and Chromium's GPU process
        # finds that out by probing GL through Mesa – some 190 MB of libgallium/libLLVM paged in
        # from the runner's disk on the run's first launch – before it settles on the software
        # compositor it would have used anyway. On 2026-09-22 (#327's merge ref) that probe left
        # the first launch's window without a single frame for 27 s, so the onboarding's click
        # timed out (#333). With the flag the GPU process skips the probe and starts as the
        # software compositor it ends up as: the same rendering path, a 47 MB GPU process instead
        # of 261 MB, and the first paint 31 ms after the DOM instead of 3.5 s on a disk throttled
        # to 6 MB/s locally. No effect on what the smokes check (chrome, tabs, restore, quit,
        # cookies); the sign-in smoke below runs without it, as before.
        run: >
          xvfb-run -a -s '-screen 0 1600x1000x24'
          node .github/smoke/smoke.mjs --exe dist/linux-unpacked/zenium --label unpacked
          --out "$SMOKE_OUT" --scenarios boot,restore,crash,walkthrough
          --extra-args="--no-sandbox --disable-gpu"
      - name: Clear browsing data on exit under Xvfb (the quit run, the owed clear at launch)
        # The clear-on-exit scenario (#310) on its own run of the harness, so its four launches
        # (two profiles: one seeded with privacy.clearOnExit = cookies + cache, one owed a clear
        # written into sitedata.json by hand) get their own log, result.json and screenshots under
        # smoke-out/clear-on-exit. The cookie comes from the same local fixture server the
        # walkthrough's pop-up step uses; the engine's clears are read off the main-process event
        # log, the outcome off sitedata.json (no owed marker after the quit), the cookie's absence
        # off the wire, the page and the jar. Runs after a red step above as well (its own
        # profiles, its own harness run): the verdict then has both results instead of a missing
        # one, and a first-launch failure up there is not this scenario's.
        if: ${{ !cancelled() }}
        run: >
          xvfb-run -a -s '-screen 0 1600x1000x24'
          node .github/smoke/smoke.mjs --exe dist/linux-unpacked/zenium --label clear-on-exit
          --out "$SMOKE_OUT" --scenarios clear-on-exit --extra-args="--no-sandbox --disable-gpu"
      - name: Make the unpacked build's sandbox helper setuid root (for the sandboxed leg)
        # Electron evaluates service-worker preload scripts in sandboxed renderers only, and
        # Zenium's chrome.* layer for MV3 background workers (src/preload/extension.ts, registered
        # as a service-worker preload) is one: a --no-sandbox leg, like every step above, cannot
        # observe it. Chromium's way into the sandbox where the kernel denies unprivileged user
        # namespaces (this runner's AppArmor default) is the setuid helper, root-owned and mode
        # 4755, as electron-builder's installers leave it and the unpacked build does not.
        if: ${{ !cancelled() }}
        run: |
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          ls -l dist/linux-unpacked/chrome-sandbox
      - name: MV3 worker preload under the sandbox (Xvfb)
        # The mv3-worker scenario on a sandboxed launch (--sandbox, no --no-sandbox): the fixture
        # extension under .github/smoke/fixtures/mv3-worker is installed and its worker must
        # start with Zenium's layer (chrome.permissions, windows, contextMenus defined).
        if: ${{ !cancelled() }}
        run: >
          xvfb-run -a -s '-screen 0 1600x1000x24'
          node .github/smoke/smoke.mjs --exe dist/linux-unpacked/zenium --label mv3-worker-sandboxed
          --out "$SMOKE_OUT" --scenarios mv3-worker --sandbox --extra-args="--disable-gpu"
      - name: MV3 worker preload without the sandbox (the negative)
        # The same scenario under --no-sandbox must find the layer absent: the proof that the
        # sandboxed leg above is the only one that can check it, and that a --no-sandbox run of
        # the walkthrough is not a pass for the worker preload.
        if: ${{ !cancelled() }}
        run: >
          xvfb-run -a -s '-screen 0 1600x1000x24'
          node .github/smoke/smoke.mjs --exe dist/linux-unpacked/zenium --label mv3-worker-no-sandbox
          --out "$SMOKE_OUT" --scenarios mv3-worker --extra-args="--no-sandbox --disable-gpu"
      - name: Verdict (log and step summary)
        if: always()
        run: >
          node .github/smoke/verdict.mjs --out "$SMOKE_OUT"
          --expect unpacked,clear-on-exit,mv3-worker-sandboxed,mv3-worker-no-sandbox
          --title linux-x64
      - name: Sign-in fidelity smoke test
        # After the boot smoke and its verdict, so a failure here never hides the boot results.
        # Boots the packaged build under Xvfb on its own (no automation flags, so the check on
        # navigator.webdriver is honest) and checks what a site sees: navigator.webdriver false,
        # Chrome's window.chrome members (Google's sign-in refuses a Chrome without chrome.app),
        # the reduced user agent, client hints and Accept-Language on the document request, FedCM
        # off, and a window.open pop-up – opened by a real gesture once the page is on screen
        # (sendInputEvent at the button, xdotool through X as the fallback) – that keeps its
        # opener and runs the page preload. Its log and, on failure, a screenshot of the display
        # go to smoke-out/signin, into the artifact below.
        run: >
          xvfb-run -a -s '-screen 0 1600x1000x24'
          node .github/scripts/desktop-signin-smoke.mjs dist/linux-unpacked/zenium
          --out "$SMOKE_OUT/signin"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-smoke-linux-x64
          path: smoke-out
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: npm ci
      - name: Build the chrome and page script
        run: npm run build:android:web
      - name: Unit tests, debug APK and the instrumentation drivers
        # compileDebugAndroidTestKotlin covers android/app/src/androidTest, which only the
        # dispatch-only android-*-demo workflows build; #46 broke it and this job stayed green.
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug compileDebugAndroidTestKotlin -PskipWeb --no-daemon --stacktrace
      - name: Check the APK is signed with the committed CI debug key
        # Debug builds share android/ci-debug.keystore so successive APKs install over each other.
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          apk="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          signer="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: *\([0-9a-fA-F]\{64\}\).*/\1/p' | head -1 | tr 'A-F' 'a-f')"
          expected="$(keytool -exportcert -rfc -keystore android/ci-debug.keystore -storepass zenium-ci-debug -alias zenium-ci-debug \
            | openssl x509 -noout -fingerprint -sha256 | sed 's/.*=//; s/://g' | tr 'A-F' 'a-f')"
          if [[ "$signer" != "$expected" ]]; then
            echo "::error::debug APK signer $signer is not the committed CI debug key $expected"
            exit 1
          fi
          echo "debug APK signed with the committed CI debug key $expected"
      - uses: actions/upload-artifact@v7
        with:
          name: zenium-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
