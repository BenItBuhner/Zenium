name: Android services-hardening demo

# Temporary, removed before the branch is marked ready: records the pop-up blocker, the
# external-app prompt and the HTTP sign-in dialog on an emulator against a demo server on the
# runner, and notes what the system says about the app's backup eligibility. The build, the
# emulator and the Gradle cache live in android-emulator-demo.yml.
on:
  push:
    branches: [cursor/services-hardening-24d1]

permissions:
  contents: read

jobs:
  record:
    name: Services hardening demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/services-hardening-demo.sh
      artifact-name: android-services-hardening-demo
      artifact-path: artifacts/android-services-hardening-demo/
