name: Android domReady verification

# TEMPORARY, for one run: the translate engine driver on the emulator, pushed from the domReady
# branch, to show the Spanish fixture is offered (esOnLoad) and detected readable (esReaderableOnLoad)
# with nothing asked of the tab, from the page's own dom-ready. The driver fails without either.
# Removed in the commit after the run; the permanent, dispatch-only android-translate-demo.yml stays.
on:
  push:
    branches:
      - cursor/services-android-domready-24d1

permissions:
  contents: read

concurrency:
  group: android-domready-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: domReady verification
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-translate-demo.sh
      artifact-name: android-domready-demo
      artifact-path: artifacts/android-translate-demo/
      timeout-minutes: 50
