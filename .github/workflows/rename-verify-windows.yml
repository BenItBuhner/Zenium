name: Rename verification (Windows)

# Temporary, branch-only: proves the Zen -> Zenium upgrade path on a real Windows runner.
# Installs the published v0.2.0 Zen setup silently, lets it create a profile, installs the
# Zenium setup built from this branch, and asserts that the Zen entry is gone, that Zenium
# launches, and that the profile moved to %APPDATA%\Zenium. Removed before the PR is marked ready.
on:
  push:
    branches: ['cursor/zenium-rename-efb5']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rename-verify-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Zen 0.2.0 -> Zenium on windows-latest
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Zenium x64 installer (scratch version 0.2.1-rename.1)
        run: |
          npm version 0.2.1-rename.1 --no-git-tag-version
          npx electron-vite build
          npx electron-builder --win --x64 --publish never
          Get-ChildItem dist | Format-Table Name, Length
      - name: Download the published Zen v0.2.0 installer
        run: |
          $url = 'https://github.com/BenItBuhner/Zenium/releases/download/v0.2.0/zen-chromium-0.2.0-x64-setup.exe'
          Invoke-WebRequest -Uri $url -OutFile zen-0.2.0-setup.exe
          Unblock-File zen-0.2.0-setup.exe
          (Get-FileHash zen-0.2.0-setup.exe -Algorithm SHA256).Hash
      - name: Install Zen 0.2.0, run it once, install Zenium, run it once
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $log = Join-Path $out 'rename-windows-upgrade.log'
          function Log($m) { $line = "[{0}] {1}" -f (Get-Date -Format 'HH:mm:ss'), $m; Write-Host $line; Add-Content -Path $log -Value $line }
          function Assert($cond, $m) { if ($cond) { Log "PASS: $m" } else { Log "FAIL: $m"; throw "assertion failed: $m" } }
          function Shot($name) {
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save((Join-Path $out $name), [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
              Log "screenshot $name"
            } catch { Log "screenshot $name failed: $_" }
          }
          function WaitFor($path, $seconds) {
            for ($i = 0; $i -lt $seconds; $i++) { if (Test-Path $path) { return $true }; Start-Sleep 1 }
            return (Test-Path $path)
          }
          function CloseApp($name) {
            $procs = Get-Process -Name $name -ErrorAction SilentlyContinue
            foreach ($p in $procs) { try { $null = $p.CloseMainWindow() } catch {} }
            Start-Sleep 5
            Get-Process -Name $name -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
          }
          $oldGuid = '1a1fcb04-afbe-586c-8201-726e3825a77b'
          $newGuid = 'b61a1b56-04bb-5d75-984d-4689c7ec909b'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $oldData = Join-Path $env:APPDATA 'Zen'
          $newData = Join-Path $env:APPDATA 'Zenium'

          Log "== 1. Zen 0.2.0 silent install"
          Start-Process -FilePath (Resolve-Path .\zen-0.2.0-setup.exe) -ArgumentList '/S' -Wait
          Assert (Test-Path "$uninstallKey\$oldGuid") "Zen 0.2.0 registered under the derived GUID $oldGuid"
          $old = Get-ItemProperty "$uninstallKey\$oldGuid"
          Log ("Zen entry: DisplayName='{0}' DisplayVersion='{1}' UninstallString='{2}'" -f $old.DisplayName, $old.DisplayVersion, $old.UninstallString)
          # electron-builder keeps InstallLocation in its install-info key HKCU\Software\<GUID>
          # (the same key build/installer.nsh reads); fall back to the uninstaller's directory.
          $oldInfo = Get-ItemProperty "HKCU:\Software\$oldGuid" -ErrorAction SilentlyContinue
          $oldDir = $oldInfo.InstallLocation
          if (-not $oldDir) { $oldDir = Split-Path -Parent (($old.UninstallString -split '"')[1]) }
          Log "Zen install dir: $oldDir"
          Assert (Test-Path $oldDir) "Zen install directory exists"
          $old | Add-Member -NotePropertyName InstallLocation -NotePropertyValue $oldDir -Force
          $oldExe = Join-Path $oldDir 'zen.exe'
          Assert (Test-Path $oldExe) "zen.exe present at $oldExe"
          $oldDesktopLnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Zen.lnk'
          Log "Zen desktop shortcut present: $(Test-Path $oldDesktopLnk)"

          Log "== 2. Zen 0.2.0 first launch (creates %APPDATA%\Zen)"
          Start-Process -FilePath $oldExe
          Assert (WaitFor (Join-Path $oldData 'zen') 90) "Zen wrote its profile to $oldData"
          Start-Sleep 12
          Shot 'rename-windows-01-zen-0.2.0-running.png'
          Log ("Zen windows: " + ((Get-Process -Name zen -ErrorAction SilentlyContinue | Where-Object MainWindowTitle | ForEach-Object MainWindowTitle) -join ' | '))
          $marker = Join-Path $oldData 'zen\rename-marker.txt'
          Set-Content -Path $marker -Value "seeded before the Zenium install $(Get-Date -Format o)"
          CloseApp zen
          Log ("Zen profile entries: " + ((Get-ChildItem $oldData | Select-Object -ExpandProperty Name) -join ', '))
          Assert (Test-Path (Join-Path $oldData 'zen\state.json')) "state.json exists in the Zen profile"

          Log "== 3. Zenium silent install (should remove Zen, keep %APPDATA%\Zen)"
          $newSetup = Get-ChildItem dist -Filter 'zenium-*-x64-setup.exe' | Select-Object -First 1
          Assert ($null -ne $newSetup) "Zenium installer built: $($newSetup.Name)"
          Start-Process -FilePath $newSetup.FullName -ArgumentList '/S' -Wait
          Assert (-not (Test-Path "$uninstallKey\$oldGuid")) "Zen uninstall entry removed"
          Assert (-not (Test-Path "HKCU:\Software\$oldGuid")) "Zen install-info key removed"
          Assert (-not (Test-Path $oldExe)) "zen.exe removed from $($old.InstallLocation)"
          Log "Zen install dir still present: $(Test-Path $old.InstallLocation)"
          Assert (-not (Test-Path $oldDesktopLnk)) "Zen desktop shortcut removed"
          Assert (Test-Path "$uninstallKey\$newGuid") "Zenium registered under GUID $newGuid"
          $new = Get-ItemProperty "$uninstallKey\$newGuid"
          Log ("Zenium entry: DisplayName='{0}' DisplayVersion='{1}' InstallLocation='{2}'" -f $new.DisplayName, $new.DisplayVersion, $new.InstallLocation)
          Assert ($new.DisplayName -eq 'Zenium') "Apps entry is named Zenium"
          $newExe = Join-Path $new.InstallLocation 'zenium.exe'
          Assert (Test-Path $newExe) "zenium.exe present at $newExe"
          Assert (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Zenium.lnk')) "Zenium desktop shortcut created"
          Assert (Test-Path $marker) "Zen profile survived the uninstall (marker still in %APPDATA%\Zen)"
          Assert (-not (Test-Path $newData)) "no %APPDATA%\Zenium before the first Zenium launch"
          Get-ChildItem $uninstallKey | ForEach-Object { $p = Get-ItemProperty $_.PSPath; if ($p.DisplayName -match 'Zen') { Log ("Apps entry: {0} {1} ({2})" -f $p.DisplayName, $p.DisplayVersion, $_.PSChildName) } }

          Log "== 4. Zenium first launch (should move %APPDATA%\Zen to %APPDATA%\Zenium)"
          Start-Process -FilePath $newExe
          Assert (WaitFor (Join-Path $newData 'zen\rename-marker.txt') 90) "marker file now in $newData"
          Assert (-not (Test-Path $oldData)) "%APPDATA%\Zen is gone (renamed, not copied)"
          Assert (Test-Path (Join-Path $newData 'zen\state.json')) "state.json migrated"
          Start-Sleep 12
          Shot 'rename-windows-02-zenium-running-after-migration.png'
          $titles = (Get-Process -Name zenium -ErrorAction SilentlyContinue | Where-Object MainWindowTitle | ForEach-Object MainWindowTitle)
          Log ("Zenium windows: " + ($titles -join ' | '))
          Assert (($titles | Where-Object { $_ -match 'Zenium' }).Count -ge 1) "a Zenium window is open"
          CloseApp zenium
          Log ("Zenium profile entries: " + ((Get-ChildItem $newData | Select-Object -ExpandProperty Name) -join ', '))
          Log "== done"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rename-verify-windows
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
