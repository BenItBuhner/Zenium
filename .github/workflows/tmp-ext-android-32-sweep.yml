name: TEMPORARY - compat round 26 sweep and frame budget trigger

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml or android-ext-runtime-demo.yml (HTTP 403 on the dispatches
# endpoint), and both stay dispatch-only; this file runs the same jobs on a push to the branch,
# and only for an EMPTY marker commit whose subject starts with the bracketed tokens below and
# carries no other bracketed word:
#   - `[sweep]`: the two sweep jobs over compat round 26's rows – the thirty of ranks 661-690
#     (`.github/scripts/ext-compat/next30-round23.json`, the five largest bundles last in the
#     table as rounds 19-25 ordered their own; their ids lead the lists below in rank order, ahead
#     of the carried) and the thirty rows carried from round 25 (its section 7 and the brief's
#     regression list): ADBLOCK AD BLOCKER PRO as the OOM class's regression row (the install, the
#     `configured … heap` line, ART's collector lines and the heap per step; its same-process
#     restart proof runs in the `[lane]` job, where it is the first row); COMPOSE AI (the watch
#     row – its peak per step); REDIRECT PATH (R26-1 – the hop's `onBeforeRedirect` traced on the
#     device, the row's ceiling PARTIAL by design: the landing item needs a document's
#     `onCompleted`, which the phone never emits; its own `[redirectpath]` job below reads it alone
#     for the trace); ROVALRA (R26-2 – the isolated world's cross-origin fetch under the page's
#     CSP, answered through the host for a URL the extension's host permissions cover; its
#     `www.rovalra.com/config.json` the measure); WEB HIGHLIGHTS (R26-4 – the mobile pass on 156,
#     the toolbox's shown state and a highlight's mount after a selection); WAYBACK MACHINE
#     (R26-4 – `#spn-btn` read inside `.flip-inside`); YOUTUBE DUAL SUBTITLES (R26-4 – its
#     `LOGIN_REQUIRED` the environment's, n/m); QR CODE READER (R26-4 – on 113 the Vision module's
#     absence on the runner named, n/m); BROWSER LOCK ON THE AOSP LANE ALONE – on the Google image
#     its `screen.html` took the host down four times in round 24 (qemu's GL calls under `-gpu
#     swangle`), so the System WebView sweep's list leaves it out and the `[browserlock]` job below
#     reads it alone under `swiftshader_indirect`; BLACK MENU; Web Scrobbler, Block Site and Mouse
#     Tooltip (round 25's new rows holding); Paperpile (the stated WebView blocker, F/n-m with
#     cause); Zoom Video (the storage round trip's `back` leg, medians 0-1 ms) and Temp Mail (its
#     own); Image Downloader (the fixture host item); Weava; Bitget Wallet (its WASM compile on the
#     main thread, the realm's settled limit); Super Simple Highlighter (R25-7/8); the two
#     webRequest sniffer rows Chrono Download Manager (with its restart proof) and Video Downloader
#     PLUS; iCloud Passwords (its `chrome.privacy 3/3` and the DNT key row); AdGuard Extra (its 156
#     world load's served-resource record); Page Assist and Enable Copy Paste; PerfectPixel and
#     Jungle Scout; the #448 proof row for the header stage, the response stage and the
#     extension-URL exemption; tl;dv (zero re-executions); round 20's fonts probes A and B, the
#     privacy probe and the fonts page probe. Not in the sweep's lists: SingleFile (its six-pass
#     `[singlefile]` jobs beside read it on both WebViews), round 21's storage order probe (in the
#     `[lane]` list), Note Board (the emulated worker page's `window` – round 15 §7.1's settled
#     limit, round 24's reading stands) and Telegram Video Downloader (closed in round 24 as its
#     own truthful PARTIAL). Rounds 24 and 25's other new rows keep their rows in CompatSweep.kt
#     and are in no list here. AdGuard VPN, Buyhatke on 113, axe DevTools and Augmented Steam are
#     notOnGoogleImage by rounds 16, 19 and 20, read on the AOSP lane when their rows run, and not
#     re-run on the Google image.
#     `[sweep113]` fires the System WebView sweep job alone (with its rows-left check and second
#     boot) and `[sweep156]` the AOSP-image sweep job alone (with its rows-left check and second
#     boot) – optional single-lane markers, only for a re-run the coordinator grants.
#     SWEEP_LAST and the rows-left job's LAST_IDS are empty for the sweep this round.
#   - `[budget]`: the runtime demo's two jobs with the frame budget alone (ExtensionScrollBudget
#     under SKIP_DEMO=1: the long fixture scrolled with 0, 2, 3 and 6 extensions and the
#     fetch-heavy twin, the jank report in the job summary) and, ahead of it, EngineProbe.
#     `[budget113]` fires the System WebView budget job alone – only for a re-run the coordinator
#     grants.
#   - `[singlefile]`: SingleFile's row alone, repeated six times on one boot per WebView
#     (SWEEP_REPEAT=6: the driver grades the row again after its disable, each reading its own row
#     in results.json), R5's measure (round 18 section 6.1 row 04).
#   - `[lane]`: a targeted few-row lane (SWEEP_ONLY set by hand below) for a runtime or driver
#     change read on its own without the whole sweep: Adblock Ad Blocker Pro FIRST – the boot's
#     first options-P row, so the driver's post-sweep restart proof (`restoredOptionsTab`, the
#     same-process start-over round 21b closed) runs on it and its install and restart are read on
#     both WebViews with the app alive, `(0 grown)` and the heap per step –, then Compose AI (the
#     watch row), Redirect Path (R26-1), RoValra (R26-2), Web Highlights (R26-4), Black Menu,
#     Popup Blocker (strict) (its popup's `confirm()` as the host's page-dialog sheet), the storage
#     order probe, Magical, and Reader View LAST OF ALL (round 23's R23-7: the stall poll's sink on
#     156 – a row that sinks loses nothing behind it). The driver runs the selected rows in ITS
#     TABLE's order with the SWEEP_LAST ids moved to the end in THEIR LIST's order (round 23's
#     `SweepOrder`); so the lane's SWEEP_LAST names the nine behind Adblock in the order they are
#     to run, Reader View last.
#   - `[redirectpath]`: Redirect Path's row alone on both WebViews (R26-1's trace run at main's
#     runtime plus the trace's log lines): the row's bridge from before the redirected fixture
#     loads to the popup's close in `bridge-redirect-path.txt`, the runtime's redirect-pair lines
#     in logcat (`ext.request document … redirectedFrom=`, `[zen] extensions: onBeforeRedirect …` /
#     `redirect pair … made no onBeforeRedirect`), the worker's `storage.session` dumped from the
#     popup. One boot per WebView, no second boot.
#   - `[browserlock]`: Browser Lock's row alone on the System WebView lane (API 34 Google image)
#     under the shared workflow's `emulator-gpu: swiftshader_indirect` (round 24's four host GL
#     deaths at `screen.html` were all under `swangle`, the default): graded, the column is filled
#     with the mode named; a host death again is the notOnGoogleImage-class mark with the evidence,
#     the row read on the AOSP lane alone. One boot, no second boot: the death is the reading.
# Every emulator job's driver step carries its own `timeout-minutes` below the job's cap
# (`driver-timeout-minutes`, round 23's optional input of the shared workflow): a driver that
# sinks past it is cut with the job still alive, so the artifact upload and the emulator-death
# reading run – round 22's AFTER lost its 156 sweep's artifact to the job cap.
# One run per marker push; a re-run past the one attempt is the coordinator's to grant.
# A sweep whose emulator went away under the driver (the shared workflow's `emulator-died`: qemu
# gone or the guest frozen, or the runner action's SDK download coming down broken) boots once more
# and sweeps the rows the first boot did not grade (read off the results.json the sweep script pulls
# after every row), the row that was in flight at the death last so a row that kills the emulator
# loses no row after it; the second boot's artifact is the first's name with `-2`.
