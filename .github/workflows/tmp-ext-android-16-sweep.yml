name: TEMPORARY - compat round 12 sweep and frame budget trigger

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml or android-ext-runtime-demo.yml (HTTP 403 on the dispatches
# endpoint), and both stay dispatch-only; this file runs the same jobs on a push to the branch:
#   - `[sweep]` in the commit message: the two sweep jobs over compat round 12's rows – the
#     thirty of ranks 241-270 (`.github/scripts/ext-compat/next30-round9.json`) and the rows
#     carried from rounds 9-11 (AITOPIA, Speechify, uVPN, Buyhatke, User-Agent Switcher, Video
#     Downloader PLUS, Mote, and Trust Wallet last on both WebViews: the row whose store
#     snapshots flooded WebView 156's Java heap in round 11b, measured before and after the
#     shim's bytes-in-flight bound);
#   - `[budget]` in the commit message: the runtime demo's two jobs with the frame budget alone
#     (ExtensionScrollBudget under SKIP_DEMO=1: the long fixture scrolled with 0, 2, 3 and 6
#     extensions, the jank report in the job summary) and, ahead of it, EngineProbe; the bound
#     sits on the page side of the path the budget watches.
# A sweep whose emulator went away under the driver (the shared workflow's `emulator-died`: qemu
# gone or the guest frozen, or the runner action's SDK download coming down broken) boots once more
# and sweeps the rows the first boot did not grade (read off the results.json the sweep script pulls
# after every row), the row that was in flight at the death last so a row that kills the emulator
# loses no row after it; the second boot's artifact is the first's name with `-2`.
on:
  push:
    branches:
      - cursor/android-ext-compat-12-4435

permissions:
  contents: read

concurrency:
  group: tmp-ext-android-16-sweep-${{ github.sha }}
  cancel-in-progress: false

jobs:
  system-webview:
    if: contains(github.event.head_commit.message, '[sweep]')
    name: System WebView (API 34 image)
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-ext-compat-sweep.sh
      artifact-name: android-ext-compat-sweep
      artifact-path: artifacts/android-ext-compat-sweep/
