name: Android overview demo

# Records the phone chrome's tab overview on a hardware-accelerated Android emulator and uploads
# the video and screenshots. Three sequences (the `demo` input): `overview` – the page morphing
# into its card at a slow drag, the Spaces drawer, tab groups made by holding and by dropping a
# card on another, collapsing, moving a tab between groups, and the group ribbon on the pill's
# swipe track; `first-tap` – the overview opened by the tabs button and by the pill swipe, with a
# card tapped right after each open and inside the two windows that used to lose the tap (the
# run fails when a first tap is lost); `swipe-reorder` – a card swiped part-way and let go, a
# card swiped off to close it, a card closed with its X, a card dragged to a new slot, a card
# dropped on another, and a group closed from its sheet; `motion` – the grid's choreography and
# drop-target state (v2 draft §11.4): the New Tab card's neighbour closed and a card dropped into
# a group (the New Tab card glides with the rest), a card dragged back out of the group under a
# finger the grid reflows under, a drag over the group cancelled, a card flung out of the group,
# the group's last card dragged out (the group dissolves), a group made by dropping a card on
# another, and a close in the dark scheme – the group sequences measured frame by frame, with a
# findings text of what the grid showed after every release. Dispatch-only, like the gesture demo: it
# takes about ten minutes and says nothing about a change being correct. Same caveats as the
# gesture demo about frame rate and the software GPU (springs advance at most 64 ms per frame,
# so at a handful of frames per second they run slower than on a phone). The build, the emulator
# and the Gradle cache live in android-emulator-demo.yml; this file only picks the driver and the
# demo it runs.
on:
  # TEMPORARY (the coordinator's one authorised OverviewDemo run on this head: no token in the
  # project can dispatch; no `demo` input on a push = the `overview` sequence); removed in the
  # next commit.
  push:
    branches: [cursor/android-harness-group-card-labels-cf22]
  workflow_dispatch:
    inputs:
      demo:
        description: Sequence to record
        type: choice
        default: overview
        options:
          - overview
          - first-tap
          - swipe-reorder
          - motion

permissions:
  contents: read

concurrency:
  group: android-overview-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: ${{ inputs.demo }} demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=${{ inputs.demo == 'first-tap' && 'app.zen.chromium.FirstTapDemo' || inputs.demo == 'swipe-reorder' && 'app.zen.chromium.SwipeReorderDemo' || inputs.demo == 'motion' && 'app.zen.chromium.OverviewMotionDemo' || 'app.zen.chromium.OverviewDemo' }}
        DEMO_DIR=${{ inputs.demo == 'first-tap' && 'firsttap-demo' || inputs.demo == 'swipe-reorder' && 'swipe-demo' || inputs.demo == 'motion' && 'motion-demo' || 'overview-demo' }}
        DEMO_OUT=artifacts/android-overview-demo
        DEMO_VIDEO=${{ inputs.demo == 'first-tap' && 'overview-firsttap-fix.mp4' || inputs.demo == 'swipe-reorder' && 'overview-swipe-reorder-demo.mp4' || inputs.demo == 'motion' && 'overview-motion-demo.mp4' || 'overview-groups-demo.mp4' }}
      artifact-name: android-overview-demo
      artifact-path: artifacts/android-overview-demo/
