name: Android overview demo

# Records the phone chrome's tab overview on a hardware-accelerated Android emulator and uploads
# the video and screenshots. Two sequences (the `demo` input): `overview` – the page morphing
# into its card at a slow drag, the Spaces drawer, tab groups made by holding and by dropping a
# card on another, collapsing, moving a tab between groups, and the group ribbon on the pill's
# swipe track; `first-tap` – the overview opened by the tabs button and by the pill swipe, with a
# card tapped right after each open and inside the two windows that used to lose the tap (the
# run fails when a first tap is lost). Dispatch-only, like the gesture demo: it takes about ten
# minutes and says nothing about a change being correct. Same caveats as the gesture demo about
# frame rate and the software GPU (springs advance at most 64 ms per frame, so at a handful of
# frames per second they run slower than on a phone). The build, the emulator and the Gradle
# cache live in android-emulator-demo.yml; this file only picks the driver and the demo it runs.
on:
  workflow_dispatch:
    inputs:
      demo:
        description: Sequence to record
        type: choice
        default: overview
        options:
          - overview
          - first-tap

permissions:
  contents: read

concurrency:
  group: android-overview-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: ${{ inputs.demo == 'first-tap' && 'first-tap' || 'overview' }} demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=${{ inputs.demo == 'first-tap' && 'app.zen.chromium.FirstTapDemo' || 'app.zen.chromium.OverviewDemo' }}
        DEMO_DIR=${{ inputs.demo == 'first-tap' && 'firsttap-demo' || 'overview-demo' }}
        DEMO_OUT=artifacts/android-overview-demo
        DEMO_VIDEO=${{ inputs.demo == 'first-tap' && 'overview-firsttap-fix.mp4' || 'overview-groups-demo.mp4' }}
      artifact-name: android-overview-demo
      artifact-path: artifacts/android-overview-demo/
