name: Android blocking demo (temporary, branch only)

# TEMPORARY per-branch caller for the services-blocking verification; removed before the PR is
# marked ready. Records BlockingDemo (androidTest) on the API 34 emulator.
on:
  push:
    branches: [cursor/services-blocking-24d1]

permissions:
  contents: read

jobs:
  record:
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.BlockingDemo
        DEMO_DIR=blocking-demo
        DEMO_OUT=artifacts/android-blocking-demo
        DEMO_VIDEO=services-blocking-android-demo.mp4
      artifact-name: android-blocking-demo
      artifact-path: artifacts/android-blocking-demo/
