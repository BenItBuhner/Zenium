name: Android tab search and Recent pane demo

# Records the phone overview's tab search (matrix TAB-21; design language v2 §9.3, §9.12, §11.4)
# and its Recent pane (TAB-02; §9.17, §9.27, §10.3): the header's magnifier opening the field
# pinned under the header (focused, the keyboard with it, and never before the tap), typing
# narrowing the pane's cards by title and by address with the dropped cards departing in place
# and the survivors gliding (traced), the count told to the status region, the X, the system
# back and Escape clearing then closing; a tab closed by touch and the Recent segment listing it
# under Recently closed with, sync off, §9.17's sentence and the row to Settings › Sync; then sync
# set up by the engine itself over a plain directory (the host's debug-only tree hook) with two
# other devices' open-tabs documents seeded, the devices and their tabs listed by publish and by
# activity, a remote row opening its page, a device heading held for Hide device and the way
# back, a Recently closed row restoring its tab. Every press is a real touch and the driver
# reads each outcome off the chrome's DOM or the core's state (findings text in the artifact;
# the run fails on a FAIL). Dispatch-only, like the select-tabs demo: it takes about ten minutes
# and says nothing about a change being correct. The build, the emulator and the Gradle cache
# live in android-emulator-demo.yml; this file only picks the driver.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tab-search-recent-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Tab search and Recent pane demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.TabSearchRecentDemo
        DEMO_DIR=tabsearch-demo
        DEMO_OUT=artifacts/android-tab-search-recent-demo
        DEMO_VIDEO=android-tab-search-recent-demo.mp4
      # The guest kernel's console in the log, should the emulator go away mid-demo.
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-tab-search-recent-demo
      artifact-path: artifacts/android-tab-search-recent-demo/

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Tab search and Recent pane demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.TabSearchRecentDemo
        DEMO_DIR=tabsearch-demo
        DEMO_OUT=artifacts/android-tab-search-recent-demo
        DEMO_VIDEO=android-tab-search-recent-demo.mp4
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-tab-search-recent-demo-second-boot
      artifact-path: artifacts/android-tab-search-recent-demo/
