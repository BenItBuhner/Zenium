name: Android page visibility demo

# Records page visibility on a tab switch (matrix OS-39) on a hardware-accelerated Android
# emulator: the loopback probe page in four kinds – a <video> with sound, the same clip muted, an
# <audio> track, timers only – played in front, the tab switched away through the core's
# `tab.activate` and read from behind (document.visibilityState, the visibilitychange events
# heard, paused and currentTime, the 100 ms interval's and requestAnimationFrame's cadence), then
# switched back; the control, Home with the clip with sound (the engine's own pause, MED-08's
# fact a); and the OS-08 case, the site allowed background-video and switched away. Every reading
# is a FACT line and every check a PASS/FAIL line of android-w6-s26-page-visibility-notes.txt in
# the artifact; a FAIL fails the run once the stills are taken. Dispatch-only, like the other
# demos: it says nothing about a change being correct beyond what the notes record. The build,
# the emulator and the Gradle cache live in android-emulator-demo.yml; this file only picks the
# driver. One more boot when the emulator itself went away under the driver (adb lost the
# device), and never when the driver failed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-page-visibility-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Page visibility demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.PageVisibilityDemo
        DEMO_DIR=media-demo
        DEMO_OUT=artifacts/android-page-visibility-demo
        DEMO_VIDEO=android-w6-s26-page-visibility-run.mp4
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-page-visibility-demo
      artifact-path: artifacts/android-page-visibility-demo/

  record-again:
    name: Page visibility demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.PageVisibilityDemo
        DEMO_DIR=media-demo
        DEMO_OUT=artifacts/android-page-visibility-demo
        DEMO_VIDEO=android-w6-s26-page-visibility-run.mp4
      emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -show-kernel
      artifact-name: android-page-visibility-demo-second-boot
      artifact-path: artifacts/android-page-visibility-demo/
