name: TEMPORARY - compat round 16 sweep and frame budget trigger

# TEMPORARY, removed before the PR is marked ready. Worker tokens cannot dispatch
# android-ext-compat-sweep.yml or android-ext-runtime-demo.yml (HTTP 403 on the dispatches
# endpoint), and both stay dispatch-only; this file runs the same jobs on a push to the branch:
#   - `[sweep]` in the commit message: the two sweep jobs over compat round 16's rows – the
#     thirty of ranks 361-390 (`.github/scripts/ext-compat/next30-round13.json`, filled in as the
#     round's rows land) and the rows carried from round 15 (its section 7: the two webRequest
#     sniffer rows Chrono Download Manager and Video Downloader PLUS as regression rows for the
#     response stage, class B INSSIST and Talend API Tester, class C Eneba and Buyhatke, Karma,
#     FoxyProxy's options on the 156 line, Tampermonkey BETA and Adobe Photoshop on the 113 engine
#     line, SingleFile and RSS Feed Reader's pending readings, and the sweep's own proof row for the
#     IP-literal mixed-content observation) on both WebViews;
#   - `[budget]` in the commit message: the runtime demo's two jobs with the frame budget alone
#     (ExtensionScrollBudget under SKIP_DEMO=1: the long fixture scrolled with 0, 2, 3 and 6
#     extensions and the fetch-heavy twin, the jank report in the job summary) and, ahead of it,
#     EngineProbe.
#   - `[sniff]` in the commit message: the two sweep jobs over the two webRequest sniffer rows alone
#     (Chrono Download Manager, Video Downloader PLUS: the response stage's regression read on both
#     fixtures), for a runtime change read on its own without the whole sweep.
#   - `[proof]` in the commit message: the two sweep jobs over the proof row alone (round 15's 5.11
#     fixture extensions, this round's IP-literal mixed-content observation read on both WebViews).
#   - the AdGuard VPN row (hhdobjgo…, rank 363) runs in a lane of its own on both WebViews, out of
#     the sweeps' lists, with `[sweep]` (beside the sweeps, so a death there costs no other row) or
#     alone with `[adguard]` (`[adguard113]`: the 113 lane alone, once 156 had passed the row
#     three times): the round's two BEFORE attempts on 113 both took the lane down at the
#     row's first painted document (boot 1: the app hung with its render thread in the pipe read
#     waiting for the host renderer's reply, the guest up; boot 2: the guest froze at consent.html's
#     paint and qemu stood three minutes more, then left with nothing said). The lane captures the
#     emulator's host side while it still stands (the sweep script's GUEST_SILENCE_S: the qemu
#     process's threads and stacks; the same inside its app-hang capture, HANG_SILENCE_S shortened),
#     samples the app's gfxinfo, and puts the guest kernel's console in the job log (-show-kernel);
#     whether the emulator's renderer or the guest's WebView dies under the row is read off it.
# A sweep whose emulator went away under the driver (the shared workflow's `emulator-died`: qemu
# gone or the guest frozen, or the runner action's SDK download coming down broken) boots once more
# and sweeps the rows the first boot did not grade (read off the results.json the sweep script pulls
# after every row), the row that was in flight at the death last so a row that kills the emulator
# loses no row after it; the second boot's artifact is the first's name with `-2`.
on:
  push:
    branches:
      - cursor/android-ext-compat-16-4435

permissions:
  contents: read

concurrency:
  group: tmp-ext-android-20-sweep-${{ github.sha }}
  cancel-in-progress: false

