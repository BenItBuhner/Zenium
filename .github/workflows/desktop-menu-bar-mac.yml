name: macOS menu bar capture (temporary)

# Temporary verification for the shortcuts-menus work: builds the unpacked macOS app, launches
# it, dumps Menu.getApplicationMenu() and captures the menu bar. Removed before the PR is reviewed.
on:
  push:
    branches: ['cursor/desktop-shortcuts-eabc']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-menu-bar-mac-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  menubar:
    name: Menu bar on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bundle main, preload and renderer
        run: npx electron-vite build
      - name: Package an unpacked macOS build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --dir --publish never
      - name: Install Playwright for Electron next to the driver
        working-directory: .github/scripts
        run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: Launch, dump the application menu, capture the menu bar
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/menubar-out"
          app=$(find dist -maxdepth 2 -name 'Zenium.app' -type d | head -1)
          if [[ -z "$app" ]]; then
            echo "::error::no Zenium.app under dist/"
            ls -la dist || true
            exit 1
          fi
          echo "Launching $app"
          sw_vers
          system_profiler SPDisplaysDataType | grep -E 'Resolution|UI Looks like' || true
          node .github/scripts/menubar-capture.mjs "$app/Contents/MacOS/Zenium" "$RUNNER_TEMP/menubar-out" | tee "$RUNNER_TEMP/menubar-out/run.log" || status=$?
          ls -la "$RUNNER_TEMP/menubar-out"
          exit "${status:-0}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: menu-bar-macos
          path: ${{ runner.temp }}/menubar-out
          if-no-files-found: error
          retention-days: 3
