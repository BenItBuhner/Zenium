name: Android emulator demo

# The recipe behind the Android demo workflows, shared through workflow_call: build the chrome and
# page script, the debug APK and the instrumentation driver, boot a hardware-accelerated emulator,
# run a driver script against it and upload whatever the script leaves under the artifact path.
# A caller picks the driver, names the artifact and, when the driver reads its configuration from
# the environment, hands that over too:
#
#   jobs:
#     record:
#       uses: ./.github/workflows/android-emulator-demo.yml
#       with:
#         script: .github/scripts/android-gesture-demo.sh
#         artifact-name: android-gesture-demo
#         artifact-path: artifacts/android-gesture-demo/
#
# script-env (NAME=value lines) is exported before setup-script and the driver run; setup-script is
# for what a demo needs beyond the build (another APK, a tool), and runs from the repository root.
#
# The frame statistics. A driver that measures its scenes through DemoHarness.measureFrames leaves
# `frames.jsonl` (one JSON line per scene) in its findings; after the driver, whatever the run
# left is rendered into the job summary (android-jank-report.mjs: scene, frames, janky share,
# percentiles, the long stage, the budget's verdict), handed on as the `jank-report` output (one
# JSON line) and uploaded as a small `jank-report-<artifact-name>` artifact kept 90 days – the
# one the release dry-run reads for main's latest table. `jank-gate` is the budget's gate: `soft`
# (the default) reports a scene over its budget, `hard` fails that scene (the harness raises a
# jank fault at the end of the run, like a touch fault). The numbers are the emulator recipe's own
# (a software GPU: see the header of JankBudget.kt) and compare on this recipe alone.
#
# One cache. gradle/actions/setup-gradle restores the Gradle user home, and only runs on main write
# it back (cache-read-only everywhere else, which is also the action's default): a branch reads what
# main's CI and demos saved and never publishes entries of its own. The AVD is not cached: in PR #34
# restoring the 2.8 GB snapshot took 28 to 33 s against the 28 s it saved on boot, a miss cost about
# 2 min more, and one entry is 28 percent of the 10 GB cache quota.
#
# The GPU. The hosted runners have none, so the emulator renders in software, and which renderer
# is its own input (emulator-gpu) rather than a word inside emulator-options, so that every caller
# inherits the one measured to hold: `swangle`, ANGLE over SwiftShader Vulkan. Under the previous
# default, `swiftshader_indirect` (the legacy SwiftShader GL translator), qemu itself exited on a
# fatal signal the moment the phone chrome painted Settings: every guest process stopped logging
# at once, adb reported the device offline, the guest kernel console (-show-kernel) had nothing to
# say. On the emulator 37.1.11 image that took seven of the nine boots of the site controls demo
# in runs 35355397692 to 35368888730 (the two that finished were second boots; the last run lost
# both), and the page controls demo's three deaths a minute into its recording (runs 35231597428,
# 35239580150, 35244924856) carry the same signature. `swangle` recorded the whole site controls
# demo, Settings painted three times over, on its first boot in run 35370429565. A `-gpu` a caller
# still carries in emulator-options gives way to emulator-gpu, so the default reaches it unchanged:
# in run 35373404276 the site controls demo on the plain defaults and the page controls demo handing
# in its old `-gpu swiftshader_indirect` string both came up with gles_mode_selected:swangle and ran
# to the end.
on:
  workflow_call:
    inputs:
      script:
        description: Bash driver run once the emulator is up, as a path from the repository root
        required: true
        type: string
      artifact-name:
        description: Name of the uploaded artifact
        required: true
        type: string
      artifact-path:
        description: What the driver leaves behind; uploaded even when the driver fails
        required: true
        type: string
      script-env:
        description: Environment for setup-script and the driver, one NAME=value per line
        required: false
        type: string
        default: ''
      setup-script:
        description: Bash run from the repository root after the build and before the emulator
        required: false
        type: string
        default: ''
      api-level:
        description: API level of the system image, e.g. 34 or 35-ext15
        required: false
        type: string
        default: '34'
      target:
        description: System image target
        required: false
        type: string
        default: google_apis
      arch:
        description: System image architecture
        required: false
        type: string
        default: x86_64
      profile:
        description: Hardware profile of the AVD
        required: false
        type: string
        default: pixel_6
      gradle-tasks:
        description: Gradle tasks and properties that build what the driver installs
        required: false
        type: string
        default: assembleDebug assembleDebugAndroidTest -PskipWeb
      disable-animations:
        description: Set the animator scales to 0 for the run (the WebView then reports prefers-reduced-motion)
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: Job timeout
        required: false
        type: number
        default: 45
      emulator-gpu:
        description: >-
          Renderer behind the emulator's -gpu flag (see the header): swangle, or swiftshader_indirect
          to reproduce the old behaviour; any -gpu inside emulator-options is replaced by this
        required: false
        type: string
        default: swangle
      emulator-options:
        description: >-
          The rest of the emulator's command line, -gpu excluded (a caller may add -show-kernel to see
          the guest kernel's console in the log)
        required: false
        type: string
        default: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
      jank-gate:
        description: >-
          How the jank budget acts on a scene over it (DemoHarness.measureFrames, JankBudget.kt):
          soft reports it in the summary, hard fails the scene; exported to the driver as JANK_GATE
        required: false
        type: string
        default: soft
    outputs:
      emulator-died:
        description: >-
          "true" when the emulator itself went away under the driver (adb lost the device) or
          never came up for it (the runner action failed before the driver ran) rather than the
          driver failing; a caller may boot once more on that alone
        value: ${{ jobs.record.outputs.emulator-died }}
      jank-report:
        description: >-
          The frame statistics the driver recorded, one JSON line: {"v":1,"gate":"soft"|"hard",
          "scenes":[one object per measured scene, as in frames.jsonl],"over":[scenes over their
          budget],"enforced":[the scenes that failed under a hard gate]}; empty scenes when the
          driver measured none
        value: ${{ jobs.record.outputs.jank-report }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  record:
    name: Record on an API ${{ inputs.api-level }} emulator
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      emulator-died: ${{ steps.emulator.outputs.died }}
      jank-report: ${{ steps.frames.outputs.report }}
    concurrency:
      # One emulator per demo and ref; a newer push supersedes the run still in progress.
      group: android-emulator-demo-${{ github.workflow }}-${{ inputs.artifact-name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: npm ci
      - name: Build the chrome and page script
        run: npm run build:android:web
      - name: Assemble the debug APK and the demo driver
        working-directory: android
        env:
          GRADLE_TASKS: ${{ inputs.gradle-tasks }}
        run: |
          read -ra tasks <<< "$GRADLE_TASKS"
          ./gradlew "${tasks[@]}" --no-daemon --stacktrace
      - name: Pass the jank gate to the driver
        # Before the caller's environment, so a JANK_GATE line in script-env still has the last word.
        env:
          JANK_GATE_INPUT: ${{ inputs.jank-gate }}
        run: |
          case "$JANK_GATE_INPUT" in
            soft | hard) ;;
            *) echo "::error::jank-gate must be soft or hard, not '$JANK_GATE_INPUT'"; exit 1 ;;
          esac
          echo "JANK_GATE=$JANK_GATE_INPUT" >> "$GITHUB_ENV"
      - name: Pass the caller's environment to the driver
        if: inputs.script-env != ''
        env:
          SCRIPT_ENV: ${{ inputs.script-env }}
        run: |
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$SCRIPT_ENV"
      - name: Prepare what the demo needs beyond the build
        if: inputs.setup-script != ''
        run: ${{ inputs.setup-script }}
      - name: Enable KVM for the emulator
        # https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Compose the emulator's command line
        # -gpu comes from emulator-gpu alone; one a caller still carries in emulator-options is dropped.
        id: cmdline
        env:
          EMULATOR_GPU: ${{ inputs.emulator-gpu }}
          EMULATOR_OPTIONS: ${{ inputs.emulator-options }}
        run: |
          if [ -z "$EMULATOR_GPU" ]; then
            echo "::error::emulator-gpu must name a renderer (swangle, swiftshader_indirect, ...)"
            exit 1
          fi
          read -ra given <<< "$EMULATOR_OPTIONS"
          kept=()
          skip=false
          for word in "${given[@]}"; do
            if [ "$skip" = true ]; then skip=false; continue; fi
            if [ "$word" = "-gpu" ]; then skip=true; continue; fi
            kept+=("$word")
          done
          options="-gpu $EMULATOR_GPU ${kept[*]}"
          echo "emulator command line: $options"
          echo "options=$options" >> "$GITHUB_OUTPUT"
      - name: Boot the emulator and run the driver
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          profile: ${{ inputs.profile }}
          cores: 3
          ram-size: 4096M
          heap-size: 512M
          emulator-options: ${{ steps.cmdline.outputs.options }}
          disable-animations: ${{ inputs.disable-animations }}
          # The marker says the emulator came up and the driver began (the action runs the lines
          # one by one, once the device is booted); the step below reads it.
          script: |
            touch "$RUNNER_TEMP/driver-started"
            bash ${{ inputs.script }}
      - name: Tell an emulator death from a driver failure
        # The driver script leaves emulator-died when adb lost the device (see the script). A run
        # the driver never began is the runner's failure too – the action fell over before the
        # boot handed over (in run 35380869542 the emulator package it installs came down as a
        # broken zip) – and counts the same way, so a caller's second boot covers both.
        id: emulator
        if: always()
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: |
          if [ -f "$ARTIFACT_PATH/emulator-died" ]; then
            echo "died=true" >> "$GITHUB_OUTPUT"
            echo "::warning::the emulator went away under the driver: $(cat "$ARTIFACT_PATH/emulator-died")"
          elif [ ! -f "$RUNNER_TEMP/driver-started" ]; then
            echo "died=true" >> "$GITHUB_OUTPUT"
            echo "::warning::the emulator never came up: the driver did not run"
          else
            echo "died=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Render the frame statistics
        # Every frames.jsonl the driver left (DemoHarness.measureFrames) as the job summary's table,
        # the `jank-report` output and the small artifact below; a run without one says so.
        id: frames
        if: always()
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: |
          node .github/scripts/android-jank-report.mjs summary "$ARTIFACT_PATH" \
            --gate "$JANK_GATE" --out "$RUNNER_TEMP/jank-report" >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::the frame statistics could not be rendered (see the step's log)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: warn
          retention-days: 14
      - name: Keep the frame statistics for the release's table
        # Small (the records and the rendered table alone), kept longer than the findings: the
        # release dry-run reads the newest of these on main (android-jank-report.mjs main).
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jank-report-${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/jank-report/
          if-no-files-found: ignore
          retention-days: 90
