name: Android boot probe

# Measures what a boot of the chrome costs on the Kotlin ⇄ chrome seam, before and after the boot
# handoff (`BootHandoff.kt`, `src/android/handoff.ts`), on the API 34 emulator: the same
# instrumentation driver (BootHandoffProbe) runs against the APK built from main and the one built
# from this ref, and the driver script tabulates the two (the table in PR #181 carries the numbers).
# Dispatch-only; the build, the emulator and the Gradle cache live in android-emulator-demo.yml.
on:
  workflow_dispatch:
  # Temporary: one measurement run for PR #181's review round; removed before the final head.
  push:
    branches: [cursor/android-host-boot-handoff-62e3]

permissions:
  contents: read

concurrency:
  group: android-boot-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Before (main) and after (this ref)
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-boot-probe.sh
      artifact-name: android-boot-probe
      artifact-path: artifacts/android-boot-probe/
      # The "before" APK: main built the same way the recipe built this ref (chrome, page script,
      # debug APK), from a worktree, into artifacts/before/. The Gradle user home is shared.
      setup-script: |
        set -euo pipefail
        git fetch --depth=1 origin main
        git worktree add --detach /tmp/before origin/main
        git -C /tmp/before rev-parse HEAD
        (cd /tmp/before && npm ci --no-audit --no-fund && npm run build:android:web)
        (cd /tmp/before/android && ./gradlew assembleDebug -PskipWeb --no-daemon --stacktrace)
        mkdir -p artifacts/before
        cp /tmp/before/android/app/build/outputs/apk/debug/*.apk artifacts/before/app-debug.apk
        git -C /tmp/before rev-parse HEAD > artifacts/before/sha.txt
        ls -la artifacts/before
      timeout-minutes: 75
