name: Android custom tabs demo

# Records Zenium as a Custom Tabs provider on a hardware-accelerated Android emulator: another
# app (the instrumentation APK's "Nimbus News") opens a story in a custom tab prepared the way a
# real client does (bindCustomTabsService, warmup, a session, a CustomTabsIntent with a toolbar
# colour, an action button and menu items), a link is followed and back steps within the tab, the
# toolbar hides on scroll, the menu opens, a caller item fires, find in page counts matches, Open
# in Zenium lands the live page in the browser window, a dark-scheme tab follows and X closes back
# to the caller. Dispatch-only,
# like the gesture demo: it takes about ten minutes and says nothing about a change being correct.
# The build, the emulator and the Gradle cache live in android-emulator-demo.yml; this file only
# picks the driver and the demo it runs.
on:
  workflow_dispatch:
  # Temporary (W5-10, removed before the PR is ready): the one evidence run for CCT-07 / CCT-11.
  push:
    branches:
      - cursor/android-custom-tabs-depth-9c30

permissions:
  contents: read

concurrency:
  group: android-customtabs-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Custom tabs demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.CustomTabsDemo
        DEMO_DIR=customtabs-demo
        DEMO_OUT=artifacts/android-customtabs-demo
        DEMO_VIDEO=android-customtabs-demo.mp4
      artifact-name: android-customtabs-demo
      artifact-path: artifacts/android-customtabs-demo/
