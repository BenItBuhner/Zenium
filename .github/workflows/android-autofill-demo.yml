name: Android autofill demo (temporary, branch only)

# Temporary caller for the services-password-fill engine branch: records the AutofillDemo driver
# (sign-in saved, filled through the picker, checkout card and address saved and filled, sensitive
# clipboard, autofill provider setting) on an emulator. Removed before the PR is marked ready.
on:
  push:
    branches: [cursor/services-password-fill-24d1]

permissions:
  contents: read

jobs:
  record:
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.AutofillDemo
        DEMO_DIR=autofill-demo
        DEMO_OUT=artifacts/android-autofill-demo
        DEMO_VIDEO=services-password-fill-android.mp4
      artifact-name: android-autofill-demo
      artifact-path: artifacts/android-autofill-demo/
