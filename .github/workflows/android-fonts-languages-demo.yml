name: Android fonts / languages UI demo

# Records the UI halves of the shared-services parity rows CT-23, CT-25, CT-41 and CT-36 on the
# phone (FontsLanguagesUiDemo, the shared Settings builder's rows and Reader View's Text
# preferences sheet), with the demo's own article open under them, served from the process:
# Colour scheme's picker sheet (its description "Websites follow this too.") and Dark picked
# under a finger with the open article's prefers-color-scheme following, the same document;
# Customise fonts – the Font size and Minimum font size ± rows stepped under fingers (§10.4: the
# value on the label's line moving on every press, the sequence committed once when it is quiet
# – the Android performance gate's ruling – and the open article reflowed on that one commit), the
# Standard font picker with each face drawn in itself, Reset once anything stands off the
# defaults; Preferred languages – the §10.4 item rows (German's row opening its item sheet, Move
# Up under a finger with the sheet standing), Add language's find-and-pick page with its filter
# typed into; Reader View's Text preferences – Translate as the head's one action row, its
# target picker (expanded at the checked German) translating on the pick, the row busy with the
# progress, the article turning German in place, Show original. The driver writes
# `fonts-languages-findings.txt` with a PASS or FAIL per check and fails when any did.
#
# The frames (DemoHarness.traceFrames, PERF-3's harness): the app menu's open and close as the
# point of reference, then every sheet, page and picker this PR adds, the two runs of step
# presses as gestures – each ONE scene for its whole sequence, with the ruling's claims beside
# the budget's: at most three long tasks over the sequence, exactly one `fonts.apply` in its
# trace, the row's value moved on every press (the long tasks counted by main-thread CPU where
# the trace has thread times, RULING 5, the wall count reported beside them), and one press on
# Font size's + before them as a reported scene, no claim (the single-press case is on a unit test);
# the core's startup sweeps held for the run (`holdBackgroundWork`) so no feed refresh lands in a
# measured scene, the Settings tab paid for off camera in the warm-up. The table lands in the job
# summary; the gate is soft unless dispatched hard. Dispatch-only, like the other demos: about ten
# minutes. The build, the emulator and the Gradle cache live in android-emulator-demo.yml; this
# file only picks the driver and the demo it runs.
on:
  workflow_dispatch:
    inputs:
      theme:
        description: Colour scheme the profile is seeded with (the demo flips to the other and back)
        required: false
        type: choice
        options:
          - light
          - dark
        default: light
      jank-gate:
        description: soft reports a scene over its budget in the summary, hard fails the run on it
        required: false
        type: choice
        options:
          - soft
          - hard
        default: soft

permissions:
  contents: read

concurrency:
  group: android-fonts-languages-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Fonts / languages UI demo
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      # The shared driver chooses the demo from its environment (see the script's header).
      script-env: |
        DEMO_CLASS=app.zen.chromium.FontsLanguagesUiDemo
        DEMO_DIR=fonts-languages-demo
        DEMO_OUT=artifacts/android-fonts-languages-demo
        DEMO_VIDEO=services-fonts-languages-android-ui-demo.mp4
        DEMO_THEME=${{ inputs.theme || 'light' }}
        DEMO_ARGS=-e holdBackgroundWork true
      jank-gate: ${{ inputs.jank-gate || 'soft' }}
      artifact-name: android-fonts-languages-demo
      artifact-path: artifacts/android-fonts-languages-demo/

  # One more boot when the emulator itself went away under the driver (adb lost the device), and
  # never when the driver failed: a run is then spent on the demo rather than on the runner.
  record-again:
    name: Fonts / languages UI demo, second boot
    needs: record
    if: ${{ failure() && needs.record.outputs.emulator-died == 'true' }}
    uses: ./.github/workflows/android-emulator-demo.yml
    with:
      script: .github/scripts/android-gesture-demo.sh
      script-env: |
        DEMO_CLASS=app.zen.chromium.FontsLanguagesUiDemo
        DEMO_DIR=fonts-languages-demo
        DEMO_OUT=artifacts/android-fonts-languages-demo
        DEMO_VIDEO=services-fonts-languages-android-ui-demo.mp4
        DEMO_THEME=${{ inputs.theme || 'light' }}
        DEMO_ARGS=-e holdBackgroundWork true
      jank-gate: ${{ inputs.jank-gate || 'soft' }}
      artifact-name: android-fonts-languages-demo-second-boot
      artifact-path: artifacts/android-fonts-languages-demo/
