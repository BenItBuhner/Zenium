<!doctype html>
<html><head><meta charset="utf-8"><title>Form Fixture</title>
<style>
  body{font:16px system-ui;margin:40px;max-width:720px}
  label{display:block;margin:14px 0 4px}
  input,select{font-size:16px;padding:6px}
  .spacer{height:1600px;background:linear-gradient(#fff,#eef)}
  #result{font-weight:bold;font-size:20px;margin-top:16px}
</style></head>
<body>
<h1>Registration form</h1>
<form id="reg" onsubmit="return false">
  <label for="name">Name</label>
  <input id="name" name="name" type="text" placeholder="Your name">
  <label for="colour">Favourite colour</label>
  <select id="colour" name="colour">
    <option value="red">Red</option>
    <option value="green" selected>Green</option>
    <option value="blue">Blue</option>
  </select>
  <label><input id="newsletter" name="newsletter" type="checkbox"> Subscribe to newsletter</label>
  <div class="spacer">(scroll down – the submit button is at the bottom of the page)</div>
  <button id="submit" type="button">Submit registration</button>
  <div id="result"></div>
</form>
<script>
  document.getElementById('submit').addEventListener('click', function () {
    var name = document.getElementById('name').value;
    var colour = document.getElementById('colour').value.toUpperCase();
    var news = document.getElementById('newsletter').checked ? 'NEWS' : 'NONEWS';
    var code = 'OK-' + name.length + '-' + colour + '-' + news;
    document.getElementById('result').textContent = 'Registered! Confirmation code: ' + code;
    document.title = 'Form Fixture [' + code + ']';
  });
</script>
</body></html>
