<!doctype html>
<html><head><meta charset="utf-8"><title>Hover Fixture</title>
<style>
  body{font:16px system-ui;margin:0;padding:24px;min-height:1200px}
  h1{margin:0 0 12px}
  #menu-trigger{position:absolute;left:40px;top:120px;padding:10px 18px;font-size:16px}
  #menu{display:none;position:absolute;left:40px;top:170px;background:#222;color:#fff;padding:12px 16px;border-radius:8px}
  #menu-trigger:hover + #menu, #menu.open{display:block}
  #coord-box{position:absolute;left:300px;top:200px;width:200px;height:100px;background:#3d8bff;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:8px}
  #tooltip{display:none;position:absolute;left:300px;top:310px;background:#ffd;border:1px solid #cc9;padding:8px 12px}
  #tooltip.open{display:block}
  #log{position:absolute;left:40px;top:420px;font-family:monospace;white-space:pre}
</style></head>
<body>
<h1>Hover Fixture</h1>
<p>Hover things to reveal hidden content. Nothing is revealed until you hover.</p>
<button id="menu-trigger">Products menu</button>
<div id="menu" role="menu">Hidden menu text: SECRET-MENU-4471</div>
<div id="coord-box">Hover box (300,200 – 500,300)</div>
<div id="tooltip" role="tooltip">Tooltip text: TOOLTIP-COORD-7731</div>
<div id="log">events:</div>
<script>
  var log = document.getElementById('log');
  var state = [];
  function mark(name, e) {
    state.push(name);
    log.textContent += '\n' + name + (e ? ' at ' + Math.round(e.clientX) + ',' + Math.round(e.clientY) + (e.isTrusted ? ' trusted' : ' synthetic') : '');
    document.title = 'Hover Fixture [' + state.join(',') + ']';
  }
  var trig = document.getElementById('menu-trigger');
  trig.addEventListener('mouseover', function (e) { document.getElementById('menu').classList.add('open'); mark('hovered:menu-trigger', e); });
  trig.addEventListener('mouseenter', function (e) { document.getElementById('menu').classList.add('open'); if (state.indexOf('hovered:menu-trigger') < 0) mark('hovered:menu-trigger', e); });
  var box = document.getElementById('coord-box');
  box.addEventListener('mouseover', function (e) { document.getElementById('tooltip').classList.add('open'); mark('hovered:coord-box', e); });
  box.addEventListener('mouseenter', function (e) { document.getElementById('tooltip').classList.add('open'); if (state.indexOf('hovered:coord-box') < 0) mark('hovered:coord-box', e); });
  box.addEventListener('click', function (e) { mark('clicked:coord-box', e); });
</script>
</body></html>
