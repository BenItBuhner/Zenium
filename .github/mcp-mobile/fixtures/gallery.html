<!doctype html>
<html><head><meta charset="utf-8"><title>Gallery Fixture</title>
<style>
  body{font:16px system-ui;margin:40px}
  .grid{display:flex;gap:24px;flex-wrap:wrap}
  .card{width:260px;border:1px solid #ddd;border-radius:8px;padding:12px}
  #chart{width:320px;height:200px;background:linear-gradient(135deg,#e0457b,#3d8bff);border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:24px 0}
  .tall{height:1400px;background:repeating-linear-gradient(#fafafa 0 60px,#eee 60px 120px)}
</style></head>
<body>
<h1>Gallery</h1>
<p>A page with a chart and some cards, for screenshot tests.</p>
<div id="chart" data-testid="chart">CHART 42%</div>
<div class="grid">
  <div class="card"><h3>Card A</h3><p>Red square below.</p><svg width="80" height="80"><rect width="80" height="80" fill="#d33"/></svg></div>
  <div class="card"><h3>Card B</h3><p>Green circle below.</p><svg width="80" height="80"><circle cx="40" cy="40" r="38" fill="#2fb344"/></svg></div>
  <div class="card"><h3>Card C</h3><p>Blue triangle below.</p><svg width="80" height="80"><polygon points="40,4 76,76 4,76" fill="#3d8bff"/></svg></div>
</div>
<div class="tall"><p style="padding:20px">Filler so the page is much taller than the viewport.</p></div>
<h2 id="bottom-heading">Bottom of the gallery – BOTTOM-MARK-6160</h2>
</body></html>
