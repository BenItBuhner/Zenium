version: 2
updates:
  # Keeps the actions used by the CI and release workflows on supported versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'
  # Electron tracks Chromium security releases; keep it and the toolchain moving. Minor and patch
  # bumps arrive as one PR a week, majors (Electron, Vite, electron-builder) come on their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
